<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Котозайцы-обжоры</title>
<style>
:root{--ink:#1d1838;--cream:#fff7e8;--cream2:#ffeccc;--yel:#ffc93c;--mint:#3fd8ad;--pink:#ff6fa8;--vio:#8f6bff;--sky:#5ab8ff;--red:#ff5e7a;--mut:#6b6394;--org:#ff9a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{--ff:"Nunito KZ","Nunito","Segoe UI",system-ui,sans-serif;--z:1}
html,body{margin:0;height:100%;overflow:hidden;background:#2b9a4b;color:#fff;font:800 15px/1.35 var(--ff);touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.btn{appearance:none;font:900 15px/1.15 var(--ff);color:var(--ink);background:var(--yel);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:15px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.mint{background:var(--mint)}.btn.pink{background:var(--pink)}.btn.sky{background:var(--sky)}.btn.white{background:#fff}.btn.vio{background:var(--vio);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.org{background:var(--org)}
.btn.big{font-size:21px;padding:14px 26px;border-radius:20px;box-shadow:0 6px 0 var(--ink)}
.btn.sm{font-size:13px;padding:6px 10px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.nope{opacity:.55}
.panel{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink)}
.pill{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 var(--ink);font-weight:900;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:4;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:10px;align-items:flex-start;zoom:var(--z)}
#hud>*{pointer-events:auto}
.coins{display:grid;gap:2px}
.coins .pill{font-size:22px;padding:5px 14px 5px 10px;display:flex;align-items:center;gap:6px}
.coins small{font-size:12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);padding-left:8px}
.stage{flex:1;max-width:460px;margin:0 auto;background:rgba(255,247,232,.96);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:6px 12px 8px}
.stage .t{display:flex;align-items:baseline;gap:8px;font-size:15px}
.stage .t b{font-size:18px}.stage .t span{margin-left:auto;font-size:13px;color:var(--mut)}
.bar{height:16px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin-top:4px;position:relative}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb36b,#ff6fa8);transition:width .15s}
.bar.max i{background:linear-gradient(90deg,#ffd84a,#ff9a3d,#ff6fa8,#c79bff);background-size:200% 100%;animation:shine 1.6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.bar em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11px;line-height:1;color:var(--ink)}
.tbtns{display:flex;gap:6px}
.ib{width:44px;height:44px;padding:0;font-size:20px;border-radius:14px}
/* bottom nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:6;display:flex;gap:7px;zoom:var(--z);max-width:calc(100vw - 16px);overflow-x:auto;padding:2px 4px 8px;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav .btn{flex-direction:column;gap:1px;padding:7px 10px 6px;min-width:72px;font-size:12px;position:relative}
#nav .btn .e{font-size:24px;line-height:1.05}
#nav .btn.on{background:var(--mint);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
#nav .dot{position:absolute;top:-6px;right:-5px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:11px;padding:1px 6px;display:none}
#nav .dot.on{display:block;animation:bop .8s ease-in-out infinite alternate}
@keyframes bop{to{transform:scale(1.18)}}
#nav .btn.ready{background:linear-gradient(135deg,#ffd84a,#ff9be0,#9fe8ff);animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 4px 0 var(--ink),0 0 22px 4px rgba(255,216,74,.85)}}
/* side sheet */
#sheet{position:fixed;z-index:7;background:var(--cream);color:var(--ink);border:4px solid var(--ink);display:none;flex-direction:column;overflow:hidden}
#sheet.on{display:flex}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:3px solid var(--ink);background:var(--cream2)}
#sheet .sh h2{margin:0;flex:1;font-size:22px;font-weight:1000}
#sheet .sb{overflow:auto;padding:12px;flex:1;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#sheet .sb::-webkit-scrollbar{width:10px}#sheet .sb::-webkit-scrollbar-thumb{background:#d9cdb5;border-radius:9px}
body.wide #sheet{top:calc(env(safe-area-inset-top) + 74px);right:12px;bottom:calc(env(safe-area-inset-bottom) + 96px);width:calc(410px * var(--z));border-radius:24px;box-shadow:0 6px 0 var(--ink)}
body.wide #sheet.xl{width:min(calc(760px * var(--z)),calc(100vw - 24px))}
body:not(.wide) #sheet{left:0;right:0;bottom:0;height:56%;border-radius:24px 24px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
body:not(.wide) #sheet.xl{height:86%}
body:not(.wide).sheet #nav{display:none}
.sheetin{zoom:var(--z)}
/* list items */
.it{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;margin-bottom:8px;box-shadow:0 3px 0 var(--ink)}
.it .ic{font-size:30px;width:48px;height:48px;border-radius:13px;background:var(--cream2);border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;color:var(--mut);font-size:12px;line-height:1.25}
.it .lv{font-size:12px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
.it.lock{opacity:.6;filter:grayscale(.6)}
.it .btn{min-width:96px;flex-direction:column;gap:0;font-size:14px;padding:6px 8px}
.it .btn small{font-size:10px;opacity:.75}
.seg{display:flex;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px}
.seg button{border:0;background:none;font:900 13px var(--ff);color:var(--ink);padding:6px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--yel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.note{background:#fff3c4;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;margin:0 0 10px;font-size:13px}
.note.g{background:#e6fff6}.note.p{background:#ffe6f1}
h4{margin:14px 2px 8px;font-size:16px}
/* wardrobe */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.wi{background:#fff;border:3px solid var(--ink);border-radius:15px;padding:6px 4px 7px;text-align:center;cursor:pointer;position:relative;box-shadow:0 3px 0 var(--ink)}
.wi canvas{width:84px;height:84px;display:block;margin:0 auto}
.wi b{display:block;font-size:12px;line-height:1.15;min-height:28px}
.wi small{display:block;font-size:11px;color:var(--mut)}
.wi.on{background:#e6fff6;box-shadow:0 0 0 3px var(--mint) inset,0 3px 0 var(--ink)}
.wi.lock canvas{opacity:.5;filter:grayscale(.8)}
.wi .r{position:absolute;top:4px;left:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
.preview{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.preview canvas{width:120px;height:120px;background:radial-gradient(#fff,#ffeccc);border:3px solid var(--ink);border-radius:18px;flex:none}
/* species */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.sp{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;text-align:center;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.sp canvas{width:110px;height:110px;display:block;margin:0 auto}
.sp b{display:block;font-size:14px}.sp small{display:block;font-size:11px;color:var(--mut);line-height:1.25}
.sp .bn{display:inline-block;margin-top:4px;background:var(--cream2);border:2px solid var(--ink);border-radius:9px;padding:1px 6px;font-size:11px;color:var(--ink)}
.sp.on{background:#e6fff6;box-shadow:0 0 0 3px var(--mint) inset,0 3px 0 var(--ink)}
.sp.lock{cursor:default}.sp.lock canvas{filter:brightness(0) opacity(.35)}
/* rebirth */
.rb{text-align:center}
.rb .btn.big{width:100%;white-space:normal}
.rb .big{font-size:46px;font-weight:1000;line-height:1;margin:4px 0}
.chk{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;margin:6px 0;text-align:left}
.chk .ok{font-size:22px}.chk .tx{flex:1}.chk small{display:block;color:var(--mut);font-size:12px}
.chk .bar{margin-top:5px;height:12px;border-width:2px}
.rew{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.rew span{background:#fff;border:3px solid var(--ink);border-radius:13px;padding:5px 10px;box-shadow:0 3px 0 var(--ink);font-size:14px}
/* settings */
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px dashed rgba(29,24,56,.15)}
.opt .tx{flex:1;min-width:160px}.opt small{display:block;color:var(--mut);font-size:12px}
.sw{width:54px;height:32px;border-radius:99px;border:3px solid var(--ink);background:#e8e2f6;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:var(--mint)}.sw.on:after{left:25px}
.rng{display:flex;align-items:center;gap:10px;min-width:200px;flex:1}.rng input{flex:1;accent-color:#3fd8ad;height:26px}.rng b{min-width:50px;text-align:right}
/* top */
.trow{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:2px dashed rgba(29,24,56,.12)}
.trow .pl{width:34px;text-align:center;font-size:18px;font-weight:1000;flex:none}
.trow .tx{flex:1;min-width:0}.trow .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trow .tx small{color:var(--mut);font-size:12px}
.trow .vl{font-size:16px;font-weight:1000;white-space:nowrap;text-align:right}
.trow.me{background:#e6fff6;border-radius:12px}
.trow canvas{width:44px;height:44px;flex:none}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,6,30,.55);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;text-align:center;animation:pop .28s cubic-bezier(.34,1.56,.64,1);border-radius:28px;border-width:4px;box-shadow:0 8px 0 var(--ink);zoom:var(--z)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.mbox h3{margin:0 0 6px;font-size:25px;font-weight:1000}
.mbox p{margin:6px 0 12px;color:#4a4370}
.mbtn{display:grid;gap:9px;margin-top:14px}.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rw{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.rw span{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
.form{text-align:left}.form label{display:block;font-size:13px;color:var(--mut);margin:10px 2px 4px}
.form input,.adm input,.adm select{width:100%;font:800 15px var(--ff);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:13px;padding:9px 11px;outline:none;box-shadow:0 3px 0 var(--ink);-webkit-user-select:text;user-select:text}
.err{color:#d42a4a;font-size:13px;min-height:18px;margin-top:8px}
.known{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%) translateY(-10px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:16px;padding:9px 16px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:25;text-align:center;max-width:90vw;zoom:var(--z)}
#toast.on{opacity:1;transform:translateX(-50%)}
/* ADM */
.adm{display:grid;gap:10px}.adm .panel{padding:12px}.adm h5{margin:0 0 8px;font-size:15px}
.adm .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.adm .row input,.adm .row select{width:auto;flex:1;min-width:110px}
.adml{display:grid;gap:6px}.adml>div{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;cursor:pointer}.adml>div span{flex:1}
.adml>div.on{background:#e6fff6;box-shadow:0 0 0 3px var(--mint) inset}
.plist{max-height:300px;overflow:auto}
/* rebirth cutscene */
#cut{position:fixed;inset:0;z-index:40;background:#000;display:none;opacity:0;transition:opacity .5s}
#cut.on{display:block}#cut.vis{opacity:1}
#cut video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#cut .skip{position:absolute;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 16px);opacity:0;transition:opacity .4s;pointer-events:none}
#cut .skip.on{opacity:.85;pointer-events:auto}
#cut .cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);text-align:center;font-size:clamp(20px,3.4vw,34px);font-weight:1000;color:#ffe9a0;text-shadow:0 3px 0 #000,0 0 22px rgba(255,200,80,.6);opacity:0;transition:opacity .6s}
#cut .cap.on{opacity:1}
#fade{position:fixed;inset:0;z-index:39;background:#000;pointer-events:none;opacity:0;transition:opacity 1.1s ease}
#fps{position:fixed;left:8px;bottom:8px;z-index:30;font:700 12px monospace;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px;display:none}
body.cover #hud,body.cover #nav,body.cover #sheet{display:none!important}
body.cutting #hud,body.cutting #nav,body.cutting #sheet{visibility:hidden}
@media (max-width:620px){.coins .pill{font-size:18px}.stage .t b{font-size:15px}.stage .t span{display:none}.ib{width:38px;height:38px;font-size:17px}#nav .btn{min-width:64px;padding:6px 4px 5px;font-size:10px}#toast{top:calc(env(safe-area-inset-top) + 150px)}#nav .btn .e{font-size:21px}#hud{flex-wrap:wrap}.stage{order:3;flex-basis:100%;max-width:none}.tbtns{margin-left:auto}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
 <div class="coins"><div class="pill" id="hCoins">🪙 0</div><small id="hRate">+0 / сек</small></div>
 <div class="stage" id="hStage"><div class="t"><b id="hSt">Стадия 1</b><i id="hTitle" style="font-style:normal">Скелетик</i><span id="hKg">⚖ 0,8 кг</span></div><div class="bar" id="hBarW"><i id="hBar"></i><em id="hBarT"></em></div></div>
 <div class="tbtns"><button class="btn white ib" data-a="acc" title="Аккаунт" id="bAcc">👤</button><button class="btn white ib" data-a="fs" title="Полный экран (F11)" id="bFs">⛶</button><button class="btn red ib" data-a="exit" title="Выйти в лаунчер" id="bExit">✕</button></div>
</div>
<div id="nav">
 <button class="btn" data-tab="food"><span class="e">🍖</span>Еда<span class="dot" id="dFood">!</span></button>
 <button class="btn" data-tab="help"><span class="e">👵</span>Помощники<span class="dot" id="dHelp">!</span></button>
 <button class="btn" data-tab="reb" id="nReb"><span class="e">🌀</span>Перерождение<span class="dot" id="dReb">!</span></button>
 <button class="btn" data-tab="sp"><span class="e">🐾</span>Виды<span class="dot" id="dSp">!</span></button>
 <button class="btn" data-tab="ward"><span class="e">👒</span>Гардероб</button>
 <button class="btn" data-tab="top"><span class="e">🏆</span>Топ</button>
 <button class="btn" data-tab="set"><span class="e">⚙</span>Настройки</button>
 <button class="btn vio" data-tab="adm" id="nAdm" style="display:none"><span class="e">🛠</span>ADM</button>
</div>
<div id="sheet"><div class="sh"><h2 id="shT"></h2><button class="btn white sm" data-a="close">✕</button></div><div class="sb"><div class="sheetin" id="shB"></div></div></div>
<div id="modal"><div class="mbox panel" id="mbox"></div></div>
<div id="toast"></div>
<div id="cut"><video id="vid" playsinline preload="auto"></video><div class="cap" id="cutCap"></div><button class="btn white sm skip" id="cutSkip">Пропустить ⏭</button></div>
<div id="fade"></div>

<script>
'use strict';
const CFG=window.FAT||{};
const A=window.KZAndroid||null;
const EMB=!!(CFG.embedded||window.parent!==window);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GAME_VER='1.0';
/* ---------- числа ---------- */
const SUF=['','тыс','млн','млрд','трлн','квдрлн','квинтлн','секстлн','септлн','октлн','нонлн','децлн'];
function fmt(n,dec){if(!isFinite(n))return'∞';n=Math.max(0,n);
 if(S&&S.set&&S.set.nums==='full'&&n<1e15)return Math.floor(n).toLocaleString('ru-RU');
 if(n<1000){if(dec&&n<100&&n%1)return(Math.floor(n*10)/10).toString().replace('.',',');return String(Math.floor(n))}
 const t=Math.floor(Math.log10(n)/3);if(t>=SUF.length)return n.toExponential(2).replace('.',',').replace('e+','e');
 const v=n/Math.pow(1000,t);return(v>=100?Math.floor(v):v>=10?Math.floor(v*10)/10:Math.floor(v*100)/100).toString().replace('.',',')+' '+SUF[t]}

/* ---------- аккаунт лаунчера ---------- */
function accDB(){try{return JSON.parse(LS.get('kz_accounts_v1'))||{}}catch(e){return{}}}
function saveDB(d){LS.set('kz_accounts_v1',JSON.stringify(d))}
let ACC='',NICK='Гость',IS_ADM=false,KEYU='';
function loadAcc(){const u=LS.get('kz_session'),db=accDB();ACC=u&&u!=='__guest'&&db[u]?u:'';const a=ACC?db[ACC]:null;
 NICK=ACC?(a.nick||ACC):'Гость';IS_ADM=ACC==='deta';KEYU='kz_fat_u_'+(ACC||'__guest')}
loadAcc();
function known(){try{return JSON.parse(LS.get('kz_known'))||[]}catch(e){return[]}}
function addKnown(u){const k=known().filter(x=>x!==u);k.unshift(u);LS.set('kz_known',JSON.stringify(k.slice(0,20)))}
function djb(u,p){const str='kz::'+u+'::'+p;let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return'd'+(h>>>0).toString(16)}

function tap(px,py,auto){const tc=tapCal(),cc=coinTap();
 const was=STAGE;if(STAGE<100){S.cal+=tc;S.tot.cal+=tc}S.coins+=cc;S.tot.coins+=cc;S.tot.taps++;if(S.coins>S.maxCoins)S.maxCoins=S.coins;calcStage();
 if(!auto){AN.sqv-=0.9;AN.chomp=1;AN.happy=0.25;SFX.chomp();if(S.set.vib&&Math.random()<.35)vib(8);
  if(S.set.fly&&V)spawnFood(px,py,true);
  if(S.set.pops){POPS.push({x:px+rnd(-14,14),y:py-8,vy:-90,life:.9,t:(STAGE<100||was<100?'+'+fmt(tc,1)+' 🍖  ':'')+'+'+fmt(cc,1)+' 🪙',c:'#fff'})}
  for(let i=0;i<Math.round(4*S.set.parts/100);i++)PARTS.push({x:px,y:py,vx:rnd(-160,160),vy:rnd(-240,-60),life:rnd(.4,.8),c:pick(['#ffd84a','#ff9a3d','#fff3c4']),r:rnd(2,4)})}
 if(STAGE>was)stageUp(was)}
function spawnFood(px,py,fromTap){if(!V)return;const fd=bestFood(),g=catGeom(V.U,AN.f);const tx=V.cx,ty=V.gy+g.hy+g.hr*0.47;
 let sx=px,sy=py;if(!fromTap||Math.hypot(px-tx,py-ty)<V.U*0.3){const a=rnd(-Math.PI,0);sx=tx+Math.cos(a)*V.U*1.1;sy=ty+Math.sin(a)*V.U*0.9}
 if(FLY.length>24)FLY.shift();FLY.push({sx,sy,tx,ty,t:0,d:.32,e:fd.e,rot:rnd(-3,3)})}
function stageUp(was){const n=STAGE;if(n>S.maxStage)S.maxStage=n;
 if(n>=100){SFX.max();BANNER={t:'🎉 МАКСИМАЛЬНЫЙ ЖИР!',s:'Набери '+fmt(rebCost(S.R))+' 🪙 и переродись',life:4};AN.shake=.6;burst(70);vib(60);save();renderNav();if(TAB==='reb')renderTab();return}
 if(Math.floor(n/10)>Math.floor(was/10)||n-was>=5){SFX.stage();BANNER={t:'Стадия '+n+' · '+stTitle(n),s:'⚖ '+kgOf(n,0).toFixed(1).replace('.',',')+' кг',life:2.2};burst(30)}
 else{tone(660+n*4,.08,'triangle',.05);for(let i=POPS.length-1;i>=0;i--)if(POPS[i].big)POPS.splice(i,1);if(!BANNER)POPS.push({x:V.cx,y:V.gy-V.U*1.3,vy:-60,life:1.2,t:'Стадия '+n+'!',c:'#ffe066',big:1})}}

let autoAcc=0,flyAcc=0,saveT=0,uiT=0;
function update(dt){AN.t+=dt;S.tot.time+=dt;
 // плавный рост
 const ft=STAGE>=100?1:(STAGE-1+FRAC)/99;AN.f+=(ft-AN.f)*Math.min(1,dt*3);
 AN.sqv+=(-AN.sq*90-AN.sqv*9)*dt;AN.sq+=AN.sqv*dt;AN.sq=clamp(AN.sq,-.25,.25);
 AN.chomp=Math.max(0,AN.chomp-dt*5);AN.happy=Math.max(0,AN.happy-dt);AN.shake=Math.max(0,AN.shake-dt);
 AN.nextBlink-=dt;if(AN.nextBlink<0){AN.blink=.12;AN.nextBlink=rnd(2,5)}AN.blink=Math.max(0,AN.blink-dt);
 AN.bob=Math.sin(AN.t*2)*V.U*0.006;
 // удержание
 if(HOLD){HOLD.t+=dt;if(HOLD.t>.28){HOLD.acc=(HOLD.acc||0)+dt*9;while(HOLD.acc>=1){HOLD.acc--;tap(HOLD.x,HOLD.y)}}}
 // помощники
 const ar=autoRate();if(ar>0&&!CUT.on){autoAcc+=ar*dt;const n=Math.floor(autoAcc);if(n>0){autoAcc-=n;const tc=tapCal()*n,cc=coinTap()*n,was=STAGE;if(STAGE<100){S.cal+=tc;S.tot.cal+=tc}S.coins+=cc;S.tot.coins+=cc;if(S.coins>S.maxCoins)S.maxCoins=S.coins;calcStage();if(STAGE>was)stageUp(was)}
  flyAcc+=Math.min(ar,5)*dt;if(flyAcc>=1){flyAcc=0;if(S.set.fly)spawnFood(0,0,false);AN.chomp=Math.max(AN.chomp,.6)}}
 for(let i=FLY.length-1;i>=0;i--){const o=FLY[i];o.t+=dt;if(o.t>=o.d){FLY.splice(i,1);AN.chomp=1;for(let k=0;k<Math.round(3*S.set.parts/100);k++)PARTS.push({x:o.tx,y:o.ty,vx:rnd(-120,120),vy:rnd(-160,-20),life:rnd(.3,.6),c:'#e8c27a',r:rnd(1.5,3)})}}
 for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;if(p.life<=0)PARTS.splice(i,1)}if(PARTS.length>400)PARTS.splice(0,PARTS.length-400);
 for(let i=POPS.length-1;i>=0;i--){const p=POPS[i];p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)POPS.splice(i,1)}if(POPS.length>40)POPS.splice(0,POPS.length-40);
 if(BANNER){BANNER.life-=dt;if(BANNER.life<=0)BANNER=null}
 saveT+=dt;if(saveT>3){saveT=0;save()}
 uiT+=dt;if(uiT>.12){uiT=0;hud()}}

function render(){const c=cx;c.setTransform(DPR,0,0,DPR,0,0);V=view();const sp=spById(S.sp);
 drawBg(c,S.eq.bg,W,H,V.gy,AN.t);
 let sx=0,sy=0;if(AN.shake>0&&S.set.shake){sx=rnd(-1,1)*AN.shake*10;sy=rnd(-1,1)*AN.shake*10}c.save();c.translate(sx,sy);
 // тень
 const g=catGeom(V.U,AN.f);c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(V.cx,V.gy,g.bw+V.U*0.25,V.U*0.06,0,0,TAU);c.fill();
 drawAura(c,S.eq.aura,V.cx,V.gy+g.hy*0.62,V.U*(0.9+AN.f*0.45),AN.t);
 if(STAGE>=100){const r=V.U*1.3,gr=c.createRadialGradient(V.cx,V.gy-V.U*0.5,0,V.cx,V.gy-V.U*0.5,r);gr.addColorStop(0,'rgba(255,230,120,.35)');gr.addColorStop(1,'rgba(255,230,120,0)');c.fillStyle=gr;c.fillRect(V.cx-r,V.gy-V.U*0.5-r,r*2,r*2)}
 drawCat(c,V.cx,V.gy,V.U,AN.f,sp,S.eq,{t:AN.t,sq:AN.sq,chomp:AN.chomp,blink:AN.blink>0,happy:AN.happy>0&&AN.chomp<.2,bob:AN.bob});
 if(sp.feat==='universe'){for(let i=0;i<6;i++){const a=AN.t*0.6+i,r=V.U*(1.05+0.2*Math.sin(AN.t+i));c.fillStyle='rgba(255,240,200,.8)';starP(c,V.cx+Math.cos(a)*r,V.gy-V.U*0.55+Math.sin(a)*r*0.6,4);c.fill()}}
 // летящая еда
 c.textAlign='center';c.textBaseline='middle';
 for(const o of FLY){const k=o.t/o.d,e=k*k,x=lerp(o.sx,o.tx,e),y=lerp(o.sy,o.ty,e)-Math.sin(k*Math.PI)*V.U*0.25,s=V.U*(0.16-0.08*k);c.save();c.translate(x,y);c.rotate(o.rot*k);c.font=Math.round(s)+'px sans-serif';c.fillText(o.e,0,0);c.restore()}
 for(const p of PARTS){c.globalAlpha=Math.min(1,p.life*2);c.fillStyle=p.c;if(p.star){starP(c,p.x,p.y,p.r*1.6);c.fill()}else{c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill()}}c.globalAlpha=1;
 c.restore();
 for(const p of POPS){c.globalAlpha=Math.min(1,p.life*2);c.font=(p.big?'900 30px ':'900 19px ')+'"Nunito KZ",Nunito,"Segoe UI",sans-serif';c.lineWidth=5;c.strokeStyle='rgba(29,24,56,.85)';c.strokeText(p.t,p.x,p.y);c.fillStyle=p.c;c.fillText(p.t,p.x,p.y)}c.globalAlpha=1;
 if(BANNER){const a=Math.min(1,BANNER.life*2,(2.4-BANNER.life+2)*2),y=V.y0+Math.min(80,V.U*0.35);c.globalAlpha=clamp(a,0,1);let fs=Math.round(clamp(V.U*0.17,22,48));c.font='900 '+fs+'px "Nunito KZ",Nunito,"Segoe UI",sans-serif';const mw=c.measureText(BANNER.t).width,aw=(V.x1-V.x0)*0.92;if(mw>aw){fs=Math.floor(fs*aw/mw);c.font='900 '+fs+'px "Nunito KZ",Nunito,"Segoe UI",sans-serif'}c.lineWidth=8;c.strokeStyle=INK;c.strokeText(BANNER.t,V.cx,y);c.fillStyle='#ffe066';c.fillText(BANNER.t,V.cx,y);if(BANNER.s){c.font='900 '+Math.round(fs*.5)+'px "Nunito KZ",Nunito,"Segoe UI",sans-serif';c.lineWidth=5;c.strokeText(BANNER.s,V.cx,y+fs*0.8);c.fillStyle='#fff';c.fillText(BANNER.s,V.cx,y+fs*0.8)}c.globalAlpha=1}
 if(!S.tot.taps&&!TAB){const y=V.gy-V.U*1.45+Math.sin(AN.t*4)*6;c.font='900 '+(W<500?15:22)+'px "Nunito KZ",Nunito,"Segoe UI",sans-serif';c.lineWidth=6;c.strokeStyle=INK;const tx=A||matchMedia('(pointer:coarse)').matches?'👆 Нажимай на котозайца — корми его!':'👆 Кликай по котозайцу (или пробел) — корми его!';c.strokeText(tx,V.cx,Math.max(V.y0+20,y));c.fillStyle='#fff';c.fillText(tx,V.cx,Math.max(V.y0+20,y))}}

 $('#hSt').textContent='Стадия '+STAGE+(STAGE<100?' / 100':'');$('#hTitle').textContent='· '+stTitle(STAGE);$('#hKg').textContent='⚖ '+kgOf(STAGE,FRAC).toFixed(1).replace('.',',')+' кг'+(S.R?' · 🌀 '+S.R:'');
 const mx=STAGE>=100;$('#hBarW').classList.toggle('max',mx);$('#hBar').style.width=(mx?Math.min(100,S.coins/rebCost(S.R)*100):FRAC*100)+'%';
 $('#hBarT').textContent=mx?(S.coins>=rebCost(S.R)?'🌀 Можно переродиться!':'Для перерождения: '+fmt(S.coins)+' / '+fmt(rebCost(S.R))+' 🪙'):'до стадии '+(STAGE+1)+': '+fmt(need(STAGE+1,S.R)-S.cal)+' 🍖';
 renderNav();if(TAB&&(TAB==='food'||TAB==='help'||TAB==='reb'))softTab()}
function renderNav(){const af=FOODS.some((f,i)=>S.coins>=foodCost(i,S.food[i])&&(i===0||S.food[i-1]>0||S.food[i]>0)),ah=HELPERS.some((h,i)=>S.coins>=helpCost(i,S.help[i])&&(i===0||S.help[i-1]>0||S.help[i]>0));
 $('#dFood').classList.toggle('on',af&&TAB!=='food');$('#dHelp').classList.toggle('on',ah&&TAB!=='help');const cr=canReb();$('#nReb').classList.toggle('ready',cr);$('#dReb').classList.toggle('on',cr&&TAB!=='reb');

const TABN={food:'🍖 Еда',help:'👵 Помощники',reb:'🌀 Перерождение',sp:'🐾 Виды котозайцев',ward:'👒 Гардероб',top:'🏆 Топ обжор',set:'⚙ Настройки',adm:'🛠 ADM-панель'};

 const L=TAB==='food'?FOODS:HELPERS,cf=TAB==='food'?foodCost:helpCost,lv=TAB==='food'?S.food:S.help;
 L.forEach((x,i)=>{const b=document.querySelector(`[data-buy="${TAB}"][data-i="${i}"]`);if(!b)return;const[n,c]=buyInfo(cf,i,lv[i]);b.classList.toggle('nope',S.coins<c||n<1)});

 let shown=0;L.forEach((x,i)=>{const vis=i===0||lv[i]>0||lv[i-1]>0;if(!vis){if(shown===i){h+=`<div class="it lock"><div class="ic">❓</div><div class="tx"><b>???</b><small>Купи «${esc(L[i-1].n)}», чтобы открыть</small></div></div>`}return}shown=i+1;
  const[n,c]=buyInfo(cf,i,lv[i]),val=t==='food'?'+'+fmt(x.cal*mCal(),1)+' 🍖 за нажатие':'+'+fmt(x.rate*(1+spBonus('a')/100),1)+' кормл./сек';
  h+=`<div class="it"><div class="ic">${x.e}</div><div class="tx"><b>${esc(x.n)}<span class="lv">ур. ${lv[i]}</span></b><small>${esc(x.d)} · ${val}</small></div><button class="btn ${t==='food'?'org':'sky'} ${S.coins<c?'nope':''}" data-buy="${t}" data-i="${i}">${fmt(c)} 🪙<small>купить ×${n}</small></button></div>`});
 return h}
function doBuy(t,i){const cf=t==='food'?foodCost:helpCost,lv=t==='food'?S.food:S.help;const[n,c]=buyInfo(cf,i,lv[i]);if(S.coins<c){SFX.low();toast('Не хватает монет — нужно '+fmt(c)+' 🪙');return}

function mqPkt(h,body){const len=[];let n=body.length;do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d)}while(n>0);const out=new Uint8Array(1+len.length+body.length);out[0]=h;out.set(len,1);out.set(body,1+len.length);return out}
class MQ{
 constructor(url){this.url=url;this.ok=false;this.subs=new Set();this.buf=new Uint8Array(0);this.pid=1;this.tries=0;this.open()}
 open(){let ws;try{ws=new WebSocket(this.url,['mqtt'])}catch(e){this.retry();return}this.ws=ws;ws.binaryType='arraybuffer';this.buf=new Uint8Array(0);
  ws.onopen=()=>{this.raw(mqPkt(0x10,[...mqStr('MQTT'),4,2,0,60,...mqStr('kf'+Math.random().toString(36).slice(2,12))]))};
  ws.onmessage=e=>{if(e.data instanceof ArrayBuffer)this.feed(new Uint8Array(e.data))};
  ws.onclose=()=>{this.ok=false;clearInterval(this.ka);this.retry()};ws.onerror=()=>{try{ws.close()}catch(e){}}}
 retry(){this.tries++;clearTimeout(this.rt);this.rt=setTimeout(()=>this.open(),Math.min(30000,1500*this.tries))}
 feed(chunk){const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
  while(this.buf.length>=2){let mul=1,len=0,i=1,byte;do{if(i>=this.buf.length)return;byte=this.buf[i++];len+=(byte&127)*mul;mul*=128}while(byte&128);
   if(this.buf.length<i+len)return;const h=this.buf[0],body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);this.handle(h,body)}}
 handle(h,body){const t=h>>4;
  if(t===2){if(body[1]===0){this.ok=true;this.tries=0;for(const x of this.subs)this.sendSub(x);clearInterval(this.ka);this.ka=setInterval(()=>this.raw(new Uint8Array([0xC0,0])),25000);setTimeout(netPresence,300);admSoon();topSoon()}else{try{this.ws.close()}catch(e){}}}
  else if(t===3){const qos=(h>>1)&3,tl=(body[0]<<8)|body[1];const topic=mqDec.decode(body.subarray(2,2+tl));let o=2+tl;if(qos)o+=2;netRecv(topic,body.subarray(o))}}
 raw(pk){try{if(this.ws&&this.ws.readyState===1)this.ws.send(pk)}catch(e){}}
 sendSub(topic){this.pid=(this.pid%65535)+1;this.raw(mqPkt(0x82,[this.pid>>8,this.pid&255,...mqStr(topic),0]))}
 sub(topic){if(this.subs.has(topic))return;this.subs.add(topic);if(this.ok)this.sendSub(topic)}
 pub(topic,obj,retain){if(!this.ok)return false;const pl=mqEnc.encode(JSON.stringify(obj)),tp=mqStr(topic),body=new Uint8Array(tp.length+pl.length);body.set(tp);body.set(pl,tp.length);this.raw(mqPkt(retain?0x31:0x30,body));return true}}

 $('#shB').innerHTML=h+'</div>';
 const q=$('#aQ');if(q){q.oninput=e=>{admQ=e.target.value.trim().toLowerCase();const p=q.selectionStart;renderAdm();const q2=$('#aQ');q2.focus();q2.setSelectionRange(p,p)}}}
function admQuick(k){if(k==='stage'){S.cal=need(100,S.R)+1;calcStage();stageUp(99)}if(k==='coins'){S.coins=Math.max(S.coins,rebCost(S.R));toast('🛠 Монеты на перерождение')}save();hud();if(TAB)renderTab()}
async function admGift(op,toAll){const a={},v=id=>{const e=$(id);return e?e.value.trim():''};
 if(op==='coins')a.n=+v('#gC')||0;if(op==='reb')a.n=Math.max(1,parseInt(v('#gR'),10)||1);if(op==='sp')a.k=v('#gS');if(op==='acc')a.k=v('#gA');
 if(op==='msg'){a.t=v('#gM');if(!a.t){toast('Напиши сообщение');return}}
 const sel=toAll?'*':admSel;if(!sel){toast('Сначала выбери игрока в списке');return}
 const it={id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),op,a,ts:Date.now()},label=giftApply(defSave(),it)||op;
 const tg=sel==='*'?null:admTargets().find(x=>x.id===sel);
 if(tg&&tg.local){if(tg.u===ACC){S.seen[it.id]=Date.now();giftApply(S,it);calcStage();save()}else{const sv=Object.assign(defSave(),readSave(tg.u)||{});sv.seen=sv.seen||{};sv.seen[it.id]=Date.now();giftApply(sv,it);LS.set('kz_fat_u_'+tg.u,JSON.stringify(sv))}SFX.buy();toast('✅ '+label+' → '+tg.nick);admLog('✅ '+label+' → @'+tg.u);renderAdm();hud();return}
 if(!SIGK){toast('🔑 Сначала введи пароль ADM');const p=$('#aPw');if(p)p.focus();return}
 if(!NET.ok()){toast('Нет связи с сервером, попробуй через минуту');return}
 const to=sel==='*'?'*':tg.gid;let out={};try{out=JSON.parse(LS.get('kz_fat_admout'))||{}}catch(e){}
 const list=(out[to]||[]).filter(x=>Date.now()-x.ts<30*864e5).concat(it).slice(-20);out[to]=list;LS.set('kz_fat_admout',JSON.stringify(out));
 await signPub(LTP+'in/'+(to==='*'?'all':to),{to,list,ts:Date.now()});
 if(to==='*'){S.seen[it.id]=Date.now();giftApply(S,it);calcStage();save()}
 SFX.buy();toast('📤 '+label+' → '+(tg?tg.nick:'всем')+(tg&&Date.now()-tg.last>180000?' (получит, когда зайдёт)':''));admLog('📤 '+label+' → '+(tg?'@'+tg.u:'всем'));renderAdm();hud()}
async function admWorld(k){if(!SIGK){toast('🔑 Сначала введи пароль ADM');return}if(!NET.ok()){toast('Нет связи с сервером, попробуй через минуту');return}
 const w=Object.assign({},WORLD,{ts:Date.now()}),m=v=>Math.max(1,Math.min(24*60,+v||1))*60000;
 if(k==='x2')w.x2=Date.now()+m($('#wX').value);if(k==='x2off')w.x2=0;
 if(k==='ann'){const t=$('#wA').value.trim();if(!t){toast('Напиши текст объявления');return}w.ann={id:Date.now().toString(36),t:t.slice(0,200),ts:Date.now()}}
 await signPub(LTP+'w',w);WORLD=w;if(w.ann)S.seen['a'+w.ann.id]=Date.now();save();const L={x2:'🪙 x2 монеты включены',x2off:'🪙 x2 выключены',ann:'📢 объявление отправлено'}[k];toast(L);admLog(L);renderAdm();hud()}
async function admAct(k,el){const v=id=>{const e=$(id);return e?e.value.trim():''},dv=el&&el.dataset.v;
 if(k==='unlock'){const pw=v('#aPw');if(!pw)return;el.disabled=true;try{await admUnlock(pw);NET.start();toast('🔓 Пароль ADM принят');admLog('🔓 вход по паролю ADM')}catch(x){toast('Неверный пароль ADM');el.disabled=false;return}renderAdm();return}
 if(k==='coin'){S.coins+=+dv;admLog('🪙 +'+fmt(+dv)+' себе')}
 if(k==='coinset'){const x=+v('#aCo');if(!(x>=0)){toast('Введи число');return}S.coins=x;admLog('🪙 = '+fmt(x))}
 if(k==='stage'){const n=+dv;S.cal=n<=1?0:need(n,S.R)+1;STAGE=1;calcStage();AN.f=STAGE>=100?1:(STAGE-1)/99;admLog('⚖ стадия '+n)}
 if(k==='rset'||k==='rplus'){const x=k==='rplus'?S.R+1:parseInt(v('#aR'),10);if(!(x>=0)){toast('Введи число');return}S.R=x;for(const s of SPECIES)if(S.R>=s.r&&!S.spOwn.includes(s.id))S.spOwn.push(s.id);for(const a of ACCS)if(a.reb&&S.R>=a.reb&&!S.own.includes(a.s+':'+a.id))S.own.push(a.s+':'+a.id);STAGE=1;calcStage();admLog('🌀 перерождений = '+x)}
 if(k==='rcut'){closeTab();CUT.on=true;CUT.done=null;startCut(S.R);return}
 if(k==='spall')S.spOwn=SPECIES.map(s=>s.id);if(k==='accall')S.own=ACCS.map(a=>a.s+':'+a.id);if(k==='acc0'){S.own=[];S.eq=defSave().eq}
 if(k==='shop10'||k==='shop50'||k==='shop0'){const n={shop10:10,shop50:50,shop0:0}[k];S.food=FOODS.map(()=>n);S.help=HELPERS.map(()=>n)}
 if(k==='cheat0'){for(const[c] of ADM_CHEATS)S.adm[c]=0}
 if(k==='dl'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='kotozaycy-obzhory-'+(ACC||'guest')+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return}
 if(k==='wipeme'){if(!confirm('Сбросить весь свой прогресс?'))return;const keep={set:S.set,adm:S.adm,gid:S.gid};S=Object.assign(defSave(),keep);STAGE=1;calcStage();AN.f=0;admLog('🗑 сброшен свой прогресс')}
 save();SFX.click();renderAdm();hud();applyUI()}

/* ---------- окна ---------- */
function modal(h){$('#toast').classList.remove('on');$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
let toastTO=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTO);toastTO=setTimeout(()=>e.classList.remove('on'),2600)}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- клики по интерфейсу ---------- */
document.addEventListener('click',e=>{const t=e.target;ac();
 const tb=t.closest('[data-tab]');if(tb){openTab(tb.dataset.tab);return}
 const bn=t.closest('[data-buyn]');if(bn){BUYN=bn.dataset.buyn==='max'?'max':+bn.dataset.buyn;SFX.click();renderTab();return}
 const by=t.closest('[data-buy]');if(by){doBuy(by.dataset.buy,+by.dataset.i);return}
 const spx=t.closest('[data-sp]');if(spx){S.sp=spx.dataset.sp;SFX.buy();save();renderTab();netPresence();return}
 const ws=t.closest('[data-ws]');if(ws){WSLOT=ws.dataset.ws;SFX.click();renderTab();return}
 const wi=t.closest('[data-wi]');if(wi){wearOrBuy(wi.dataset.wi);return}
 const st=t.closest('[data-sett]');if(st){SETT=st.dataset.sett;SFX.click();renderTab();return}
 const op=t.closest('[data-opt]');if(op){const k=op.dataset.opt,v=op.dataset.v;S.set[k]=/^-?\d+(\.\d+)?$/.test(v)?+v:v;save();applySet();renderTab();hud();return}
 const sw2=t.closest('[data-set]');if(sw2){const k=sw2.dataset.set;S.set[k]=S.set[k]?0:1;save();sw2.classList.toggle('on',!!S.set[k]);if(k==='hideTop')netPresence();applySet();SFX.click();return}
 const fl=t.closest('[data-fill]');if(fl){const i=$('#fU');if(i){i.value=fl.dataset.fill;$('#fP').focus()}return}
 const at=t.closest('[data-admt]');if(at&&IS_ADM){ADT=at.dataset.admt;LS.set('kz_fat_admtab',ADT);renderAdm();return}
 const as=t.closest('[data-adm-sel]');if(as&&IS_ADM){admSel=as.dataset.admSel;renderAdm();return}
 const ad=t.closest('[data-adm]');if(ad&&IS_ADM){admAct(ad.dataset.adm,ad);return}
 const gf=t.closest('[data-gift]');if(gf&&IS_ADM){admGift(gf.dataset.gift,false);return}
 const wd=t.closest('[data-world]');if(wd&&IS_ADM){admWorld(wd.dataset.world);return}
 const ch=t.closest('[data-cheat]');if(ch&&IS_ADM){const k=ch.dataset.cheat;S.adm[k]=S.adm[k]?0:1;save();ch.classList.toggle('on',!!S.adm[k]);toast('🛠 '+ch.dataset.n+': '+(S.adm[k]?'вкл':'выкл'));applyUI();hud();return}
 const a=t.closest('[data-a]');if(!a)return;const k=a.dataset.a;
 if(k==='close'){closeTab();return}if(k==='mclose'){closeModal();return}
 if(k==='acc'){accModal();return}if(k==='fs'){toggleFS();return}if(k==='exit'){exitToLauncher();return}
 if(k==='reb'){askReb();return}if(k==='rebgo'){doReb();return}
 if(k==='buyacc'){buyAcc(a.dataset.id);return}
 if(k==='undress'){S.eq=Object.assign(defSave().eq,{bg:S.eq.bg});save();SFX.click();renderTab();return}
 if(k==='tabin'){authForm(false);return}if(k==='tabreg'){authForm(true);return}
 if(k==='dologin'){doAuth(false);return}if(k==='doreg'){doAuth(true);return}
 if(k==='guest'){LS.set('kz_session','__guest');switchAcc();closeModal();return}
 if(k==='logout'){LS.set('kz_session','__guest');switchAcc();closeModal();toast('🚪 Ты вышел из аккаунта');return}
 if(k==='accswitch'){authForm(false);return}
 if(k==='accnick'){modal(`<h3>✏ Новый ник</h3><div class="form"><input id="fN" maxlength="20" value="${esc(NICK)}"><div class="err" id="fE"></div></div><div class="mbtn"><button class="btn big mint" data-a="nickgo">Сохранить</button><button class="btn white" data-a="mclose">Отмена</button></div>`);return}
 if(k==='nickgo'){const n=$('#fN').value.trim();if(!n){$('#fE').textContent='Ник не может быть пустым';return}const db=accDB();if(db[ACC]){db[ACC].nick=n.slice(0,20);saveDB(db)}NICK=n.slice(0,20);closeModal();toast('✏ Теперь ты '+NICK);netPresence();return}
 if(k==='stats'){statsModal();return}
 if(k==='wipe'){modal(`<h3>🗑 Начать заново?</h3><p>Весь прогресс «Котозайцев-обжор» (перерождения, виды, вещи) пропадёт навсегда.</p><div class="mbtn"><button class="btn big red" data-a="wipego">Да, всё стереть</button><button class="btn white" data-a="mclose">Нет</button></div>`);return}
 if(k==='wipego'){const keep={set:S.set,gid:S.gid,adm:S.adm};S=Object.assign(defSave(),keep);STAGE=1;calcStage();AN.f=0;save();closeModal();closeTab();toast('Игра начата заново');hud();return}});
document.addEventListener('input',e=>{const r=e.target.closest('[data-rng]');if(!r)return;const k=r.dataset.rng;S.set[k]=+r.value;const b=document.querySelector(`[data-rv="${k}"]`);if(b)b.textContent=r.value+'%';save();if(k==='ui')applyUI();if(k==='vol')tone(660,.08,'triangle',.06)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#modal').classList.contains('on')){const b=$('#mbox [data-a="dologin"],#mbox [data-a="doreg"],#mbox [data-a="nickgo"]');if(b){e.preventDefault();b.click()}}});

/* ---------- цикл ---------- */
let last=performance.now();const FPS={n:0,t:0,v:0};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;FPS.n++;if(now-FPS.t>1000){FPS.v=FPS.n;FPS.n=0;FPS.t=now;if(S.set.fps||cheat('fps'))$('#fps').textContent=FPS.v+' FPS · частиц '+PARTS.length}
 if(!V)V=view();update(dt);render();requestAnimationFrame(frame)}
function offline(){if(!S.set.offl||!S.t)return;const away=Math.min(4*3600,(Date.now()-S.t)/1000);const ar=autoRate();if(away<60||ar<=0)return;
 const taps=ar*away*0.5;const tc=tapCal()*taps,cc=coinTap()*taps,was=STAGE;if(STAGE<100){S.cal+=tc;S.tot.cal+=tc}S.coins+=cc;S.tot.coins+=cc;calcStage();
 setTimeout(()=>modal(`<h3>💤 Пока тебя не было</h3><p>Помощники кормили котозайца ${away>=3600?Math.floor(away/3600)+' ч '+Math.round(away%3600/60)+' мин':Math.round(away/60)+' мин'}</p><div class="rw">${STAGE<100||was<100?`<span>🍖 +${fmt(tc)}</span>`:''}<span>🪙 +${fmt(cc)}</span>${STAGE>was?`<span>⚖ стадия ${was} → ${STAGE}</span>`:''}</div><div class="mbtn"><button class="btn big mint" data-a="mclose">Ням!</button></div>`),700)}
function intro(){modal(`<h3>🐰 Котозайцы-обжоры</h3><p>Твой котозайц совсем худой — одни косточки! Корми его, чтобы он толстел.</p><div class="rw"><span>👆 нажимай — он ест</span><span>🪙 толще = больше монет</span><span>🍖 покупай еду</span><span>👵 найми помощников</span><span>🌀 стань самым жирным и переродись</span></div><div class="mbtn"><button class="btn big mint" data-a="mclose">Начать кормить!</button></div>`);S.intro=true;save()}
if(location.hash==='#cover'){document.body.classList.add('cover');S=Object.assign(defSave(),{cal:need(78,0)+1,eq:{hat:'chef',eyes:'none',ex:'blush',neck:'bib',aura:'hearts',bg:'field'},tot:Object.assign(defSave().tot,{taps:1})});save=()=>{}}
calcStage();AN.f=STAGE>=100?1:(STAGE-1+FRAC)/99;resize();
if(!EMB&&!A)$('#bExit').style.display='none';
offline();hud();requestAnimationFrame(frame);
if(!document.body.classList.contains('cover')){
 if(LS.get('kz_session')==null)setTimeout(()=>{if(!$('#modal').classList.contains('on'))authForm(false)},500);
 else if(!S.intro)setTimeout(()=>{if(!$('#modal').classList.contains('on'))intro()},400)}
netStart();
addEventListener('storage',e=>{if(e.key==='kz_session')switchAcc()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{last=performance.now()}});addEventListener('pagehide',save);addEventListener('beforeunload',save);
window.__fat={get S(){return S},tap,doReb,cutEnd,stage:()=>STAGE};
