<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ленивая жизнь</title>
<style>
:root{--ink:#3a2a1e;--cream:#fff6e6;--leaf:#5fae4e;--leaf2:#2f7d3a;--wood:#8a5a3c;--gold:#ffc93c;--pink:#ff8fb1;--panel:rgba(255,248,235,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d14;font-family:"Segoe UI Rounded","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#room{position:absolute;inset:0;width:100%;height:100%}
#stage{position:absolute;left:50%;bottom:calc(118px + 2vh);width:min(calc((100vh - 230px)*.88),78vw);aspect-ratio:300/396;transform:translateX(-50%);cursor:pointer;touch-action:none}
#stage svg{width:100%;height:100%;overflow:visible}
#foam{position:absolute;inset:0;pointer-events:none}
#foam i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8f6ff 55%,#b9dcf3);box-shadow:inset 0 0 0 1px rgba(120,170,210,.35);transform:translate(-50%,-50%) scale(0);animation:pop .25s forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-size:28px;animation:flt 1.6s ease-out forwards;pointer-events:none}
@keyframes flt{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-120px) scale(1.15)}}
.z{position:absolute;font:900 30px "Segoe UI",sans-serif;color:#cfe3ff;text-shadow:0 2px 0 #3c4b7a;animation:zz 3s ease-out forwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0) rotate(-10deg) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(60px,-140px) rotate(12deg) scale(1.3)}}
.drop{position:absolute;width:6px;height:16px;border-radius:3px;background:linear-gradient(#bfe7ff,#5fb4ee);animation:drp .7s linear forwards}
@keyframes drp{to{transform:translateY(55vh);opacity:.2}}
/* HUD */
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.pill{background:var(--panel);border-radius:18px;box-shadow:0 4px 0 rgba(58,42,30,.25),0 8px 24px rgba(0,0,0,.18);padding:8px 12px}
#who{display:flex;align-items:center;gap:10px}
#who b{font-size:18px;display:block;line-height:1.1}
#lvl{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:conic-gradient(var(--leaf) var(--p,0%),#d8c9b2 0);position:relative}
#lvl:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--wood)}
#lvl span{position:relative;z-index:1;font-size:17px}
#who small{font-size:12px;opacity:.7}
#needs{display:flex;gap:8px;margin-left:auto}
.need{width:58px;text-align:center;padding:6px 4px}
.need .ic{font-size:22px;line-height:1}
.need .bar{height:8px;border-radius:5px;background:#e3d6c2;margin-top:5px;overflow:hidden}
.need .bar i{display:block;height:100%;border-radius:5px;background:var(--leaf);transition:width .6s,background .6s}
.need.low{animation:wob 1s infinite}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.05)}}
#coins{font-weight:900;font-size:18px;display:flex;align-items:center;gap:6px}
#exit{border:0;width:44px;height:44px;border-radius:50%;background:var(--panel);font-size:20px;cursor:pointer;box-shadow:0 4px 0 rgba(58,42,30,.25)}
/* bottom */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;pointer-events:none}
#bottom>*{pointer-events:auto}
#tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tool{border:0;background:var(--panel);border-radius:18px;min-width:64px;padding:8px 10px 6px;font:700 12px inherit;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(58,42,30,.28);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.tool:hover{transform:translateY(-2px)}.tool:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(58,42,30,.28)}
.tool .e{font-size:30px;line-height:1.05}
.tool.on{background:#ffe7a6}
.tool .pr{font-size:11px;opacity:.75}
.tool[disabled]{opacity:.45;cursor:default}
#tabs{display:flex;gap:6px;background:rgba(43,29,20,.75);padding:6px;border-radius:22px}
.tab{border:0;background:transparent;color:#f6e6cf;font:700 13px inherit;font-family:inherit;padding:7px 12px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab .e{font-size:20px}
.tab.on{background:var(--cream);color:var(--ink)}
/* speech */
#say{position:absolute;left:50%;bottom:calc(118px + 2vh + min(calc((100vh - 230px)*.88),78vw)*1.06);transform:translateX(-50%) scale(.6);opacity:0;background:#fff;padding:10px 16px;border-radius:20px;font-weight:700;font-size:17px;max-width:min(420px,80vw);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:.25s;z-index:4;pointer-events:none}
#say.on{opacity:1;transform:translateX(-50%) scale(1)}
#say:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-bottom:0;border-top-color:#fff}
#dark{position:absolute;inset:0;background:radial-gradient(circle at 50% 75%,rgba(10,14,40,.55),rgba(5,8,25,.9));opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:3}
#dark.on{opacity:1}
#mic{position:absolute;right:14px;bottom:140px;z-index:6}
#mic .tool{border-radius:50%;width:66px;height:66px;justify-content:center}
#mic .tool.on{background:#ff9fb8;animation:wob 1.2s infinite}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);opacity:0;background:#3a2a1e;color:#fff6e6;padding:10px 18px;border-radius:14px;font-weight:700;transition:.3s;z-index:50;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,18,10,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.box{background:var(--cream);border-radius:26px;padding:22px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 0 rgba(58,42,30,.3),0 20px 60px rgba(0,0,0,.4);position:relative}
.box h2{margin:0 0 4px;font-size:26px}
.box p{margin:4px 0 14px;opacity:.75}
.x{position:absolute;right:14px;top:12px;border:0;background:#efe1c9;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border-radius:20px;padding:10px;text-align:center;box-shadow:0 3px 0 #e8d8bf;cursor:pointer;position:relative;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card svg{width:100%;height:150px}
.card b{display:block;margin-top:4px}
.card small{opacity:.65}
.card.lock svg{filter:brightness(0) opacity(.18)}
.card.cur{box-shadow:0 0 0 3px var(--leaf),0 3px 0 #e8d8bf}
.rar{position:absolute;left:10px;top:10px;z-index:1;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:9px}
.card .q{position:absolute;inset:10px 10px 46px;display:grid;place-items:center;font:900 64px inherit;color:#c9b597}
.btn{border:0;border-radius:16px;padding:12px 20px;font:800 16px inherit;font-family:inherit;cursor:pointer;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf2)}
.btn.gold{background:#ffb627;box-shadow:0 4px 0 #c27c0b;color:#4a2c00}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.nm{font:700 20px inherit;font-family:inherit;padding:12px 14px;border-radius:14px;border:2px solid #e2d0b3;width:100%;background:#fff;color:var(--ink);outline:none}
input.nm:focus{border-color:var(--leaf)}
.boxwrap{display:flex;gap:18px;align-items:center;background:#fff3d6;border-radius:20px;padding:14px;margin-bottom:16px}
.sbox{width:110px;height:110px;flex:none;cursor:pointer}
.sbox.shake{animation:shk .12s 8}
@keyframes shk{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#reveal{text-align:center}
#reveal svg{width:220px;height:250px;animation:rv .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes rv{from{transform:scale(.2) rotate(-20deg);opacity:0}}
.adm{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:16px}
#admList{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.arow{background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 #e8d8bf}.arow.on{box-shadow:0 0 0 3px var(--leaf)}.arow b{display:block}.arow small{opacity:.65;font-size:12px}
.arow2{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:8px}.arow2>span:first-child{width:150px;font-weight:700}
.arow2 input,.arow2 select{font:600 15px inherit;font-family:inherit;padding:7px 10px;border-radius:10px;border:2px solid #e2d0b3;width:110px;background:#fff;color:var(--ink)}.arow2 select{flex:1}.arow2 .btn{padding:8px 14px;font-size:14px}
#admLog div{font-size:12px;opacity:.75;padding:2px 0}.hint{opacity:.6;font-size:13px}
@media(max-width:700px){.adm{grid-template-columns:1fr}}
/* minigame */
#mg{position:fixed;inset:0;z-index:30;display:none;background:linear-gradient(#9fd8ff,#d8f2ff 60%,#bfe6a8)}
#mg canvas{width:100%;height:100%;display:block;touch-action:none}
#mgHud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px}
#mgHud .pill{display:flex;gap:6px;align-items:center}
#sb{transform-origin:150px 330px;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
#hd{transform-origin:150px 190px;animation:sway 7s ease-in-out infinite}
@keyframes sway{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.sleep #hd{animation:sway 9s ease-in-out infinite}
.happy #hd{animation:hop .5s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-10px) rotate(4deg)}}
.poke #sb{animation:squish .35s}
@keyframes squish{40%{transform:scale(1.06,.92)}}
.e-c,.e-h,.m-o,.m-op,.m-sad,.m-chew,.dirt,.snot{display:none}
.st-blink .e-o{display:none}.st-blink .e-c{display:inline}
.st-sleep .e-o,.st-sleep .e-h{display:none}.st-sleep .e-c{display:inline}
.st-half .e-o{display:none}.st-half .e-h{display:inline}
.st-o .m-s{display:none}.st-o .m-o{display:inline}
.st-open .m-s,.st-open .m-sad{display:none}.st-open .m-op{display:inline}
.st-sad .m-s{display:none}.st-sad .m-sad{display:inline}
.st-chew .m-s{display:none}.st-chew .m-chew{display:inline}
.st-dirty .dirt{display:inline}
.st-sleep .snot{display:inline}
.snot{transform-origin:162px 152px;animation:snot 2.6s ease-in-out infinite}
@keyframes snot{50%{transform:scale(1.7)}}
.fly{position:absolute;font-size:20px;animation:fly 2.4s linear infinite}
@keyframes fly{0%{transform:rotate(0) translateX(70px) rotate(0)}100%{transform:rotate(360deg) translateX(70px) rotate(-360deg)}}
@media(max-width:640px){.need{width:44px}.need .ic{font-size:18px}#who small{display:none}.tab span{display:none}.tool{min-width:56px}.tool .e{font-size:26px}#mic{bottom:150px}}
</style>
</head>
<body>
<div id="app">
 <svg id="room" preserveAspectRatio="xMidYMax slice" viewBox="0 0 1600 900"></svg>
 <div id="fx"></div>
 <div id="dark"></div>
 <div id="stage"><div id="sl"></div><div id="foam"></div></div>
 <div id="say"></div>
 <div id="hud">
  <div class="pill" id="who"><div id="lvl"><span>1</span></div><div><b id="nm">Тихоня</b><small id="mood">доволен жизнью</small></div></div>
  <div class="pill" id="coins">🪙 <span id="cn">0</span></div>
  <div id="needs"></div>
  <button id="exit" title="Выйти">✕</button>
 </div>
 <div id="mic"></div>
 <div id="bottom"><div id="tools"></div><div id="tabs"></div></div>
</div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div id="mg"><canvas id="cv"></canvas><div id="mgHud"><div class="pill">🍃 <span id="mgS">0</span></div><div class="pill" id="mgL">❤❤❤</div><div class="pill" style="margin-left:auto">🏆 <span id="mgB">0</span></div><button class="pill" id="mgX" style="border:0;font:inherit;cursor:pointer">✕</button></div></div>
<div id="toast"></div>
<script>
'use strict';
const CFG=window.LAZY||{};
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const KEY='kz_lazy';
/* ---------- скины ---------- */
const SKINS={
 plain:{n:'Обычный',d:'Просто пушистый ленивец',r:0},
 banana:{n:'Банановый',d:'Обнимает любимый банан',r:1},
 umbrella:{n:'Зонтик',d:'Прячется под листиком',r:1},
 blanket:{n:'Укрывашка',d:'Завернулся в листик-одеяло',r:1},
 winter:{n:'Новогодний',d:'Колпак, шарф и какао',r:1},
 climber:{n:'Древолаз',d:'Не отпустит свою ветку',r:1},
 gardener:{n:'Садовод',d:'Растёт в горшочке',r:1},
 chef:{n:'Шеф-повар',d:'Колпак и деревянная ложка',r:1},
 music:{n:'Меломан',d:'Не снимает наушники',r:1},
 flowers:{n:'Весенний',d:'Венок из цветов',r:1},
 bee:{n:'Пчёлка',d:'Полосатый и жужжащий',r:1},
 pirate:{n:'Пират',d:'Бандана и повязка на глаз',r:2},
 wizard:{n:'Волшебник',d:'Шляпа со звёздами и палочка',r:2},
 pumpkin:{n:'Хэллоуин',d:'Шляпа ведьмы и тыква с конфетами',r:2},
 hero:{n:'Супер-ленивец',d:'Плащ, маска и молния',r:2},
 king:{n:'Король',d:'Корона и королевская мантия',r:3},
 astro:{n:'Космонавт',d:'Летит к звёздам… медленно',r:3},
 starry:{n:'Звёздный',d:'Ночная шёрстка в звёздочках',r:3,pal:{b:'#4b5288',b2:'#6c74b0',p:'#262a52',f:'#e6e8ff'}},
 gold:{n:'Золотой',d:'Самый редкий — сияет!',r:3,pal:{b:'#e0a92e',b2:'#f4cf6a',p:'#9a640c',f:'#fff3cf'}}
};
const SET=Object.keys(SKINS).filter(k=>k!=='plain');
const RAR=[['',''],['Обычный','#7a8a6a'],['Редкий','#3d7ee0'],['Легендарный','#e0961a']];
function star(x,y,r,fill){let d='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;d+=(i?'L':'M')+(x+Math.cos(a)*rr).toFixed(1)+' '+(y+Math.sin(a)*rr).toFixed(1)}return `<path d="${d}Z" fill="${fill||'#ffd84a'}" stroke="#2e1f16" stroke-width="2.5" stroke-linejoin="round"/>`}
function stick(col,w){return `<path d="M150 254 L 206 176" stroke="#2e1f16" stroke-width="${w+5}" stroke-linecap="round"/><path d="M150 254 L 206 176" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`}
function flower(x,y,r,c){let h='';for(let i=0;i<5;i++){const a=Math.PI*2/5*i;h+=`<circle cx="${(x+Math.cos(a)*r).toFixed(1)}" cy="${(y+Math.sin(a)*r).toFixed(1)}" r="${r*.75}" fill="${c}" stroke="#2e1f16" stroke-width="2"/>`}return h+`<circle cx="${x}" cy="${y}" r="${r*.6}" fill="#ffd84a" stroke="#2e1f16" stroke-width="2"/>`}
/* ---------- сохранение ---------- */
function def(){return{name:'',coins:30,xp:0,lvl:1,f:80,s:80,j:80,c:80,t:Date.now(),skins:['plain'],skin:'plain',boxes:1,sleep:false,best:0,games:0,day:'',fed:0,pets:0,food:{banana:2,leaf:3}}}
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function accDB(){try{return JSON.parse(LS.get('kz_accounts_v1'))||{}}catch(e){return{}}}
// аккаунт лаунчера: у каждого аккаунта свой ленивец
const ACC=(()=>{const u=LS.get('kz_session');return u&&u!=='__guest'&&accDB()[u]?u:''})();
const ACC_NICK=ACC?(accDB()[ACC].nick||ACC):(CFG.nick||'');
const IS_ADM=ACC==='deta';
const KEYU=k=>'kz_lazy_u_'+(k||'__guest');
function newGid(){return 'l'+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function loadSave(u){let o=null;try{o=JSON.parse(LS.get(KEYU(u)))}catch(e){}
 if(!o){try{const g=JSON.parse(LS.get(KEY));if(g&&(!g.owner||g.owner===(u||'__guest')))o=g}catch(e){}}
 o=Object.assign(def(),o||{});if(!o.gid)o.gid=newGid();if(!o.seen)o.seen={};o.skins=o.skins.filter(k=>SKINS[k]);if(!SKINS[o.skin])o.skin='plain';return o}
let S=loadSave(ACC);
function save(){S.t=Date.now();S.owner=ACC||'__guest';S.total=SET.length;const j=JSON.stringify(S);LS.set(KEYU(ACC),j);LS.set(KEY,j);netPresence()}
// потребности, пока игры не было
(function offline(){const h=clamp((Date.now()-S.t)/36e5,0,48);if(h<=0)return;S.f=clamp(S.f-h*5,5,100);S.j=clamp(S.j-h*4,5,100);S.c=clamp(S.c-h*3,5,100);if(S.sleep){S.s=clamp(S.s+h*30,0,100)}else S.s=clamp(S.s-h*4,5,100)})();
/* ---------- звуки ---------- */
let AC=null;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type,v,slide){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SND={
 pop:()=>tone(500+Math.random()*500,.08,'sine',.05,900),
 coin:()=>{tone(988,.08,'square',.04);setTimeout(()=>tone(1319,.18,'square',.04),70)},
 chew:()=>tone(160+Math.random()*60,.07,'triangle',.08,90),
 yawn:()=>tone(420,1.1,'sine',.06,140),
 giggle:()=>{for(let i=0;i<5;i++)setTimeout(()=>tone(700+i*60+Math.random()*80,.07,'triangle',.05,520),i*85)},
 oof:()=>tone(260,.25,'triangle',.08,140),
 sad:()=>tone(330,.6,'sine',.05,200),
 snore:()=>{const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*.9,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length)*.5;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=380;g.gain.value=.12;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()},
 water:()=>{const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*1.4,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.35;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='highpass';f.frequency.value=2500;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.4);s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()},
 lvl:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.06),i*110))
};
/* ---------- рисуем ленивца ---------- */

/* ---------- еда ---------- */
const FOOD={leaf:{e:'🍃',n:'Листик',p:3,f:12,x:2},banana:{e:'🍌',n:'Банан',p:6,f:22,x:4},mango:{e:'🥭',n:'Манго',p:10,f:32,x:6},flower:{e:'🌺',n:'Цветок',p:14,f:26,j:18,x:8},berry:{e:'🫐',n:'Ягоды',p:8,f:16,j:10,x:5},cake:{e:'🧁',n:'Кекс',p:20,f:40,j:20,x:10}};
/* ---------- состояние сцены ---------- */
let room='live',tool=null,busy=false,foamN=0;
const stage=$('#stage'),slEl=$('#sl');
function drawSloth(){slEl.innerHTML=slothSVG(S.skin);applyFace()}
let face='';function setState(st,ms){face=st;applyFace();if(ms){clearTimeout(setState.t);setState.t=setTimeout(()=>{face='';applyFace()},ms)}}
function applyFace(){const svg=$('#slSvg');if(!svg)return;let c=[];const f=face||(S.sleep?'sleep':(S.s<25?'half':(mood()<35?'sad':'')));if(f)c.push('st-'+f);if(S.c<35)c.push('st-dirty');if(S.sleep)c.push('st-sleep');svg.setAttribute('class',c.join(' '));stage.classList.toggle('sleep',S.sleep);updFlies()}
function updFlies(){const fx=$('#fx');const want=S.c<30&&!S.sleep;let fl=document.getElementById('flies');if(want&&!fl){fl=document.createElement('div');fl.id='flies';fl.style.cssText='position:absolute;left:50%;bottom:calc(118px + 2vh + min(calc((100vh - 230px)*.88),78vw)*.8);width:0;height:0';fl.innerHTML='<span class="fly">🪰</span><span class="fly" style="animation-delay:-1.2s;animation-duration:3s">🪰</span>';fx.appendChild(fl)}else if(!want&&fl)fl.remove()}
// моргание
setInterval(()=>{if(!face&&!S.sleep){const s=$('#slSvg');if(!s)return;s.classList.add('st-blink');setTimeout(()=>s.classList.remove('st-blink'),180)}},3800);
function mood(){return(S.f+S.s+S.j+S.c)/4}
/* ---------- речь ---------- */
const TALK={
 hi:['Привет… я тут… не спеша…','О, это ты! Как же я рад… медленно рад.','Ммм… давно не виделись…'],

 bored:['Поиграй со мной… только не быстро.','Скучно висеть без дела…','Давай в листопад?'],
 dirty:['Кажется, во мне кто-то поселился…','Может, в ванную?','Я… немножко пахну.'],
 happy:['Жизнь прекрасна, когда никуда не спешишь.','Обнимашки!','Я самый счастливый ленивец.','Хорошо-то как…'],
 poke:['Ай!','Щекотно!','Эй, ну потише…','Я так медленно увернуться не успеваю!'],
 angry:['Всё, я обиделся… минут на пять.','Хватит тыкать!','Ну сколько можно!'],
 eat:['Ням…','Вкуснотища…','Ммм… ещё!','Спасибо!'],

};
function say(t,ms){const e=$('#say');e.textContent=t;e.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>e.classList.remove('on'),ms||2600)}
function chat(){if(S.sleep)return;if(S.f<30)return say(rnd(TALK.hungry));if(S.s<30)return say(rnd(TALK.sleepy));if(S.c<30)return say(rnd(TALK.dirty));if(S.j<30)return say(rnd(TALK.bored));say(rnd(TALK.happy))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function float(txt,x,y){const e=document.createElement('div');e.className='fl';e.textContent=txt;const r=stage.getBoundingClientRect();e.style.left=(x??(r.left+r.width/2+(Math.random()-.5)*r.width*.5))+'px';e.style.top=(y??(r.top+r.height*.25))+'px';$('#fx').appendChild(e);setTimeout(()=>e.remove(),1700)}
/* ---------- прогресс ---------- */
function addXP(n){S.xp+=n;let need=S.lvl*40;while(S.xp>=need){S.xp-=need;S.lvl++;S.coins+=10+S.lvl*2;need=S.lvl*40;SND.lvl();toast(`🎉 Уровень ${S.lvl}! +${10+S.lvl*2} 🪙`);if(S.lvl%3===0){S.boxes++;toast(`🎁 Уровень ${S.lvl}: сюрприз-коробка в подарок!`)}}hud();save()}
function addCoins(n){S.coins+=n;SND.coin();hud();save()}
function need(k,v){S[k]=clamp(S[k]+v,0,100)}
/* ---------- HUD ---------- */
const NEEDS=[['f','🍃','Еда'],['s','💤','Сон'],['j','🎈','Веселье'],['c','🫧','Чистота']];
$('#needs').innerHTML=NEEDS.map(([k,e,n])=>`<div class="pill need" id="n_${k}" title="${n}"><div class="ic">${e}</div><div class="bar"><i></i></div></div>`).join('');
function hud(){for(const[k]of NEEDS){const v=S[k],el=$('#n_'+k),b=el.querySelector('i');b.style.width=v+'%';b.style.background=v<25?'#ff6b6b':v<50?'#ffb627':'#5fae4e';el.classList.toggle('low',v<20)}$('#cn').textContent=S.coins;$('#nm').textContent=S.name||'Ленивец';$('#lvl span').textContent=S.lvl;$('#lvl').style.setProperty('--p',(S.xp/(S.lvl*40)*100)+'%');const m=mood();$('#mood').textContent=S.sleep?'сладко спит':S.f<25?'голодный':S.s<25?'хочет спать':S.c<25?'грязнуля':S.j<25?'скучает':m>75?'доволен жизнью':m>50?'в порядке':'грустит'}
/* ---------- вкладки и инструменты ---------- */
function tabs(){$('#tabs').innerHTML=Object.entries(ROOMS).map(([k,r])=>`<button class="tab${k===room?' on':''}" data-room="${k}"><span class="e">${r.e}</span><span>${r.n}</span></button>`).join('')+`<button class="tab" data-a="wardrobe"><span class="e">👕</span><span>Шкаф</span></button><button class="tab" data-a="game"><span class="e">🎮</span><span>Листопад</span></button>`+(IS_ADM?`<button class="tab" data-a="adm" style="color:#ffd84a"><span class="e">🛠</span><span>ADM</span></button>`:'')}
function tools(){let h='';
 if(room==='live')h=`<button class="tool" data-a="pet"><span class="e">🤗</span>Погладить</button><button class="tool" data-a="tickle"><span class="e">🪶</span>Пощекотать</button><button class="tool" data-a="ball"><span class="e">🧶</span>Клубок</button><button class="tool" data-a="chat"><span class="e">💬</span>Поболтать</button><button class="tool" data-a="gift"${giftReady()?'':' disabled'}><span class="e">🎁</span>${giftReady()?'Подарок дня':'Завтра'}</button>`;
 if(room==='kitchen')h=Object.entries(FOOD).map(([k,f])=>`<button class="tool" data-food="${k}"><span class="e">${f.e}</span>${S.food[k]?'× '+S.food[k]:f.n}<span class="pr">${S.food[k]?'есть':f.p+' 🪙'}</span></button>`).join('');
 if(room==='bath')h=`<button class="tool${tool==='soap'?' on':''}" data-a="soap"><span class="e">🧼</span>Мыло</button><button class="tool" data-a="shower"><span class="e">🚿</span>Смыть</button><button class="tool" data-a="towel"><span class="e">🧺</span>Полотенце</button>`;
 if(room==='bed')h=`<button class="tool${S.sleep?' on':''}" data-a="lamp"><span class="e">${S.sleep?'💡':'🌙'}</span>${S.sleep?'Разбудить':'Спать'}</button><button class="tool" data-a="lullaby"${S.sleep?' disabled':''}><span class="e">🎵</span>Колыбельная</button>`;
 $('#tools').innerHTML=h}
function goRoom(r){if(S.sleep&&r!=='bed'){toast('Тсс… ленивец спит 💤 Разбуди его в спальне');return}room=r;tool=null;stage.style.cursor='pointer';$('#room').innerHTML=ROOMS[r].draw();$('#dark').classList.toggle('on',S.sleep&&r==='bed');tabs();tools();clearFoam()}
/* ---------- действия ---------- */
let pokes=0,pokeT=0;
function poke(e){if(tool==='soap')return;ac();if(S.sleep){SND.snore();say('Ххрр… ммм… ещё пять минуточек…');float('💤');return}const now=Date.now();if(now-pokeT>4000)pokes=0;pokeT=now;pokes++;stage.classList.remove('poke');void stage.offsetWidth;stage.classList.add('poke');
 const r=stage.getBoundingClientRect(),yy=(e.clientY-r.top)/r.height;
 if(pokes>6){SND.sad();setState('sad',2500);say(rnd(TALK.angry));need('j',-3);hud();return}
 if(yy<.45){SND.giggle();setState('blink',600);say(rnd(['Хи-хи, это моя голова!','Не трогай причёску!','Ой, макушка!']));float('✨',e.clientX,e.clientY)}
 else{SND.oof();setState('o',700);say(rnd(TALK.poke));float('💫',e.clientX,e.clientY)}
 need('j',1);addXP(1)}
// поглаживание: быстрые движения по ленивцу
let strokeD=0,lastP=null;
stage.addEventListener('pointerdown',e=>{lastP=[e.clientX,e.clientY,Date.now()];if(tool==='soap'){scrub(e);stage.setPointerCapture(e.pointerId)}});
stage.addEventListener('pointermove',e=>{if(tool==='soap'&&e.buttons){scrub(e);return}if(!e.buttons||!lastP||S.sleep)return;strokeD+=Math.hypot(e.clientX-lastP[0],e.clientY-lastP[1]);lastP=[e.clientX,e.clientY,lastP[2]];if(strokeD>260){strokeD=0;petOnce(e.clientX,e.clientY)}});
stage.addEventListener('pointerup',e=>{if(tool==='soap')return;if(lastP&&Date.now()-lastP[2]<300&&strokeD<30)poke(e);strokeD=0;lastP=null});
function petOnce(x,y){ac();SND.pop();float('💗',x,y);setState('blink',900);need('j',3);S.pets++;addXP(1);hud();if(Math.random()<.3)say(rnd(['Мррр… то есть… ммм…','Ещё, ещё…','Как приятно…']))}
function act(a){ac();
 if(a==='pet'){for(let i=0;i<5;i++)setTimeout(()=>petOnce(),i*220);stage.classList.add('happy');setTimeout(()=>stage.classList.remove('happy'),1100)}
 if(a==='tickle'){if(S.sleep)return;SND.giggle();setState('open',1500);say(rnd(['Ха-ха-ха… ой… не могу…','Хи-хи-хи!','Щеко-о-отно!']));for(let i=0;i<6;i++)setTimeout(()=>float(rnd(['😆','✨','💫'])),i*150);need('j',6);need('s',-2);addXP(2);hud()}
 if(a==='ball'){if(S.s<10){say('Сил нет… даже на клубок…');return}ballPlay()}
 if(a==='chat'){chat()}
 if(a==='gift'){if(!giftReady())return;S.day=today();const c=15+Math.floor(Math.random()*16);addCoins(c);toast(`🎁 Подарок дня: +${c} 🪙`);say('Это тебе! Я сам… ну почти сам… нашёл.');tools()}
 if(a==='soap'){tool=tool==='soap'?null:'soap';stage.style.cursor=tool?'grab':'pointer';tools();if(tool)toast('Води мылом по ленивцу 🧼')}
 if(a==='shower')shower();
 if(a==='towel'){if(foamN){toast('Сначала смой пену 🚿');return}say('Тёплое полотенчико…');setState('blink',900);float('🌸')}
 if(a==='lamp')toggleSleep();
 if(a==='lullaby'){say('Ля-ля-ля… *зевает*');SND.yawn();setState('half',3000);[392,330,349,294,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.45,'sine',.05),i*450));setTimeout(()=>{if(S.s<90&&!S.sleep)toggleSleep()},3000)}
 if(a==='wardrobe')wardrobe();
 if(a==='game')startGame();
 if(a==='exit')exitGame()}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function giftReady(){return S.day!==today()}
function ballPlay(){const r=stage.getBoundingClientRect(),b=document.createElement('div');b.className='fl';b.style.cssText=`left:${r.left-40}px;top:${r.top+r.height*.6}px;font-size:44px;animation:none;transition:all 1.4s cubic-bezier(.3,.6,.3,1)`;b.textContent='🧶';$('#fx').appendChild(b);requestAnimationFrame(()=>{b.style.left=(r.left+r.width*.5)+'px';b.style.top=(r.top+r.height*.7)+'px';b.style.transform='rotate(540deg)'});setTimeout(()=>{SND.giggle();setState('open',1200);stage.classList.add('happy');say(rnd(['Клубочек! Поймал… почти.','Я его… медленно… поймаю!','Ещё разок!']));need('j',10);need('s',-3);need('f',-2);addXP(3);hud();setTimeout(()=>{stage.classList.remove('happy');b.style.left=(r.right+60)+'px';b.style.opacity='0'},900);setTimeout(()=>b.remove(),2400)},1400)}
function feed(k){const f=FOOD[k];if(S.sleep)return;if(busy)return;if(S.f>=97){say(rnd(TALK.full));setState('sad',1200);return}
 if(!S.food[k]){if(S.coins<f.p){toast('Не хватает монет 🪙 — сыграй в Листопад!');return}S.coins-=f.p;S.food[k]=1;SND.coin()}
 S.food[k]--;if(!S.food[k])delete S.food[k];busy=true;
 const btn=document.querySelector(`[data-food="${k}"]`),br=btn.getBoundingClientRect(),r=stage.getBoundingClientRect();
 const e=document.createElement('div');e.className='fl';e.style.cssText=`left:${br.left+br.width/2}px;top:${br.top}px;font-size:46px;animation:none;transition:all .7s cubic-bezier(.3,1.4,.5,1)`;e.textContent=f.e;$('#fx').appendChild(e);setState('open');
 requestAnimationFrame(()=>{e.style.left=(r.left+r.width/2)+'px';e.style.top=(r.top+r.height*.4)+'px'});
 setTimeout(()=>{e.style.transform='translate(-50%,0) scale(.2)';e.style.opacity='0';setState('chew');let n=0;const iv=setInterval(()=>{SND.chew();n++;if(n>6){clearInterval(iv);setState('',0);face='';applyFace();say(rnd(TALK.eat));float('😋');busy=false;need('f',f.f);if(f.j)need('j',f.j);S.fed++;addXP(f.x);hud();tools();save()}},260)},750);setTimeout(()=>e.remove(),1600);tools()}
/* ---------- ванная ---------- */
function scrub(e){const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x<8||x>92||y<5||y>98)return;if(foamN>140)return;const b=document.createElement('i');const s=18+Math.random()*34;b.style.cssText=`left:${x+(Math.random()-.5)*6}%;top:${y+(Math.random()-.5)*6}%;width:${s}px;height:${s}px`;$('#foam').appendChild(b);foamN++;if(foamN%4===0)SND.pop();if(foamN===60)say(rnd(['Пенка! Щекотно!','Я как облачко…','Пахнет бананом!']))}
function clearFoam(){$('#foam').innerHTML='';foamN=0}
function shower(){if(busy)return;busy=true;SND.water();const r=stage.getBoundingClientRect();for(let i=0;i<60;i++)setTimeout(()=>{const d=document.createElement('div');d.className='drop';d.style.left=(r.left+Math.random()*r.width)+'px';d.style.top=(r.top-40+Math.random()*30)+'px';$('#fx').appendChild(d);setTimeout(()=>d.remove(),800)},i*20);
 setTimeout(()=>{const gain=Math.min(100,15+foamN*0.6);if(foamN<10){say('Брр! Сначала мыло, потом душ!');need('c',4)}else{need('c',gain);say(rnd(['Чистенький!','Как новенький!','Блестит шёрстка!']));float('✨');float('🫧');addXP(Math.round(foamN/12)+2)}clearFoam();tool=null;stage.style.cursor='pointer';busy=false;hud();applyFace();tools();save()},1300)}
/* ---------- сон ---------- */

function giftApply(T,it){const a=it.a||{},n=Math.round(+a.n||0);
 switch(it.op){
  case 'coins':T.coins=Math.max(0,T.coins+n);return n>=0?`🪙 +${n} монет`:`🪙 ${n} монет`;
  case 'boxes':T.boxes=Math.max(0,(T.boxes||0)+n);return `🎁 +${n} сюрприз-коробок`;
  case 'lvl':T.lvl=Math.max(1,T.lvl+n);return `⭐ +${n} уровней`;
  case 'skin':{if(a.k==='all'){for(const k of SET)if(!T.skins.includes(k))T.skins.push(k);return '👕 Вся коллекция костюмов!'}if(!SKINS[a.k])return null;if(!T.skins.includes(a.k))T.skins.push(a.k);return `👕 Костюм «${SKINS[a.k].n}»`}
  case 'fill':T.f=T.s=T.j=T.c=100;T.sleep=false;return '💚 Ленивец сыт, бодр, весел и чист';
  case 'food':{const k=FOOD[a.k]?a.k:'banana';T.food[k]=(T.food[k]||0)+Math.max(1,n);return `${FOOD[k].e} +${Math.max(1,n)} ${FOOD[k].n.toLowerCase()}`}
  case 'msg':return a.t?'✉ «'+String(a.t).slice(0,200)+'»':null}
 return null}
