<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Котозайцы в космосе</title>
<style>
:root{--ink:#1d1838;--cream:#fff7e8;--cream2:#ffeccc;--yel:#ffc93c;--mint:#3fd8ad;--pink:#ff6fa8;--vio:#8f6bff;--sky:#5ab8ff;--red:#ff5e7a;--mut:#6b6394}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{--ff:"Nunito KZ","Nunito","Segoe UI",system-ui,sans-serif;--bs:1;--fb:1;--hudA:1}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;color:#fff;font:800 15px/1.4 var(--ff);touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;z-index:5;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px);touch-action:pan-y}
.scr.on{display:block;animation:scrIn .25s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}}
.wrap{max-width:780px;margin:0 auto}
.btn{appearance:none;font:900 16px/1.15 var(--ff);color:var(--ink);background:var(--yel);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:16px;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.mint{background:var(--mint)}.btn.pink{background:var(--pink)}.btn.sky{background:var(--sky)}.btn.white{background:#fff}.btn.vio{background:var(--vio);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.big{font-size:22px;padding:15px 28px;border-radius:20px;box-shadow:0 6px 0 var(--ink)}
.btn.sm{font-size:13px;padding:7px 11px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.panel{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
.top{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.top h2{flex:1;margin:0;font-size:26px;font-weight:1000;color:#ffe9a0;text-shadow:0 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
.pill{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 var(--ink);font-weight:900;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
/* menu */
#menu .wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:1100px}
.logo{font-weight:1000;font-size:clamp(40px,7.4vw,74px);line-height:.9;color:var(--yel);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink);margin:0 0 14px;letter-spacing:-1px}
.logo span{display:block;color:#9fe8ff;font-size:.8em}
.mbtns{display:grid;gap:10px;width:min(340px,100%)}
.mbtns .btn{justify-content:flex-start}
.mbtns .btn.big{justify-content:center}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtop{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 12px);display:flex;gap:8px;z-index:6}
.sub{color:#e6e0ff;margin:-4px 0 18px;font-size:15px;max-width:420px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@media (max-width:640px){#menu .wrap{justify-content:flex-end;align-items:center;text-align:center}.mbtns{margin:0 auto}.sub{margin-left:auto;margin-right:auto}.mtop{left:14px;right:14px;justify-content:space-between}}
/* map */
.gal{margin-bottom:16px;padding:14px}
.galh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.galh i{font-style:normal;font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.galh b{font-size:18px;display:block}.galh small{color:var(--mut)}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.node{border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:8px 2px 6px;text-align:center;cursor:pointer;font:900 18px inherit;font-family:inherit;color:var(--ink);transition:transform .12s}
.node:hover{transform:translateY(-2px)}
.node small{display:block;font-size:12px;letter-spacing:1px;color:#e0961a;min-height:16px}
.node.cur{background:var(--yel);animation:nb 1.6s ease-in-out infinite}
@keyframes nb{50%{transform:translateY(-3px)}}
.node.lock{background:#e8e2f6;color:#9a93bf;cursor:default;box-shadow:0 3px 0 #9a93bf;border-color:#9a93bf}
.node.boss{background:#ffd6dc}.node.boss.lock{background:#e8e2f6}
.home{display:flex;align-items:center;gap:14px;padding:14px}
/* hangar & ships */
.ups{display:grid;gap:10px}
.up{display:flex;align-items:center;gap:12px;padding:12px 14px}
.up .ic{font-size:30px;width:52px;height:52px;border-radius:16px;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.up .tx{flex:1;min-width:0}.up .tx b{font-size:17px}.up .tx small{display:block;color:var(--mut);font-size:13px}
.pips{display:flex;gap:4px;margin-top:5px}.pips i{width:20px;height:9px;border-radius:9px;border:2px solid var(--ink);background:#fff}.pips i.on{background:var(--mint)}
.ships{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.shc{padding:10px;text-align:center}
.shc canvas{width:100%;height:110px;display:block;border-radius:14px;background:radial-gradient(circle at 50% 40%,#3a2a8a,#120c35);border:3px solid var(--ink)}
.shc b{display:block;margin:8px 0 2px}.shc small{display:block;color:var(--mut);font-size:12px;min-height:18px;margin-bottom:6px}
.shc.sel{background:#e6fff6;box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--mint) inset}
/* settings */
.opts{padding:4px 0}.opt{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;border-bottom:2px dashed rgba(29,24,56,.15)}.opt:last-child{border:0}
.opt .tx{flex:1;min-width:180px}.opt small{display:block;color:var(--mut);font-size:12px}
.seg{display:flex;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px}.seg button{border:0;background:none;font:900 13px inherit;font-family:inherit;color:var(--ink);padding:6px 10px;border-radius:9px;cursor:pointer}.seg button.on{background:var(--yel)}
.sw{width:54px;height:32px;border-radius:99px;border:3px solid var(--ink);background:#e8e2f6;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:var(--mint)}.sw.on:after{left:25px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#hud.on{display:block}
.hl{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 10px);display:grid;gap:7px}
.hearts{font-size:22px;letter-spacing:1px;filter:drop-shadow(0 2px 0 var(--ink))}
.fuel{width:min(210px,40vw);height:20px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--ink);position:relative}
.fuel i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3fd8ad,#9fe8ff);transition:width .15s}
.fuel b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--ink)}
.fuel.low i{background:linear-gradient(90deg,#ff5e7a,#ffb36b)}.fuel.low{animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.05)}}
.hc{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);text-align:center;display:grid;gap:6px;justify-items:center}
.hc .pill{font-size:15px}
.hsec{font-size:12px;color:#e6e0ff;text-shadow:0 2px 0 var(--ink)}
.bossbar{width:min(360px,60vw);height:18px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--ink);display:none}
.bossbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5e7a,#ff9be0);transition:width .15s}
.hr{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 10px);pointer-events:auto}
#boostB{position:absolute;right:calc(env(safe-area-inset-right) + 24px);bottom:calc(env(safe-area-inset-bottom) + 28px);width:calc(92px * var(--fb));height:calc(92px * var(--fb));font-size:calc(36px * var(--fb))!important;border-radius:50%;pointer-events:auto;display:none;font-size:36px;padding:0;touch-action:none}
#boostB.on{background:var(--pink);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.touch #boostB{display:flex}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:rgba(18,12,53,.75);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:8px 14px;font-size:14px;color:#fff;transition:opacity .6s;opacity:0;text-align:center;max-width:90vw}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,6,30,.6);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;text-align:center;animation:pop .28s cubic-bezier(.34,1.56,.64,1);border-radius:28px;border-width:4px;box-shadow:0 8px 0 var(--ink)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.mbox h3{margin:0 0 6px;font-size:26px;font-weight:1000}
.mbox p{margin:6px 0 12px;color:#4a4370}
.mbtn{display:grid;gap:9px;margin-top:14px}
.big3{font-size:44px;letter-spacing:4px;margin:4px 0}
.big3 .off{opacity:.2;filter:grayscale(1)}
.rw{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.rw span{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 150px);transform:translateX(-50%) translateY(-10px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:16px;padding:9px 16px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:15;text-align:center;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.touch .hint{bottom:calc(env(safe-area-inset-bottom) + 136px)}
@media (max-width:640px){.hc{left:12px;transform:none;top:calc(env(safe-area-inset-top) + 112px);justify-items:start}.hsec{display:none}.bossbar{width:52vw}#toast{top:calc(env(safe-area-inset-top) + 200px)}}
/* масштаб интерфейса на ПК */
#menu .wrap{min-height:calc(100% / var(--z,1))}
.scr .wrap,.mtop,.hl,.hc,.hr,.hint,.mbox,#toast{zoom:var(--z,1)}
.mtop .pill{cursor:pointer;font-family:inherit;font-size:15px}
.mtop .pill:hover{background:var(--cream2)}
.form{text-align:left}.form label{display:block;font-size:13px;color:var(--mut);margin:10px 2px 4px}
.form input,.adm input{width:100%;font:800 16px inherit;font-family:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;outline:none;box-shadow:0 3px 0 var(--ink);-webkit-user-select:text;user-select:text}
.form input:focus,.adm input:focus{box-shadow:0 3px 0 var(--ink),0 0 0 4px rgba(63,216,173,.45)}
.err{color:#d42a4a;font-size:13px;min-height:18px;margin-top:8px}
.known{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.adm{display:grid;gap:14px}.adm .panel{padding:14px}.adm h4{margin:0 0 10px;font-size:17px}
.adm .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.adm .row input{width:auto;flex:1;min-width:120px}
.adml{display:grid;gap:6px;margin-bottom:10px}.adml div{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px}.adml div span{flex:1}
.admtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.admgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.wrap:has(#admPanel){max-width:1180px}
.adml>div.on{background:#e6fff6;box-shadow:0 0 0 3px var(--mint) inset}.plist{max-height:420px;overflow:auto}.plist>div{cursor:pointer}
.adml b{white-space:nowrap}
select.inp{font:800 14px inherit;font-family:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:7px 8px;flex:1;min-width:120px}
.hpu{display:flex;gap:5px;flex-wrap:wrap;max-width:230px}.hpu span{background:rgba(18,12,53,.75);border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:2px 8px;font-size:13px}
.pill.combo{display:none;background:#ffc93c;font-size:13px;animation:fl .4s ease-in-out infinite alternate}
.qs{display:grid;gap:10px}.q{display:flex;align-items:center;gap:12px;padding:12px 14px}.q .tx{flex:1;min-width:0}.q .tx b{display:block}
.qbar{height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin-top:6px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#3fd8ad,#9fe8ff)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.ach{padding:12px;display:flex;gap:10px;align-items:center}.ach .ic{font-size:30px;width:50px;height:50px;border-radius:14px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;flex:none}.ach.done .ic{background:var(--yel)}.ach .tx{flex:1;min-width:0}.ach small{display:block;color:var(--mut);font-size:12px}
.tier{font-size:12px;letter-spacing:1px;color:#e0961a}
.qh{color:#ffe9a0;text-shadow:0 2px 0 var(--ink);margin:18px 2px 10px;font-size:19px}
.touch #fireB{display:flex!important}#fireB{display:none;position:absolute;right:calc(env(safe-area-inset-right) + 34px + 92px * var(--fb));bottom:calc(env(safe-area-inset-bottom) + 34px);width:calc(70px * var(--fb));height:calc(70px * var(--fb));border-radius:50%;pointer-events:auto;font-size:calc(28px * var(--fb));padding:0;touch-action:none}.boostL #fireB{right:auto;left:calc(env(safe-area-inset-left) + 34px + 92px * var(--fb))}
.boostL #boostB{right:auto;left:calc(env(safe-area-inset-left) + 24px)}
.hr .btn{zoom:var(--fb)}
#hud{opacity:var(--hudA)}
.scr .btn,.mbox .btn{zoom:var(--bs)}
.settabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.rng{display:flex;align-items:center;gap:10px;min-width:220px;flex:1;max-width:340px}.rng input{flex:1;accent-color:#3fd8ad;height:26px}.rng b{min-width:52px;text-align:right}
.opt .seg{flex-wrap:wrap}
.setnote{color:#e6e0ff;font-size:13px;margin:10px 4px 0;text-shadow:0 1px 0 var(--ink)}
.trow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:2px dashed rgba(29,24,56,.12)}.trow:last-child{border:0}
.trow .pl{width:42px;text-align:center;font-size:20px;font-weight:1000;flex:none}.trow .tx{flex:1;min-width:0}.trow .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trow .tx small{color:var(--mut);font-size:12px}
.trow .vl{font-size:17px;font-weight:1000;white-space:nowrap}.trow.me{background:#e6fff6;border-radius:14px;box-shadow:0 0 0 3px var(--mint) inset}
.cover .scr,.cover .mtop,.cover #toast{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="mtop" id="mtop"><button class="pill" id="mNick" data-a="acc">🐰</button><span class="pill" id="mBank">💎 0</span><button class="pill" id="mFs" data-a="fs" title="Полный экран (F11)">⛶</button></div>

<section class="scr on" id="menu"><div class="wrap">
 <h1 class="logo">Котозайцы<span>в космосе</span></h1>
 <div class="sub" id="mSub">Корабль котозайца сбился с курса. Собирай кристаллы-топливо и долети до родной планеты!</div>
 <div class="mbtns">
  <button class="btn big mint" data-a="play" id="bPlay">▶ Играть</button>
  <div class="mrow2"><button class="btn" data-a="map">🗺 Карта</button><button class="btn" data-a="hangar">🔧 Ангар</button></div>
  <div class="mrow2"><button class="btn" data-a="ships">🚀 Корабли</button><button class="btn" data-a="settings">⚙ Настройки</button></div>
  <div class="mrow2"><button class="btn pink" data-a="quests" id="bQ">📋 Задания</button><button class="btn pink" data-a="top">🏆 Топ игроков</button></div>
  <button class="btn sky" data-a="endless" id="bEnd">♾ Бесконечный рейс</button>
  <button class="btn vio" data-a="adm" id="bAdm" style="display:none">🛠 ADM-панель</button>
  <button class="btn white" data-a="exit" id="bExit" style="display:none">✕ Выйти в лаунчер</button>
 </div>
</div></section>

<section class="scr" id="map"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>🗺 Карта полёта</h2><span class="pill" id="mapProg"></span></div>
 <div id="mapBox"></div>
</div></section>

<section class="scr" id="hangar"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>🔧 Ангар</h2><span class="pill hb">💎 0</span></div>
 <div class="ups" id="upBox"></div>
</div></section>

<section class="scr" id="ships"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>🚀 Корабли</h2><span class="pill hb">💎 0</span></div>
 <div class="ships" id="shipBox"></div>
</div></section>

<section class="scr" id="settings"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>⚙ Настройки</h2></div>
 <div class="settabs" id="setTabs"></div>
 <div class="panel opts" id="setBox"></div>
 <div class="setnote">Настройки сохраняются в твоём аккаунте.</div>
 <div id="admBox"></div>
</div></section>

<section class="scr" id="quests"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>📋 Задания</h2><span class="pill hb">💎 0</span></div>
 <div id="qBox"></div>
</div></section>

<section class="scr" id="top"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>🏆 Топ игроков</h2><span class="pill" id="topNet">📡</span></div>
 <div class="settabs" id="topTabs"></div>
 <div class="panel" id="topBox" style="padding:8px"></div>
 <div class="setnote" id="topNote"></div>
</div></section>

<section class="scr" id="adm"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>🛠 ADM-панель</h2><span class="pill hb">💎 0</span></div>
 <div class="adm" id="admPanel"></div>
</div></section>

<div id="hud">
 <div class="hl"><div class="hearts" id="hHearts"></div><div class="fuel" id="hFuel"><i></i><b>⛽ ТОПЛИВО</b></div><div class="hpu" id="hPu"></div></div>
 <div class="hc"><span class="hsec" id="hSec"></span><span class="pill" id="hGot">💎 0</span><span class="pill combo" id="hCombo"></span><div class="bossbar" id="hBoss"><i></i></div></div>
 <div class="hr"><button class="btn white sm" data-a="pause" style="font-size:20px;padding:6px 12px">⏸</button></div>
 <button class="btn" id="boostB">🚀</button><button class="btn pink" id="fireB" style="display:none">🎯</button>
 <div class="hint" id="hint"></div>
</div>

<div id="modal"><div class="panel mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
const CFG=window.SPACE||{};
const A=window.KZAndroid||null;
const EMB=!!(CFG.embedded||window.parent!==window);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function drawKZ(c,x,y,s,pal,blink){c.save();c.translate(x,y);c.scale(s/34,s/34);c.translate(-32,-27);c.lineWidth=2.4;c.strokeStyle='#1d1838';c.lineJoin='round';
 for(const[cx,rot,ex] of [[18,25,14],[46,-25,50]]){c.save();c.translate(cx,22);c.rotate(rot*Math.PI/180);c.translate(-cx,-22);ell(c,ex,26,6,13,pal.b,1);ell(c,ex,27,3,9,pal.inn,0);c.restore()}
 ell(c,32,27,17,15,pal.b,1);ell(c,32,32,7,5,pal.bl,0);
 c.fillStyle='#1d1838';if(blink){c.lineWidth=2;c.beginPath();c.moveTo(23.5,25);c.lineTo(28.5,25);c.moveTo(35.5,25);c.lineTo(40.5,25);c.stroke()}else{ell(c,26,25,2.6,3.2,'#1d1838');ell(c,38,25,2.6,3.2,'#1d1838');c.fillStyle='#fff';c.beginPath();c.arc(27,23.8,1,0,TAU);c.arc(39,23.8,1,0,TAU);c.fill()}
 c.fillStyle='#ff7aa2';c.beginPath();c.moveTo(30,30);c.lineTo(34,30);c.lineTo(32,32);c.closePath();c.fill();
 c.globalAlpha=.45;ell(c,22,31,3,2,'#ff7fa8');ell(c,42,31,3,2,'#ff7fa8');c.restore()}

/* --- корабль --- */
const DOME={rocket:[4,-10,13],carrot:[0,-8,12],ufo:[0,-11,15],pumpkin:[0,-14,12]};
function drawShip(c,sh,x,y,a,sc,thr,t,inv){
 const ufo=sh.shape==='ufo',ra=ufo?clamp(Math.cos(a),-1,1)*.18:a,flip=!ufo&&Math.cos(a)<0?-1:1;
 c.save();c.translate(x,y);c.rotate(ra);c.scale(sc,sc*flip);c.lineJoin='round';c.lineCap='round';c.strokeStyle='#1d1838';c.lineWidth=3;
 if(inv&&Math.floor(t*14)%2){c.globalAlpha=.45}
 if(sh.glow&&S.set.glow&&qual()>1){c.shadowColor=sh.glow;c.shadowBlur=18}
 // пламя
 if(thr>0){const fl=thr*(0.75+Math.sin(t*50)*.25),tx=ufo?0:sh.shape==='pumpkin'?-24:-24,ty=ufo?14:0;c.save();c.shadowBlur=0;if(ufo){c.translate(0,ty);c.rotate(-Math.PI/2)}else c.translate(tx,ty);
  c.fillStyle='#ff6b3d';c.beginPath();c.moveTo(0,-8);c.quadraticCurveTo(-26*fl,-6,-44*fl,0);c.quadraticCurveTo(-26*fl,6,0,8);c.fill();
  c.fillStyle='#ffd84a';c.beginPath();c.moveTo(0,-5);c.quadraticCurveTo(-16*fl,-3,-28*fl,0);c.quadraticCurveTo(-16*fl,3,0,5);c.fill();c.restore()}
 if(sh.shape==='rocket'){
  c.fillStyle=sh.fin;for(const s of [-1,1]){c.beginPath();c.moveTo(-4,14*s);c.lineTo(-22,28*s);c.lineTo(-28,26*s);c.lineTo(-22,10*s);c.closePath();c.fill();c.stroke()}
  c.fillStyle=sh.body;c.beginPath();c.moveTo(38,0);c.quadraticCurveTo(26,-18,-6,-16);c.lineTo(-22,-12);c.quadraticCurveTo(-28,0,-22,12);c.lineTo(-6,16);c.quadraticCurveTo(26,18,38,0);c.closePath();c.fill();c.stroke();
  c.shadowBlur=0;c.fillStyle=sh.acc;c.beginPath();c.moveTo(38,0);c.quadraticCurveTo(33,-9,24,-12);c.quadraticCurveTo(28,0,24,12);c.quadraticCurveTo(33,9,38,0);c.fill();c.stroke();
  c.beginPath();c.moveTo(-14,-14);c.quadraticCurveTo(-10,0,-14,14);c.lineWidth=5;c.strokeStyle=sh.acc;c.stroke();c.lineWidth=3;c.strokeStyle='#1d1838';
  c.fillStyle='#b9c4d6';c.beginPath();c.rect(-30,-7,8,14);c.fill();c.stroke();
 }else if(sh.shape==='carrot'){
  c.fillStyle=sh.fin;for(const s of [-1,0,1]){c.beginPath();c.moveTo(-20,s*6);c.quadraticCurveTo(-34,s*14-6,-40,s*18);c.quadraticCurveTo(-30,s*14+4,-20,s*6+3);c.closePath();c.fill();c.stroke()}
  c.fillStyle=sh.body;c.beginPath();c.moveTo(40,0);c.quadraticCurveTo(10,-20,-20,-15);c.quadraticCurveTo(-26,0,-20,15);c.quadraticCurveTo(10,20,40,0);c.closePath();c.fill();c.stroke();
  c.shadowBlur=0;c.strokeStyle='rgba(29,24,56,.5)';c.lineWidth=2.5;for(const xx of [-8,6,20]){c.beginPath();c.moveTo(xx,-12+Math.abs(xx)*.08);c.lineTo(xx+5,-6);c.stroke();c.beginPath();c.moveTo(xx+2,13-Math.abs(xx)*.1);c.lineTo(xx+7,7);c.stroke()}
 }else if(sh.shape==='ufo'){
  c.fillStyle=sh.fin;c.beginPath();c.ellipse(0,8,22,8,0,0,TAU);c.fill();c.stroke();
  c.fillStyle=sh.body;c.beginPath();c.ellipse(0,2,38,12,0,0,TAU);c.fill();c.stroke();
  c.shadowBlur=0;for(let i=-2;i<=2;i++){c.fillStyle=(Math.floor(t*4)+i)%2?sh.acc:'#fff';c.beginPath();c.arc(i*13,4,3.5,0,TAU);c.fill();c.stroke()}
 }else if(sh.shape==='pumpkin'){
  c.fillStyle=sh.fin;for(const s of [-1,1]){c.beginPath();c.moveTo(-6,16*s);c.lineTo(-24,28*s);c.lineTo(-28,24*s);c.lineTo(-18,10*s);c.closePath();c.fill();c.stroke()}
  c.fillStyle=sh.body;for(const[ox,rx] of [[-12,16],[12,16],[0,22]]){c.beginPath();c.ellipse(ox,2,rx,19,0,0,TAU);c.fill();c.stroke()}
  c.shadowBlur=0;c.fillStyle='#1d1838';c.beginPath();c.moveTo(14,-2);c.lineTo(20,4);c.lineTo(8,4);c.closePath();c.fill();
  c.beginPath();c.moveTo(4,10);c.quadraticCurveTo(14,18,24,8);c.lineTo(20,10);c.lineTo(16,7);c.lineTo(12,11);c.lineTo(8,8);c.closePath();c.fill();
  c.fillStyle='#3fa34d';c.beginPath();c.rect(-24,-4,8,10);c.fill();c.stroke();
 }
 c.restore();
 // купол с котозайцем: всегда сверху и ровно
 const d=DOME[sh.shape]||DOME.rocket,lx=d[0]*sc,ly=d[1]*sc*flip,ca=Math.cos(ra),sa=Math.sin(ra),wx=x+lx*ca-ly*sa,wy=y+lx*sa+ly*ca,r=d[2]*sc;
 c.save();if(inv&&Math.floor(t*14)%2)c.globalAlpha=.45;c.lineWidth=3*sc;c.strokeStyle='#1d1838';
 c.fillStyle='rgba(120,190,255,.35)';c.beginPath();c.arc(wx,wy,r,0,TAU);c.fill();
 drawKZ(c,wx,wy+r*.2,r*1.45,PAL,(t%4)<.12);
 c.beginPath();c.arc(wx,wy,r,0,TAU);c.stroke();
 c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=2.4*sc;c.beginPath();c.arc(wx,wy,r*.72,-2.6,-1.7);c.stroke();c.restore()}

/* --- спрайты кристаллов --- */
const CT=[{v:1,fuel:14,r:12,c:['#e6faff','#7fd6ff','#2f7fe0'],w:78},{v:3,fuel:24,r:15,c:['#f6e9ff','#c79bff','#7a3de0'],w:18},{v:10,fuel:45,r:18,c:['#fffbe0','#ffd84a','#e0901a'],w:4}];
function gemSprite(t){const r=t.r,s=r*4,cn=mkCanvas(s*2,s*2),c=cn.getContext('2d');c.translate(s,s);
 const gl=c.createRadialGradient(0,0,r*.5,0,0,s);gl.addColorStop(0,t.c[1]+'aa');gl.addColorStop(1,t.c[1]+'00');c.fillStyle=gl;c.beginPath();c.arc(0,0,s,0,TAU);c.fill();
 c.lineJoin='round';c.lineWidth=2.6;c.strokeStyle='#1d1838';
 const P=[[0,-r*1.25],[r*.95,-r*.35],[r*.7,r*.95],[-r*.7,r*.95],[-r*.95,-r*.35]];
 c.fillStyle=t.c[2];c.beginPath();P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill();
 c.fillStyle=t.c[1];c.beginPath();c.moveTo(0,-r*1.25);c.lineTo(r*.95,-r*.35);c.lineTo(0,r*.1);c.lineTo(-r*.95,-r*.35);c.closePath();c.fill();
 c.fillStyle=t.c[0];c.beginPath();c.moveTo(0,-r*1.25);c.lineTo(-r*.95,-r*.35);c.lineTo(-r*.25,-r*.2);c.closePath();c.fill();
 c.beginPath();P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.stroke();
 c.lineWidth=1.6;c.strokeStyle='rgba(29,24,56,.45)';c.beginPath();c.moveTo(-r*.95,-r*.35);c.lineTo(0,r*.1);c.lineTo(r*.95,-r*.35);c.moveTo(0,r*.1);c.lineTo(-r*.7,r*.95);c.moveTo(0,r*.1);c.lineTo(r*.7,r*.95);c.stroke();
 c.fillStyle='#fff';c.beginPath();c.arc(-r*.35,-r*.6,r*.14,0,TAU);c.fill();return cn}
const GEM=CT.map(gemSprite);
/* --- астероиды --- */
function astSprite(r,ice,rand){const p=8,s=r*2+p*2,cn=mkCanvas(s,s),c=cn.getContext('2d');c.translate(s/2,s/2);
 const n=9+Math.floor(rand()*4),pts=[];for(let i=0;i<n;i++){const a=i/n*TAU,rr=r*(.78+rand()*.24);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}
 const g=c.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);if(ice){g.addColorStop(0,'#ffffff');g.addColorStop(1,'#8fd3f0')}else{g.addColorStop(0,'#b0a3c4');g.addColorStop(1,'#6a5d80')}
 c.fillStyle=g;c.strokeStyle='#1d1838';c.lineWidth=3;c.lineJoin='round';c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();c.fill();c.stroke();
 const k=2+Math.floor(r/18);for(let i=0;i<k;i++){const a=rand()*TAU,d=rand()*r*.5,cr=r*(.12+rand()*.12);c.fillStyle=ice?'rgba(90,184,255,.35)':'rgba(40,30,70,.35)';c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d,cr,0,TAU);c.fill()}
 if(ice){c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=2;c.beginPath();c.moveTo(-r*.4,-r*.1);c.lineTo(r*.1,-r*.5);c.stroke()}return cn}
/* --- туманности --- */
function blob(col){const s=256,cn=mkCanvas(s,s),c=cn.getContext('2d'),g=c.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,col+'55');g.addColorStop(.5,col+'22');g.addColorStop(1,col+'00');c.fillStyle=g;c.fillRect(0,0,s,s);return cn}
const STARL=[{p:.12,n:80,s:1},{p:.3,n:50,s:1.6},{p:.55,n:26,s:2.3}].map(L=>{const r=mulberry(77+L.n);L.st=[];for(let i=0;i<L.n;i++)L.st.push({x:r()*1200,y:r()*1200,ph:r()*6,s:L.s*(.6+r()*.7),c:r()<.15?'#ffe9a0':r()<.2?'#bfe3ff':'#fff'});return L});
let SCENE={g:0,blobs:[],sprites:[]};
function setScene(g){const G=GAL[g],r=mulberry(500+g);SCENE={g,sprites:[blob(G.neb[0]),blob(G.neb[1])],blobs:Array.from({length:7},(_,i)=>({x:(r()-.5)*3000,y:(r()-.5)*3000,s:500+r()*700,k:i%2}))}}
setScene(0);

/* ---------- игра ---------- */
let MODE='menu',G=null,SCREEN='menu';
const CAM={x:0,y:0,shake:0};
function fuelMax(){return 100+S.up.tank*30}
function newGame(mode,i){
 const sec=mode==='camp'?secInfo(i):null,g=sec?sec.g:0,diff=[.78,1,1.3][S.set.diff]||1;
 const hp=IS_ADM&&S.adm&&S.adm.hp?S.adm.hp:3+SHIELD[S.up.shield];
 G={mode,sec,g,diff,t:0,R:sec?1300+i*28:0,rand:mulberry(mode==='camp'?1000+i*7919:Date.now()%1e9),
  ship:{x:0,y:0,vx:0,vy:0,a:0,hp,hpMax:hp,fuel:fuelMax(),fmax:fuelMax(),inv:1.5,slow:0,thr:0,fire:.5,zero:0,lowT:0,pu:{shield:0,triple:0,magnet:0,turbo:0}},
  crys:[],ast:[],dogs:[],holes:[],comets:[],shots:[],bones:[],parts:[],pops:[],kits:[],kitT:12,pods:[],saved:0,hunted:0,mines:[],pus:[],rings:[],waves:[],trail:[],combo:0,comboT:0,cbonus:0,maxCombo:0,dmg:0,banner:null,warpT:null,drone:{a:0,x:0,y:0,fire:1},stormT:3,stormDir:0,stormOn:0,stormW:6,ebossT:150,puT:20,time:sec?sec.time:0,
  got:0,need:sec?sec.need:0,boss:null,gate:null,end:false,dist:0,kills:0,cometT:6,spawnT:0,lvl:1,hintT:0};
 setScene(g);
 const s=G.ship,r=G.rand;
 if(mode==='camp'){
  const R=G.R,a0=r()*TAU;
  if(sec.boss){s.x=-R*.62;s.y=0;s.a=0;G.boss=mkBoss(g);banner('⚠ '+GAL[g].boss,'Босс галактики «'+GAL[g].n+'»','#ff6fa8');setTimeout(()=>MODE==='play'&&SFX.boss(),300)}
  else{s.x=Math.cos(a0)*R*.72;s.y=Math.sin(a0)*R*.72;s.a=a0+Math.PI;const ga=a0+Math.PI+(r()-.5)*.8;G.gate={x:Math.cos(ga)*R*.74,y:Math.sin(ga)*R*.74,open:false,t:0}}
  const far=(x,y,d)=>Math.hypot(x-s.x,y-s.y)>d&&(!G.gate||Math.hypot(x-G.gate.x,y-G.gate.y)>160);
  const rp=d=>{for(let k=0;k<60;k++){const a=r()*TAU,q=Math.sqrt(r())*(G.R-60),x=Math.cos(a)*q,y=Math.sin(a)*q;if(far(x,y,d)&&(!G.boss||Math.hypot(x,y)>200))return[x,y]}return[(r()-.5)*G.R,(r()-.5)*G.R]};
  G.stormDir=r()*TAU;let val=0;const target=sec.boss?40:sec.mt==='race'?Math.ceil(G.need*2)+4:Math.ceil((G.need||8)*2.1)+6;
  while(val<target){const[x,y]=rp(140),c=mkCrys(x,y);val+=CT[c.t].v}
  const H=sec.G.haz,na=Math.round((18+i*1.5)*(H.ast||0)*(sec.boss?.6:1)*(sec.mt==='storm'?.6:1));
  for(let k=0;k<na;k++){const[x,y]=rp(300);G.ast.push(mkAst(x,y,rnd(18,58),H.ice&&r()<.35*H.ice))}
  if(H.dog&&!sec.boss){const nd=Math.round((2+i*.22)*H.dog);for(let k=0;k<nd;k++){const[x,y]=rp(700);G.dogs.push(mkDog(x,y))}}
  if(!sec.boss){const[x,y]=rp(500);G.kits.push({x,y,ph:0})}
  const mt=sec.mt;
  if(mt==='rescue'){const pals=Object.values(SK);for(let k=0;k<sec.pods;k++){const[x,y]=rp(450),q=pals[Math.floor(r()*pals.length)];G.pods.push({x,y,ph:r()*6,saved:false,pal:{b:q[1],bl:q[2],inn:q[3]}})}}
  if(mt==='hunt'){for(let k=0;k<sec.hunt+1;k++){const[x,y]=rp(600);G.dogs.push(mkDog(x,y,g>=2&&k%3===2?'snip':g>=1&&k%3===1?'ram':'dog'))}}
  if(!sec.boss&&g>=1){const nr=Math.round(.5+g*.5);for(let k=0;k<nr;k++){const[x,y]=rp(750);G.dogs.push(mkDog(x,y,'ram'))}}
  if(!sec.boss&&g>=2){for(let k=0;k<g-1;k++){const[x,y]=rp(850);G.dogs.push(mkDog(x,y,'snip'))}}
  if(!sec.boss&&g>=1){const nm=2+g*2;for(let k=0;k<nm;k++){const c=G.crys[Math.floor(r()*G.crys.length)];if(c&&Math.hypot(c.x-s.x,c.y-s.y)>380)G.mines.push({x:c.x+rnd(-70,70),y:c.y+rnd(-70,70),arm:-1,t:r()*6})}}
  if(mt==='race'){const gx=G.gate.x,gy=G.gate.y;for(let k=1;k<=6;k++){const f=k/7;G.rings.push({x:lerp(s.x,gx,f)+(r()-.5)*360,y:lerp(s.y,gy,f)+(r()-.5)*360,a:Math.atan2(gy-s.y,gx-s.x),done:false})}}
  for(let k=0;k<(sec.boss?1:2);k++){const[x,y]=rp(350);G.pus.push(mkPu(x,y))}
  if(H.hole){const nh=sec.boss?1:Math.max(1,Math.round(2.4*H.hole));for(let k=0;k<nh;k++){const[x,y]=rp(520);if(!G.gate||Math.hypot(x-G.gate.x,y-G.gate.y)>420)G.holes.push({x,y,r:34,t:r()*9})}}
 }else{s.a=-Math.PI/2;const near=(a,b)=>{const q=Math.random()*TAU,d=rnd(a,b);return[Math.cos(q)*d,Math.sin(q)*d]};for(let k=0;k<30;k++){const[x,y]=near(160,1500);mkCrys(x,y)}for(let k=0;k<18;k++){const[x,y]=near(380,1500);G.ast.push(mkAst(x,y,rnd(18,60),false))}}
 CAM.x=s.x;CAM.y=s.y;CAM.shake=0;
}
function mkCrys(x,y,t){if(cheat('gold'))t=2;else if(t==null){const q=G.rand()*100;t=q<CT[2].w?2:q<CT[2].w+CT[1].w?1:0}const c={x,y,t,ph:Math.random()*6,vx:0,vy:0};G.crys.push(c);return c}

 G.puT-=dt;if(G.puT<=0){G.puT=20;const a=Math.random()*TAU,d=rnd(350,700);G.pus.push(mkPu(s.x+Math.cos(a)*d,s.y+Math.sin(a)*d))}

const LTP='kz-space/v1/',mqEnc=new TextEncoder(),mqDec=new TextDecoder();
function u8b64(u){u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function b64u8(x){return Uint8Array.from(atob(x),c=>c.charCodeAt(0))}
function mqStr(x){const b=mqEnc.encode(x);const o=[b.length>>8,b.length&255];for(const y of b)o.push(y);return o}
function mqPkt(h,body){const len=[];let n=body.length;do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d)}while(n>0);const out=new Uint8Array(1+len.length+body.length);out[0]=h;out.set(len,1);out.set(body,1+len.length);return out}
class MQ{
 constructor(url){this.url=url;this.ok=false;this.subs=new Set();this.buf=new Uint8Array(0);this.pid=1;this.tries=0;this.open()}
 open(){let ws;try{ws=new WebSocket(this.url,['mqtt'])}catch(e){this.retry();return}this.ws=ws;ws.binaryType='arraybuffer';this.buf=new Uint8Array(0);
  ws.onopen=()=>{this.raw(mqPkt(0x10,[...mqStr('MQTT'),4,2,0,60,...mqStr('ks'+Math.random().toString(36).slice(2,12))]))};
  ws.onmessage=e=>{if(e.data instanceof ArrayBuffer)this.feed(new Uint8Array(e.data))};
  ws.onclose=()=>{this.ok=false;clearInterval(this.ka);this.retry()};ws.onerror=()=>{try{ws.close()}catch(e){}}}
 retry(){this.tries++;clearTimeout(this.rt);this.rt=setTimeout(()=>this.open(),Math.min(30000,1500*this.tries))}
 feed(chunk){const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
  while(this.buf.length>=2){let mul=1,len=0,i=1,byte;do{if(i>=this.buf.length)return;byte=this.buf[i++];len+=(byte&127)*mul;mul*=128}while(byte&128);
   if(this.buf.length<i+len)return;const h=this.buf[0],body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);this.handle(h,body)}}
 handle(h,body){const t=h>>4;
  if(t===2){if(body[1]===0){this.ok=true;this.tries=0;for(const x of this.subs)this.sendSub(x);clearInterval(this.ka);this.ka=setInterval(()=>this.raw(new Uint8Array([0xC0,0])),25000);setTimeout(netPresence,300);admSoon()}else{try{this.ws.close()}catch(e){}}}

}

function exitToLauncher(){save();try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}try{if(window.parent!==window){parent.postMessage({space:'exit'},'*');return}}catch(e){}
 if(A){try{location.href=A.fileUrl?A.fileUrl('launcher.html'):'launcher.html'}catch(e){location.href='launcher.html'}return}try{window.close()}catch(e){}}
window.kzBack=()=>{if(MODE==='play'){pause();return}if(MODE==='pause'){resume();return}if($('#modal').classList.contains('on')){if(MODE==='result'){toMenu();return}closeModal();return}if(SCREEN&&SCREEN!=='menu'){show('menu');return}exitToLauncher()};

function doAct(a,el){if(S.set.click)SFX.click();
 if(a==='play'){if(!S.intro){S.intro=true;save();modal(`<h3>🚀 Котозайцы в космосе</h3><p>Корабль котозайца сбился с курса и залетел на край галактики. Топлива почти нет!</p><div class="rw"><span>💎 кристаллы = топливо</span><span>🌀 врата = прыжок</span></div><p>Собирай кристаллы, открывай врата и прыгай от сектора к сектору. Остерегайся астероидов, космопсов и чёрных дыр. Впереди — 5 галактик и родная планета <b>Котозаяция</b>.</p><div class="mbtn"><button class="btn big mint" data-a="play">Полетели! 🚀</button></div>`);return}
  startSector(S.won?Math.min(S.sector,NSEC-1):S.sector);return}
 if(a==='map'||a==='hangar'||a==='ships'||a==='settings'||a==='adm'||a==='quests'||a==='top'){if(MODE==='result'){closeModal();MODE='menu';G=null}else closeModal();show(a);return}
 if(a==='back'){show('menu');return}
 if(a==='acc'){accModal();return}if(a==='fs'){toggleFS();return}
 if(a==='tabin'){authForm(false);return}if(a==='tabreg'){authForm(true);return}
 if(a==='dologin'){doAuth(false);return}if(a==='doreg'){doAuth(true);return}
 if(a==='guest'){LS.set('kz_session','__guest');switchAcc();closeModal();toast('🐰 Гостевой режим');return}
 if(a==='logout'){LS.set('kz_session','__guest');switchAcc();authForm(false);toast('Ты вышел из аккаунта');return}
 if(a==='accswitch'){authForm(false);return}
 if(a==='accnick'){modal(`<h3>✏ Новый ник</h3><div class="form"><input id="fNick" maxlength="20" value="${esc(NICK)}"><div class="err" id="fE"></div></div><div class="mbtn"><button class="btn big mint" data-a="nickok">Сохранить</button><button class="btn white" data-a="acc">Отмена</button></div>`);setTimeout(()=>$('#fNick').focus(),60);return}
 if(a==='nickok'){const n=$('#fNick').value.trim();if(!n){$('#fE').textContent='Ник не может быть пустым';return}const db=accDB();if(db[ACC]){db[ACC].nick=n.slice(0,20);saveDB(db)}loadAcc();save();renderMenu();accModal();toast('✓ Ник: '+n);return}
 if(a==='mclose'){closeModal();return}
 if(a==='setreset'){if(!confirm('Вернуть все настройки как были?'))return;S.set=defSave().set;save();AUTOQ=3;applySet();renderSettings();toast('↩ Настройки сброшены');return}
 if(a==='admwin'){admCheat('f2');return}if(a==='admheal'){admCheat('f4');return}
 if(a==='endless'){startEndless();return}
 if(a==='exit'){exitToLauncher();return}
 if(a==='pause'){pause();return}if(a==='resume'){resume();return}
 if(a==='restart'){const g=G;if(g.mode==='camp')startSector(g.sec.i);else startEndless();return}
 if(a==='quit'){toMenu();return}if(a==='tomenu'){toMenu();return}
 if(a==='retry'){startSector(G.sec.i);return}
 if(a==='next'){const n=G.sec.i+1;if(n<NSEC)startSector(n);else toMenu();return}
 if(a==='reset'){if(!confirm('Сбросить весь прогресс «Котозайцев в космосе»? Кристаллы, корабли и сектора пропадут.'))return;const set=S.set;S=defSave();S.set=set;save();toast('Прогресс сброшен');renderSettings();return}}
document.addEventListener('click',e=>{const t=e.target;ac();if(S.set.mus)musStart();
 const b=t.closest('[data-a]');if(b){doAct(b.dataset.a,b);return}
 const at=t.closest('[data-admt]');if(at){ADT=at.dataset.admt;LS.set('kz_space_admtab',ADT);renderAdm();return}
 const as=t.closest('[data-adm-sel]');if(as){admSel=as.dataset.admSel;renderAdm();return}
 const gf=t.closest('[data-gift]');if(gf&&IS_ADM){admGift(gf.dataset.gift,false);return}
 const wg=t.closest('[data-wgift]');if(wg&&IS_ADM){admGift(wg.dataset.wgift,true);return}
 const wd=t.closest('[data-world]');if(wd&&IS_ADM){admWorld(wd.dataset.world);return}
 const fl=t.closest('[data-fill]');if(fl){$('#fU').value=fl.dataset.fill;$('#fP').focus();return}
 const tt=t.closest('[data-topt]');if(tt){TOPT=tt.dataset.topt;LS.set('kz_space_toptab',TOPT);renderTop();return}
 const cq=t.closest('[data-claimq]');if(cq){claimQ(cq.dataset.claimq);return}
 const ca=t.closest('[data-claima]');if(ca){claimA(ca.dataset.claima);return}
 const sc=t.closest('[data-sec]');if(sc){startSector(+sc.dataset.sec);return}
 const up=t.closest('[data-up]');if(up){const id=up.dataset.up,l=S.up[id]|0,c=(UPS.find(u=>u.id===id).cost||UPCOST)[l];if(l>=5)return;if(S.crystals<c){toast('Не хватает 💎 — нужно '+c);SFX.low();return}S.crystals-=c;S.up[id]++;save();SFX.buy();toast('✨ '+UPS.find(u=>u.id===id).n+': уровень '+S.up[id]);show('hangar');return}
 const by=t.closest('[data-buy]');if(by){const sh=SHIPS.find(x=>x.id===by.dataset.buy);if(S.crystals<sh.price){toast('Не хватает 💎 — нужно '+sh.price);SFX.low();return}S.crystals-=sh.price;S.ships.push(sh.id);S.ship=sh.id;save();SFX.buy();toast('🚀 '+sh.n+' теперь твой!');show('ships');return}
 const se=t.closest('[data-ship]');if(se){S.ship=se.dataset.ship;save();show('ships');return}
 const st2=t.closest('[data-sett]');if(st2){SETT=st2.dataset.sett;LS.set('kz_space_settab',SETT);renderSettings();return}
 const op=t.closest('[data-opt]');if(op){const k=op.dataset.opt,v=op.dataset.v;S.set[k]=/^-?\d+(\.\d+)?$/.test(v)?+v:v;save();if(k==='q'){AUTOQ=3}applySet();renderSettings();return}
 const sw=t.closest('[data-set]');if(sw){const k=sw.dataset.set;S.set[k]=S.set[k]?0:1;save();sw.classList.toggle('on',!!S.set[k]);if(k==='mus'&&S.set.mus)musStart();if(k==='hideTop')netPresence();applySet();return}
 const df=t.closest('[data-diff]');if(df){S.set.diff=+df.dataset.diff;save();renderSettings();return}
 const ad=t.closest('[data-adm]');if(ad&&IS_ADM){admAct(ad.dataset.adm,ad);return}
 const ch=t.closest('[data-cheat]');if(ch&&IS_ADM){const k=ch.dataset.cheat;S.adm[k]=S.adm[k]?0:1;save();ch.classList.toggle('on',!!S.adm[k]);toast('🛠 '+ch.dataset.n+': '+(S.adm[k]?'вкл':'выкл'));return}});
document.addEventListener('input',e=>{const r=e.target.closest('[data-rng]');if(!r)return;const k=r.dataset.rng;S.set[k]=+r.value;const b=document.querySelector(`[data-rv="${k}"]`);if(b)b.textContent=r.value+(b.textContent.replace(/^-?[\d.]+/,''));save();if(['ui','bsz','fbz','hudA','radarSz'].includes(k))applySet();if(k==='vol')tone(660,.08,'triangle',.06)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&MODE==='menu')closeModal()});

/* ---------- цикл ---------- */
let last=performance.now();const FPS={n:0,t:0,v:0};
let lastDraw=0,slowT=0;function frame(now){if(S.set.fpsLim&&now-lastDraw<1000/S.set.fpsLim-2){requestAnimationFrame(frame);return}lastDraw=now;const dt=Math.min(.033,(now-last)/1000);last=now;
 if(S.set.q==='auto'&&MODE==='play'&&FPS.v){if(FPS.v<38){slowT+=dt;if(slowT>3&&AUTOQ>0){AUTOQ--;slowT=0;resize()}}else slowT=0}const t=now/1000;if(MODE==='result'&&G&&G.warpT!=null)G.warpT+=dt;
 FPS.n++;if(now-FPS.t>1000){FPS.v=FPS.n;FPS.n=0;FPS.t=now}
 if(MODE==='play'&&G){const sp=IS_ADM&&S.adm&&S.adm.spd?S.adm.spd:1;update(dt*sp);S.st.time=(S.st.time||0)+dt;hudUpdate()}else if(MODE==='result'&&G){for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)G.parts.splice(i,1)}}
 render(t);requestAnimationFrame(frame)}
if(location.hash==='#cover')document.body.classList.add('cover');
applySet();setScene(Math.min(4,Math.floor(Math.min(S.sector,NSEC-1)/5)));save();show('menu');requestAnimationFrame(frame);
if(LS.get('kz_session')==null&&!document.body.classList.contains('cover'))setTimeout(()=>{if(MODE==='menu'&&!$('#modal').classList.contains('on'))authForm(false)},500);
netStart();
addEventListener('storage',e=>{if(e.key==='kz_session'&&MODE==='menu'){switchAcc()}});
window.__space={get S(){return S},get G(){return G},startSector,startEndless,finish:(w)=>G&&finish(w,'тест')};
</script>
</body>
