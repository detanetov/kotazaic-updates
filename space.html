<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Котозайцы в космосе</title>
<style>
:root{--ink:#1d1838;--cream:#fff7e8;--cream2:#ffeccc;--yel:#ffc93c;--mint:#3fd8ad;--pink:#ff6fa8;--vio:#8f6bff;--sky:#5ab8ff;--red:#ff5e7a;--mut:#6b6394}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;color:#fff;font:800 15px/1.4 "Nunito KZ","Nunito","Segoe UI",system-ui,sans-serif;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;z-index:5;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px);touch-action:pan-y}
.scr.on{display:block;animation:scrIn .25s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}}
.wrap{max-width:780px;margin:0 auto}
.btn{appearance:none;font:900 16px/1.15 "Nunito KZ","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--yel);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:16px;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.mint{background:var(--mint)}.btn.pink{background:var(--pink)}.btn.sky{background:var(--sky)}.btn.white{background:#fff}.btn.vio{background:var(--vio);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.big{font-size:22px;padding:15px 28px;border-radius:20px;box-shadow:0 6px 0 var(--ink)}
.btn.sm{font-size:13px;padding:7px 11px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.panel{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
.top{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.top h2{flex:1;margin:0;font-size:26px;font-weight:1000;color:#ffe9a0;text-shadow:0 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
.pill{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 var(--ink);font-weight:900;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
/* menu */
#menu .wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:1100px}
.logo{font-weight:1000;font-size:clamp(40px,7.4vw,74px);line-height:.9;color:var(--yel);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink);margin:0 0 14px;letter-spacing:-1px}
.logo span{display:block;color:#9fe8ff;font-size:.8em}
.mbtns{display:grid;gap:10px;width:min(340px,100%)}
.mbtns .btn{justify-content:flex-start}
.mbtns .btn.big{justify-content:center}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtop{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 12px);display:flex;gap:8px;z-index:6}
.sub{color:#e6e0ff;margin:-4px 0 18px;font-size:15px;max-width:420px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@media (max-width:640px){#menu .wrap{justify-content:flex-end;align-items:center;text-align:center}.mbtns{margin:0 auto}.sub{margin-left:auto;margin-right:auto}.mtop{left:14px;right:14px;justify-content:space-between}}
/* map */
.gal{margin-bottom:16px;padding:14px}
.galh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.galh i{font-style:normal;font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.galh b{font-size:18px;display:block}.galh small{color:var(--mut)}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.node{border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:8px 2px 6px;text-align:center;cursor:pointer;font:900 18px inherit;font-family:inherit;color:var(--ink);transition:transform .12s}
.node:hover{transform:translateY(-2px)}
.node small{display:block;font-size:12px;letter-spacing:1px;color:#e0961a;min-height:16px}
.node.cur{background:var(--yel);animation:nb 1.6s ease-in-out infinite}
@keyframes nb{50%{transform:translateY(-3px)}}
.node.lock{background:#e8e2f6;color:#9a93bf;cursor:default;box-shadow:0 3px 0 #9a93bf;border-color:#9a93bf}
.node.boss{background:#ffd6dc}.node.boss.lock{background:#e8e2f6}
.home{display:flex;align-items:center;gap:14px;padding:14px}
/* hangar & ships */
.ups{display:grid;gap:10px}
.up{display:flex;align-items:center;gap:12px;padding:12px 14px}
.up .ic{font-size:30px;width:52px;height:52px;border-radius:16px;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.up .tx{flex:1;min-width:0}.up .tx b{font-size:17px}.up .tx small{display:block;color:var(--mut);font-size:13px}
.pips{display:flex;gap:4px;margin-top:5px}.pips i{width:20px;height:9px;border-radius:9px;border:2px solid var(--ink);background:#fff}.pips i.on{background:var(--mint)}
.ships{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.shc{padding:10px;text-align:center}
.shc canvas{width:100%;height:110px;display:block;border-radius:14px;background:radial-gradient(circle at 50% 40%,#3a2a8a,#120c35);border:3px solid var(--ink)}
.shc b{display:block;margin:8px 0 2px}.shc small{display:block;color:var(--mut);font-size:12px;min-height:18px;margin-bottom:6px}
.shc.sel{background:#e6fff6;box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--mint) inset}
/* settings */
.opts{padding:4px 0}.opt{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;border-bottom:2px dashed rgba(29,24,56,.15)}.opt:last-child{border:0}
.opt .tx{flex:1;min-width:180px}.opt small{display:block;color:var(--mut);font-size:12px}
.seg{display:flex;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px}.seg button{border:0;background:none;font:900 13px inherit;font-family:inherit;color:var(--ink);padding:6px 10px;border-radius:9px;cursor:pointer}.seg button.on{background:var(--yel)}
.sw{width:54px;height:32px;border-radius:99px;border:3px solid var(--ink);background:#e8e2f6;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:var(--mint)}.sw.on:after{left:25px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#hud.on{display:block}
.hl{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 10px);display:grid;gap:7px}
.hearts{font-size:22px;letter-spacing:1px;filter:drop-shadow(0 2px 0 var(--ink))}
.fuel{width:min(210px,40vw);height:20px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--ink);position:relative}
.fuel i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3fd8ad,#9fe8ff);transition:width .15s}
.fuel b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--ink)}
.fuel.low i{background:linear-gradient(90deg,#ff5e7a,#ffb36b)}.fuel.low{animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.05)}}
.hc{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);text-align:center;display:grid;gap:6px;justify-items:center}
.hc .pill{font-size:15px}
.hsec{font-size:12px;color:#e6e0ff;text-shadow:0 2px 0 var(--ink)}
.bossbar{width:min(360px,60vw);height:18px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--ink);display:none}
.bossbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5e7a,#ff9be0);transition:width .15s}
.hr{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 10px);pointer-events:auto}
#boostB{position:absolute;right:calc(env(safe-area-inset-right) + 24px);bottom:calc(env(safe-area-inset-bottom) + 28px);width:92px;height:92px;border-radius:50%;pointer-events:auto;display:none;font-size:36px;padding:0;touch-action:none}
#boostB.on{background:var(--pink);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.touch #boostB{display:flex}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:rgba(18,12,53,.75);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:8px 14px;font-size:14px;color:#fff;transition:opacity .6s;opacity:0;text-align:center;max-width:90vw}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,6,30,.6);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;text-align:center;animation:pop .28s cubic-bezier(.34,1.56,.64,1);border-radius:28px;border-width:4px;box-shadow:0 8px 0 var(--ink)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.mbox h3{margin:0 0 6px;font-size:26px;font-weight:1000}
.mbox p{margin:6px 0 12px;color:#4a4370}
.mbtn{display:grid;gap:9px;margin-top:14px}
.big3{font-size:44px;letter-spacing:4px;margin:4px 0}
.big3 .off{opacity:.2;filter:grayscale(1)}
.rw{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.rw span{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 150px);transform:translateX(-50%) translateY(-10px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:16px;padding:9px 16px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:30;text-align:center;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.touch .hint{bottom:calc(env(safe-area-inset-bottom) + 136px)}
@media (max-width:640px){.hc{left:12px;transform:none;top:calc(env(safe-area-inset-top) + 84px);justify-items:start}.hsec{display:none}.bossbar{width:52vw}#toast{top:calc(env(safe-area-inset-top) + 200px)}}
.cover .scr,.cover .mtop,.cover #toast{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="mtop" id="mtop"><span class="pill" id="mNick">🐰</span><span class="pill" id="mBank">💎 0</span></div>

<section class="scr on" id="menu"><div class="wrap">
 <h1 class="logo">Котозайцы<span>в космосе</span></h1>
 <div class="sub" id="mSub">Корабль котозайца сбился с курса. Собирай кристаллы-топливо и долети до родной планеты!</div>
 <div class="mbtns">
  <button class="btn big mint" data-a="play" id="bPlay">▶ Играть</button>
  <div class="mrow2"><button class="btn" data-a="map">🗺 Карта</button><button class="btn" data-a="hangar">🔧 Ангар</button></div>
  <div class="mrow2"><button class="btn" data-a="ships">🚀 Корабли</button><button class="btn" data-a="settings">⚙ Настройки</button></div>
  <button class="btn sky" data-a="endless" id="bEnd">♾ Бесконечный рейс</button>
  <button class="btn white" data-a="exit" id="bExit" style="display:none">✕ Выйти в лаунчер</button>
 </div>
</div></section>

<section class="scr" id="map"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>🗺 Карта полёта</h2><span class="pill" id="mapProg"></span></div>
 <div id="mapBox"></div>
</div></section>

<section class="scr" id="hangar"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>🔧 Ангар</h2><span class="pill hb">💎 0</span></div>
 <div class="ups" id="upBox"></div>
</div></section>

<section class="scr" id="ships"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>🚀 Корабли</h2><span class="pill hb">💎 0</span></div>
 <div class="ships" id="shipBox"></div>
</div></section>

<section class="scr" id="settings"><div class="wrap">
 <div class="top"><button class="btn white" data-a="back">←</button><h2>⚙ Настройки</h2></div>
 <div class="panel opts" id="setBox"></div>
 <div id="admBox"></div>
</div></section>

<div id="hud">
 <div class="hl"><div class="hearts" id="hHearts"></div><div class="fuel" id="hFuel"><i></i><b>⛽ ТОПЛИВО</b></div></div>
 <div class="hc"><span class="hsec" id="hSec"></span><span class="pill" id="hGot">💎 0</span><div class="bossbar" id="hBoss"><i></i></div></div>
 <div class="hr"><button class="btn white sm" data-a="pause" style="font-size:20px;padding:6px 12px">⏸</button></div>
 <button class="btn" id="boostB">🚀</button>
 <div class="hint" id="hint"></div>
</div>

<div id="modal"><div class="panel mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
const CFG=window.SPACE||{};
const A=window.KZAndroid||null;
const EMB=!!(CFG.embedded||window.parent!==window);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function angLerp(a,b,t){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t}
const fmt=n=>Math.round(n).toLocaleString('ru-RU');

/* ---------- аккаунт лаунчера ---------- */
const SK={"grey": ["Серый", "#a4a9b4", "#ece8e2", "#f3b7c8"], "smoke": ["Дымчатый", "#727786", "#cdc9d4", "#e9a3b8"], "milk": ["Молочный", "#efe4d1", "#fffaf0", "#f6b9c6"], "ginger": ["Рыжий", "#f0a35a", "#ffe2bf", "#ffb3a1"], "choco": ["Шоколадный", "#8a5a3c", "#dcb48e", "#f0a3a3"], "sky": ["Облачный", "#9fc8ff", "#eef5ff", "#ffb6d0"], "mint": ["Мятный", "#7fdcc0", "#e3fff5", "#ffb3c8"], "pinky": ["Розовый", "#ff9cc8", "#ffe6f1", "#ff6fa8"], "night": ["Ночной", "#3e3858", "#7a73a0", "#b48cff"], "ice": ["Ледяной", "#bfefff", "#ffffff", "#9fd8ff"], "cosmic": ["Космический", "#6a55d8", "#b9a9ff", "#ff9be0"], "ghost": ["Призрачный", "#e6e3ff", "#ffffff", "#d6c9ff"], "lavender": ["Лавандовый", "#c7a8ff", "#f3ecff", "#ff9cc8"], "lemon": ["Лимонный", "#ffe680", "#fffbe0", "#ffb36b"], "cherry": ["Вишнёвый", "#e8556e", "#ffd6dc", "#ffb3c0"], "neon": ["Неоновый", "#39e89f", "#d8fff0", "#ff7eb6"], "rainbow": ["Радужный", "#ff8fc8", "#ffffff", "#ffffff"], "golden": ["Звёздный", "#f2c94c", "#fff1b8", "#ffb36b"], "pumpkin": ["Тыквенный", "#ff8a3d", "#ffd29c", "#ffcf6b"], "peach": ["Персиковый", "#ffc2a1", "#fff0e6", "#ff9e9e"], "sand": ["Песочный", "#d9c08f", "#f6ecd6", "#f3b0a0"], "coffee": ["Кофейный", "#6b4a36", "#c9a786", "#e89c9c"], "forest": ["Лесной", "#5f9a5a", "#d8f0c8", "#ffb3a1"], "sea": ["Морской", "#3fa7c4", "#dff6ff", "#ffb6d0"], "blueberry": ["Черничный", "#4a4fae", "#c8ccff", "#ff9cc8"], "coral": ["Коралловый", "#ff7a6b", "#ffe0da", "#ffd06b"], "lava": ["Лавовый", "#3a1a1a", "#ff8a3d", "#ffcf33"], "emerald": ["Изумрудный", "#1fb37a", "#c8ffe6", "#ffe066"], "diamond": ["Алмазный", "#d6f4ff", "#ffffff", "#a8e4ff"]};
function accDB(){try{return JSON.parse(LS.get('kz_accounts_v1'))||{}}catch(e){return{}}}
const ACC=(()=>{const u=LS.get('kz_session');return u&&u!=='__guest'&&accDB()[u]?u:''})();
const NICK=ACC?(accDB()[ACC].nick||ACC):(CFG.nick||'Гость');
const IS_ADM=ACC==='deta'||ACC==='detanetov';
const PAL=(()=>{let s=null;if(Array.isArray(CFG.skin))s=CFG.skin;else{const a=ACC&&accDB()[ACC],k=a&&a.save&&a.save.eq&&a.save.eq.skin;s=k&&SK[k]}s=s||SK.grey;return{b:s[1],bl:s[2],inn:s[3]}})();

/* ---------- корабли и улучшения ---------- */
const SHIPS=[
 {id:'classic',n:'Ракета',d:'Надёжная и белая',price:0,shape:'rocket',body:'#f4f1ff',acc:'#ff6fa8',fin:'#5ab8ff'},
 {id:'carrot',n:'Морковка',d:'Хрустящий двигатель',price:150,shape:'carrot',body:'#ff8a3d',acc:'#ffb36b',fin:'#5fbf4a'},
 {id:'pumpkin',n:'Тыква-ракета',d:'🎃 Хэллоуин-версия',price:250,shape:'pumpkin',body:'#ff8a3d',acc:'#ffd29c',fin:'#7a3db8'},
 {id:'ufo',n:'Тарелка',d:'Как у космопсов, но добрая',price:300,shape:'ufo',body:'#b9c4d6',acc:'#5ee6c1',fin:'#8f6bff'},
 {id:'ice',n:'Ледокол',d:'Для ледяных колец',price:400,shape:'rocket',body:'#dff6ff',acc:'#5ab8ff',fin:'#9fe8ff'},
 {id:'star',n:'Звездолёт',d:'Ночной с золотом',price:550,shape:'rocket',body:'#2b2f6e',acc:'#ffd84a',fin:'#ffd84a'},
 {id:'neon',n:'Неон',d:'Светится в темноте',price:750,shape:'rocket',body:'#14102e',acc:'#39e89f',fin:'#ff7eb6',glow:'#39e89f'},
 {id:'gold',n:'Золотой',d:'Награда: долети до Котозаяции',price:-1,shape:'rocket',body:'#f2c94c',acc:'#fff1b8',fin:'#e0961a',glow:'#ffd84a'}];
const UPS=[
 {id:'tank',ic:'⛽',n:'Бак',d:l=>'Топлива: '+(100+l*30)},
 {id:'engine',ic:'🔥',n:'Двигатель',d:l=>'Скорость +'+l*13+'%'},
 {id:'shield',ic:'🛡',n:'Щит',d:l=>'Сердечек: '+(3+SHIELD[l])},
 {id:'magnet',ic:'🧲',n:'Магнит',d:l=>'Притягивает кристаллы на '+(70+l*40)+' м'},
 {id:'laser',ic:'🥕',n:'Морковный лазер',d:l=>'Выстрелов в секунду: '+(1/laserRate(l)).toFixed(1)+(l>=2?' · урон '+laserDmg(l):'')}];
const SHIELD=[0,1,1,2,2,3],UPCOST=[25,60,120,220,360];
const laserRate=l=>.6-l*.08,laserDmg=l=>1+Math.floor(l/2);

/* ---------- галактики ---------- */
const GAL=[
 {n:'Морковная туманность',ic:'🥕',col:'#ff8a3d',bg:['#2a1252','#0b0522'],neb:['#ff8a3d','#ff6fa8'],pl:['#ffb36b','#d9542b'],haz:{ast:1},boss:'Пёс-капитан'},
 {n:'Пояс Псов',ic:'🐶',col:'#5ab8ff',bg:['#0f2152','#04091c'],neb:['#5ab8ff','#3fd8ad'],pl:['#7fdcc0','#1f7a8a'],haz:{ast:1,dog:1},boss:'Пёс-робот'},

  if(sec.boss){s.x=-R*.62;s.y=0;s.a=0;G.boss=mkBoss(g);toast('⚠ '+GAL[g].boss+'! Сбей его морковным лазером');setTimeout(()=>MODE==='play'&&SFX.boss(),300)}
  else{s.x=Math.cos(a0)*R*.72;s.y=Math.sin(a0)*R*.72;s.a=a0+Math.PI;const ga=a0+Math.PI+(r()-.5)*.8;G.gate={x:Math.cos(ga)*R*.74,y:Math.sin(ga)*R*.74,open:false,t:0}}
  const far=(x,y,d)=>Math.hypot(x-s.x,y-s.y)>d&&(!G.gate||Math.hypot(x-G.gate.x,y-G.gate.y)>160);
  const rp=d=>{for(let k=0;k<60;k++){const a=r()*TAU,q=Math.sqrt(r())*(G.R-60),x=Math.cos(a)*q,y=Math.sin(a)*q;if(far(x,y,d)&&(!G.boss||Math.hypot(x,y)>200))return[x,y]}return[(r()-.5)*G.R,(r()-.5)*G.R]};
  let val=0;const target=sec.boss?40:Math.ceil(G.need*2.3)+6;
  while(val<target){const[x,y]=rp(140),c=mkCrys(x,y);val+=CT[c.t].v}
  const H=sec.G.haz,na=Math.round((16+i*1.3)*(H.ast||0)*(sec.boss?.6:1));
  for(let k=0;k<na;k++){const[x,y]=rp(300);G.ast.push(mkAst(x,y,rnd(18,58),H.ice&&r()<.35*H.ice))}
  if(H.dog&&!sec.boss){const nd=Math.round((2+i*.22)*H.dog);for(let k=0;k<nd;k++){const[x,y]=rp(700);G.dogs.push(mkDog(x,y))}}
  if(!sec.boss){const[x,y]=rp(500);G.kits.push({x,y,ph:0})}
  if(H.hole){const nh=sec.boss?1:Math.max(1,Math.round(2.4*H.hole));for(let k=0;k<nh;k++){const[x,y]=rp(520);if(!G.gate||Math.hypot(x-G.gate.x,y-G.gate.y)>420)G.holes.push({x,y,r:34,t:r()*9})}}
 }else{s.a=-Math.PI/2;const near=(a,b)=>{const q=Math.random()*TAU,d=rnd(a,b);return[Math.cos(q)*d,Math.sin(q)*d]};for(let k=0;k<30;k++){const[x,y]=near(160,1500);mkCrys(x,y)}for(let k=0;k<18;k++){const[x,y]=near(380,1500);G.ast.push(mkAst(x,y,rnd(18,60),false))}}
 CAM.x=s.x;CAM.y=s.y;CAM.shake=0;
}
function mkCrys(x,y,t){if(t==null){const q=G.rand()*100;t=q<CT[2].w?2:q<CT[2].w+CT[1].w?1:0}const c={x,y,t,ph:Math.random()*6,vx:0,vy:0};G.crys.push(c);return c}
function mkAst(x,y,r,ice){const a=Math.random()*TAU,v=rnd(8,34);return{x,y,r,ice:!!ice,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:Math.random()*TAU,va:rnd(-.6,.6),hp:Math.ceil(r/18),spr:astSprite(r,ice,mulberry(Math.random()*1e9|0)),hit:0}}
function mkDog(x,y){return{x,y,vx:0,vy:0,hp:3+G.g,r:26,fire:rnd(1.5,3.5),hit:0,ph:Math.random()*6,wx:x,wy:y}}
function mkBoss(g){const hp=Math.round((30+g*22)*G.diff);return{x:0,y:0,vx:0,vy:0,r:80+g*5,hp,max:hp,t:0,atk:2.5,spawn:5,cd:7,charge:0,cx:0,cy:0,g,hit:0,blink:0,name:GAL[g].boss}}

function streamUpdate(dt){const s=G.ship,lv=G.lvl=1+Math.floor(G.t/40);
 const far=o=>Math.hypot(o.x-s.x,o.y-s.y)>2300;G.crys=G.crys.filter(o=>!far(o));G.ast=G.ast.filter(o=>!far(o));G.dogs=G.dogs.filter(o=>!far(o));G.holes=G.holes.filter(o=>!far(o));
 const pos=()=>{const a=Math.random()*TAU,d=rnd(1050,1600);return[s.x+Math.cos(a)*d,s.y+Math.sin(a)*d]};
 while(G.crys.length<Math.max(14,30-lv*2)){const[x,y]=pos();mkCrys(x,y)}
 while(G.ast.length<18+lv*3){const[x,y]=pos();G.ast.push(mkAst(x,y,rnd(18,60),lv>=3&&Math.random()<.25))}
 while(G.dogs.length<Math.min(7,Math.floor((lv-1)*1.2))){const[x,y]=pos();G.dogs.push(mkDog(x,y))}
 while(G.holes.length<(lv>=4?Math.min(3,lv-3):0)){const[x,y]=pos();G.holes.push({x,y,r:34,t:0})}
 if(lv>=2){G.cometT-=dt;if(G.cometT<=0){G.cometT=rnd(5,9)/Math.min(2,lv*.5);spawnComet()}}}
function spawnComet(){const s=G.ship,a=Math.random()*TAU,x=s.x+Math.cos(a)*1100,y=s.y+Math.sin(a)*1100,aim=Math.atan2(s.y-y,s.x-x)+rnd(-.35,.35),v=rnd(520,700);G.comets.push({x,y,vx:Math.cos(aim)*v,vy:Math.sin(aim)*v,r:17,life:4})}

function part(x,y,n,col,sp,life,size){for(let i=0;i<n&&G.parts.length<500;i++){const a=Math.random()*TAU,v=Math.random()*(sp||200);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:(life||.6)*rnd(.6,1.2),max:life||.6,c:col,s:size||rnd(2,5)})}}
function popTxt(x,y,txt,c){G.pops.push({x,y,txt,c:c||'#fff',t:0})}
function hit(n,from){const s=G.ship;if(s.inv>0||G.end)return;s.hp-=n;s.inv=1.4;CAM.shake=14;SFX.hit();part(s.x,s.y,22,'#ff7eb6',260,.6);if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
 if(from){const dx=s.x-from.x,dy=s.y-from.y,d=Math.hypot(dx,dy)||1;s.vx+=dx/d*320;s.vy+=dy/d*320}
 if(s.hp<=0){s.hp=0;finish(false,'Корабль разбит')}}
function collect(c){const t=CT[c.t],s=G.ship;G.got+=t.v;s.fuel=Math.min(s.fmax,s.fuel+t.fuel);SFX.pick(t.v);part(c.x,c.y,10,t.c[1],160,.5);popTxt(c.x,c.y-20,'+'+t.v+' 💎',t.c[1]);
 if(G.gate&&!G.gate.open&&G.got>=G.need){G.gate.open=true;SFX.gate();toast('🌀 Врата открыты! Лети к ним');showHint('Стрелка на краю экрана показывает путь к вратам')}}
function shoot(tx,ty){const s=G.ship,a=Math.atan2(ty-s.y,tx-s.x),v=950;G.shots.push({x:s.x+Math.cos(a)*30,y:s.y+Math.sin(a)*30,vx:Math.cos(a)*v+s.vx*.3,vy:Math.sin(a)*v+s.vy*.3,a,life:.7,dmg:laserDmg(S.up.laser)});SFX.shot()}
function damageAst(o,d){o.hp-=d;o.hit=.12;if(o.hp>0){SFX.pop();return}
 const i=G.ast.indexOf(o);if(i>=0)G.ast.splice(i,1);part(o.x,o.y,14,o.ice?'#bfefff':'#a99bbf',220,.7);SFX.pop();
 if(o.r>34){for(let k=0;k<2;k++){const n=mkAst(o.x+rnd(-10,10),o.y+rnd(-10,10),o.r*.55,o.ice);n.vx=rnd(-90,90);n.vy=rnd(-90,90);G.ast.push(n)}}
 if(Math.random()<(o.r>34?.5:.3))mkCrys(o.x,o.y,Math.random()<.85?0:1)}
function killDog(o){const i=G.dogs.indexOf(o);if(i>=0)G.dogs.splice(i,1);G.kills++;SFX.boom();CAM.shake=8;part(o.x,o.y,30,'#ffc93c',300,.8);part(o.x,o.y,14,'#a5713f',200,.8);popTxt(o.x,o.y-30,'Гав… 💫','#ffe9a0');mkCrys(o.x+10,o.y,1);mkCrys(o.x-10,o.y,0)}

function update(dt){
 const s=G.ship;G.t+=dt;
 // направление
 let ix=0,iy=0;
 if(K.a||K.arrowleft||K['ф'])ix-=1;if(K.d||K.arrowright||K['в'])ix+=1;if(K.w||K.arrowup||K['ц'])iy-=1;if(K.s||K.arrowdown||K['ы'])iy+=1;
 if(PTR.on){const dx=PTR.x-PTR.ox,dy=PTR.y-PTR.oy,d=Math.hypot(dx,dy);if(d>8){ix=dx/70;iy=dy/70}}
 else if(PTR.mouse){const sx=W/2+(s.x-CAM.x)*SC,sy=H/2+(s.y-CAM.y)*SC,dx=PTR.mx-sx,dy=PTR.my-sy,d=Math.hypot(dx,dy);if(d>24){const m=clamp((d-24)/140,0,1);ix=dx/d*m;iy=dy/d*m}}
 let len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len;len=1}
 const fuelOk=s.fuel>0,boost=(K[' ']||K.shift||BOOST)&&fuelOk&&len>.1;
 const eng=S.up.engine,maxV=(270+eng*35)*(boost?1.6:1)*(s.slow>0?.55:1),acc=(600+eng*70)*(boost?1.4:1);
 if(fuelOk&&len>.05){s.vx+=ix*acc*dt;s.vy+=iy*acc*dt;s.thr=len*(boost?1.5:1)}else s.thr=0;
 const damp=Math.pow(s.thr>0?.6:.42,dt);s.vx*=damp;s.vy*=damp;
 let sp=Math.hypot(s.vx,s.vy);if(sp>maxV){s.vx*=maxV/sp;s.vy*=maxV/sp;sp=maxV}
 const drain=(s.thr>0?(boost?17:6):.8)*G.diff*(G.mode==='camp'?1+G.g*.07:1+(G.lvl-1)*.06);
 s.fuel=Math.max(0,s.fuel-drain*dt);
 if(s.fuel<=0){s.zero+=dt;if(s.zero>4.5)return finish(false,'Топливо кончилось')}else s.zero=0;
 if(s.fuel<s.fmax*.22&&s.fuel>0){s.lowT-=dt;if(s.lowT<=0){s.lowT=1.2;SFX.low()}}
 s.x+=s.vx*dt;s.y+=s.vy*dt;G.dist+=sp*dt;
 if(sp>25)s.a=angLerp(s.a,Math.atan2(s.vy,s.vx),1-Math.pow(.002,dt));
 if(G.mode==='camp'){const d=Math.hypot(s.x,s.y);if(d>G.R){const nx=s.x/d,ny=s.y/d,out=d-G.R;s.vx-=nx*(500+out*8)*dt;s.vy-=ny*(500+out*8)*dt;if(d>G.R+140){s.x=nx*(G.R+140);s.y=ny*(G.R+140)}if(G.hintT<=0){G.hintT=6;showHint('Дальше — открытый космос. Возвращайся!')}}}
 G.hintT-=dt;s.inv=Math.max(0,s.inv-dt);s.slow=Math.max(0,s.slow-dt);
 if(s.thr>0&&Math.random()<.6){const b=s.a+Math.PI+rnd(-.3,.3);G.parts.push({x:s.x+Math.cos(s.a+Math.PI)*26,y:s.y+Math.sin(s.a+Math.PI)*26,vx:Math.cos(b)*120+s.vx*.3,vy:Math.sin(b)*120+s.vy*.3,life:.35,max:.35,c:boost?'#ff7eb6':'#ffb36b',s:rnd(2,5)})}
 // кристаллы
 const mag=70+S.up.magnet*40;
 for(let i=G.crys.length-1;i>=0;i--){const c=G.crys[i],dx=s.x-c.x,dy=s.y-c.y,d=Math.hypot(dx,dy);
  if(d<mag+28){const pull=(1-d/(mag+28))*900+150;c.x+=dx/d*Math.min(d,pull*dt);c.y+=dy/d*Math.min(d,pull*dt)}
  if(d<28+CT[c.t].r){G.crys.splice(i,1);collect(c)}}
 // ремкомплекты
 if(G.mode==='endless'||G.boss){G.kitT-=dt;if(G.kitT<=0){G.kitT=G.boss?11:28;if(G.kits.length<2){const a=Math.random()*TAU,d=rnd(260,480);let x=s.x+Math.cos(a)*d,y=s.y+Math.sin(a)*d;if(G.mode==='camp'){const r=Math.hypot(x,y);if(r>G.R-80){x*=(G.R-80)/r;y*=(G.R-80)/r}}G.kits.push({x,y,ph:0})}}}
 for(let i=G.kits.length-1;i>=0;i--){const k=G.kits[i];k.ph+=dt;if(Math.hypot(k.x-s.x,k.y-s.y)<40){G.kits.splice(i,1);if(s.hp<s.hpMax){s.hp++;popTxt(k.x,k.y-20,'+1 ❤️','#ff7eb6')}else{s.fuel=Math.min(s.fmax,s.fuel+30);popTxt(k.x,k.y-20,'+⛽','#3fd8ad')}tone(523,.12,'triangle',.06,1046);part(k.x,k.y,14,'#ff7eb6',160,.5)}else if(G.mode==='endless'&&Math.hypot(k.x-s.x,k.y-s.y)>2300)G.kits.splice(i,1)}
 // врата
 if(G.gate){G.gate.t+=dt;if(G.gate.open&&Math.hypot(s.x-G.gate.x,s.y-G.gate.y)<64)return finish(true)}
 // астероиды
 for(const o of G.ast){o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=o.va*dt;o.hit=Math.max(0,o.hit-dt);
  if(G.mode==='camp'){const d=Math.hypot(o.x,o.y);if(d>G.R+100){o.vx-=o.x/d*20*dt;o.vy-=o.y/d*20*dt}}
  const dx=s.x-o.x,dy=s.y-o.y,d=Math.hypot(dx,dy);
  if(d<o.r+20){const nx=dx/(d||1),ny=dy/(d||1);s.x=o.x+nx*(o.r+21);s.y=o.y+ny*(o.r+21);const vn=s.vx*nx+s.vy*ny;if(vn<0){s.vx-=vn*1.6*nx;s.vy-=vn*1.6*ny}o.vx-=nx*40;o.vy-=ny*40;
   if(s.inv<=0){if(o.ice){s.slow=2.5;toast('🧊 Корабль подморозило!')}hit(1,o)}}}
 // лазер
 s.fire-=dt;if(s.fire<=0){let best=null,bd=1e9;const R2=560;
  const tst=(o,pri)=>{const d=Math.hypot(o.x-s.x,o.y-s.y)-(o.r||0);if(d<R2*pri&&d/pri<bd){bd=d/pri;best=o}};
  if(G.boss&&G.boss.hp>0)tst(G.boss,1.4);for(const o of G.dogs)tst(o,1.3);for(const o of G.ast)tst(o,.62);for(const o of G.comets)tst(o,.8);
  if(best){shoot(best.x+(best.vx||0)*.15,best.y+(best.vy||0)*.15);s.fire=laserRate(S.up.laser)}else s.fire=.1}
 for(let i=G.shots.length-1;i>=0;i--){const b=G.shots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let done=b.life<=0;
  if(!done)for(const o of G.ast)if(Math.hypot(o.x-b.x,o.y-b.y)<o.r){damageAst(o,b.dmg);done=true;break}
  if(!done)for(const o of G.dogs)if(Math.hypot(o.x-b.x,o.y-b.y)<o.r){o.hp-=b.dmg;o.hit=.12;part(b.x,b.y,5,'#ffb36b',120,.3);if(o.hp<=0)killDog(o);done=true;break}
  if(!done)for(let k=G.comets.length-1;k>=0;k--){const o=G.comets[k];if(Math.hypot(o.x-b.x,o.y-b.y)<o.r+4){G.comets.splice(k,1);part(o.x,o.y,18,'#bfefff',220,.6);SFX.pop();if(Math.random()<.5)mkCrys(o.x,o.y,0);done=true;break}}
  if(!done&&G.boss&&G.boss.hp>0&&Math.hypot(G.boss.x-b.x,G.boss.y-b.y)<G.boss.r){bossDmg(b.dmg);part(b.x,b.y,6,'#ffb36b',140,.3);done=true}
  if(done)G.shots.splice(i,1)}
 // космопсы
 for(const o of G.dogs){o.hit=Math.max(0,o.hit-dt);o.ph+=dt;const dx=s.x-o.x,dy=s.y-o.y,d=Math.hypot(dx,dy)||1,spd=(140+G.g*14)*(G.mode==='camp'?1:1+G.lvl*.05)*Math.min(1.2,G.diff);
  let tx,ty;if(d<760){const want=d>240?1:-.6;tx=dx/d*want*spd+(-dy/d)*spd*.5;ty=dy/d*want*spd+(dx/d)*spd*.5}else{tx=Math.cos(o.ph*.4)*60;ty=Math.sin(o.ph*.3)*60}
  o.vx=lerp(o.vx,tx,1-Math.pow(.2,dt));o.vy=lerp(o.vy,ty,1-Math.pow(.2,dt));o.x+=o.vx*dt;o.y+=o.vy*dt;
  if(G.mode==='camp'){const r=Math.hypot(o.x,o.y);if(r>G.R){o.x*=G.R/r;o.y*=G.R/r}}
  if(d<640){o.fire-=dt;if(o.fire<=0){o.fire=rnd(2,3.2)-G.g*.15;const a=Math.atan2(dy+s.vy*.3,dx+s.vx*.3);bone(o.x,o.y,a,300+G.g*20)}}
  if(d<o.r+18)hit(1,o)}
 for(let i=G.bones.length-1;i>=0;i--){const b=G.bones[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=dt*9;b.life-=dt;if(Math.hypot(b.x-s.x,b.y-s.y)<20){hit(1,b);G.bones.splice(i,1);continue}if(b.life<=0)G.bones.splice(i,1)}
 // чёрные дыры
 for(const h of G.holes){h.t+=dt;const dx=h.x-s.x,dy=h.y-s.y,d=Math.hypot(dx,dy)||1;if(d<560){const f=Math.min(900,5.5e6/(d*d));s.vx+=dx/d*f*dt;s.vy+=dy/d*f*dt}
  if(d<h.r+12){hit(1,h);s.vx=-dx/d*700;s.vy=-dy/d*700;s.x=h.x-dx/d*(h.r+40);s.y=h.y-dy/d*(h.r+40)}
  for(const c of G.crys){const cx=h.x-c.x,cy=h.y-c.y,cd=Math.hypot(cx,cy);if(cd<300&&cd>h.r+30){c.x+=cx/cd*30*dt;c.y+=cy/cd*30*dt}}}
 // кометы
 if(G.mode==='camp'&&G.sec.G.haz.comet){G.cometT-=dt;if(G.cometT<=0){G.cometT=rnd(4,7);spawnComet()}}
 for(let i=G.comets.length-1;i>=0;i--){const o=G.comets[i];o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;if(Math.random()<.9)G.parts.push({x:o.x,y:o.y,vx:rnd(-30,30),vy:rnd(-30,30),life:.5,max:.5,c:'#bfefff',s:rnd(3,7)});
  if(Math.hypot(o.x-s.x,o.y-s.y)<o.r+18){hit(1,o);G.comets.splice(i,1);continue}if(o.life<=0)G.comets.splice(i,1)}
 // босс
 if(G.boss)bossUpdate(dt);
 if(G.mode==='endless')streamUpdate(dt);
 // частицы
 for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0)G.parts.splice(i,1)}
 for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];p.t+=dt;p.y-=40*dt;if(p.t>1)G.pops.splice(i,1)}
 // камера
 const k=1-Math.pow(.003,dt);CAM.x+=(s.x+s.vx*.35-CAM.x)*k;CAM.y+=(s.y+s.vy*.35-CAM.y)*k;CAM.shake=Math.max(0,CAM.shake-dt*30);
}
function bone(x,y,a,v){G.bones.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:0,life:4})}
function bossUpdate(dt){const b=G.boss,s=G.ship;if(b.hp<=0)return;b.t+=dt;b.hit=Math.max(0,b.hit-dt);const dx=s.x-b.x,dy=s.y-b.y,d=Math.hypot(dx,dy)||1,rage=b.hp<b.max*.5?1.35:1;
 if(b.charge>0){b.charge-=dt;b.x+=b.cx*dt;b.y+=b.cy*dt;if(Math.random()<.8)part(b.x,b.y,1,'#ff9be0',80,.5,6)}
 else{const tx=s.x-dx/d*400,ty=s.y-dy/d*400;b.vx=lerp(b.vx,(tx-b.x)*.9,1-Math.pow(.3,dt));b.vy=lerp(b.vy,(ty-b.y)*.9,1-Math.pow(.3,dt));const v=Math.hypot(b.vx,b.vy),mv=(120+b.g*20)*rage;if(v>mv){b.vx*=mv/v;b.vy*=mv/v}b.x+=b.vx*dt;b.y+=b.vy*dt}
 const r=Math.hypot(b.x,b.y);if(r>G.R-b.r){b.x*=(G.R-b.r)/r;b.y*=(G.R-b.r)/r;b.charge=0}

 if(i===0&&firstRun)showHint(document.body.classList.contains('touch')?'Веди пальцем по экрану — корабль полетит туда. 🚀 — форсаж':'Лети: WASD / стрелки или зажми мышку. Пробел — форсаж. Лазер стреляет сам!');
 else if(!sec.boss)showHint('Собери '+sec.need+' 💎, чтобы открыть врата')}
function startEndless(){if(S.sector<5&&!IS_ADM){toast('🔒 Откроется после первой галактики');return}closeModal();ac();musStart();newGame('endless');beginPlay();$('#hSec').textContent='♾ Бесконечный рейс · рекорд '+fmt(S.best);showHint('Лети как можно дальше! Кристаллы — это топливо')}
function beginPlay(){MODE='play';show(null);$('#hud').classList.add('on');$('#mtop').style.display='none';Object.assign(HUD,{h:'',f:-1,g:'',b:-1,low:null});hudUpdate();S.runs++;save()}
function finish(win,reason){if(G.end)return;G.end=true;G.win=win;MODE='result';$('#hud').classList.remove('on');PTR.on=false;PTR.id=null;BOOST=false;
 const s=G.ship;let h='';
 if(G.mode==='endless'){const sc=score(),rec=sc>S.best;if(rec)S.best=sc;S.crystals+=G.got;S.total+=G.got;save();SFX.fail();part(s.x,s.y,40,'#ff7eb6',300,1);
  h=`<h3>${rec?'🏆 Новый рекорд!':'🛰 Рейс окончен'}</h3><p>${esc(reason)}</p><div class="rw"><span>🏁 ${fmt(sc)} очков</span><span>💎 +${G.got}</span><span>🐶 ${G.kills}</span></div><p class="mut">Рекорд: ${fmt(S.best)} · пролетел ${fmt(G.dist/100)} км</p><div class="mbtn"><button class="btn big mint" data-a="endless">↻ Ещё рейс</button><button class="btn white" data-a="tomenu">🏠 В меню</button></div>`}
 else if(win){const i=G.sec.i,st=s.hp>=s.hpMax?3:s.hp>=Math.ceil(s.hpMax/2)?2:1,old=S.stars[i]|0,bonus=st*5+(G.sec.boss?60:0)+(st>old?(st-old)*5:0),gain=G.got+bonus;
  S.stars[i]=Math.max(old,st);S.crystals+=gain;S.total+=G.got;const first=i>=S.sector;if(first)S.sector=Math.min(NSEC,i+1);
  const last=i===NSEC-1;if(last&&!S.won){S.won=true;if(!S.ships.includes('gold'))S.ships.push('gold')}save();SFX.win();
  if(last){ending();return}
  const next=i+1,ng=Math.floor(next/5)!==G.sec.g;
  h=`<h3>${G.sec.boss?'🏆 Босс побеждён!':'✨ Сектор пройден!'}</h3><div class="big3">${[1,2,3].map(k=>`<span class="${k>st?'off':''}">⭐</span>`).join('')}</div><div class="rw"><span>💎 +${G.got}</span><span>🎁 бонус +${bonus}</span></div>
  ${ng&&first?`<p>Открыта новая галактика: <b>${GAL[Math.floor(next/5)].ic} ${GAL[Math.floor(next/5)].n}</b>!</p>`:''}${first&&next===5?'<p>♾ Открыт <b>Бесконечный рейс</b>!</p>':''}
  <p class="mut">До Котозаяции осталось секторов: ${NSEC-S.sector}</p><div class="mbtn"><button class="btn big mint" data-a="next">▶ Дальше</button><div class="mrow2"><button class="btn" data-a="hangar">🔧 Ангар</button><button class="btn white" data-a="map">🗺 Карта</button></div></div>`}
 else{const keep=Math.floor(G.got/2);S.crystals+=keep;S.total+=keep;save();SFX.fail();part(s.x,s.y,40,'#ff7eb6',300,1);
  h=`<h3>💥 Не получилось</h3><p>${esc(reason)}${reason==='Топливо кончилось'?' — собирай больше кристаллов по пути':''}</p><div class="rw"><span>💎 сохранено +${keep}</span></div><p class="mut">Подсказка: прокачай ${reason==='Топливо кончилось'?'⛽ бак или 🧲 магнит':'🛡 щит или 🥕 лазер'} в ангаре</p><div class="mbtn"><button class="btn big mint" data-a="retry">↻ Ещё раз</button><div class="mrow2"><button class="btn" data-a="hangar">🔧 Ангар</button><button class="btn white" data-a="map">🗺 Карта</button></div></div>`}
 setTimeout(()=>modal(h),win?500:900)}
function ending(){modal(`<h3>🏠 Ты дома!</h3><p>Котозайц долетел до родной планеты <b>Котозаяции</b>. Все котозайцы встречают героя!</p><div class="big3">🐰🎉🐰</div><div class="rw"><span>🚀 Золотой корабль</span><span>♾ Бесконечный рейс</span></div><p class="mut">Можно перепроходить сектора на 3 звезды и ставить рекорды.</p><div class="mbtn"><button class="btn big mint" data-a="ships">🚀 Забрать корабль</button><button class="btn white" data-a="tomenu">🏠 В меню</button></div>`);
 if(G)for(let i=0;i<120;i++)part(G.ship.x+rnd(-300,300),G.ship.y+rnd(-200,200),1,pick(['#ffc93c','#ff6fa8','#3fd8ad','#5ab8ff']),200,2,5)}
function pause(){if(MODE!=='play')return;MODE='pause';PTR.on=false;PTR.id=null;BOOST=false;
 modal(`<h3>⏸ Пауза</h3><p>${G.mode==='camp'?esc(GAL[G.sec.g].ic+' '+G.sec.name):'♾ Бесконечный рейс · '+fmt(score())+' очков'}</p><div class="opts" style="text-align:left">${swRow('snd','🔊 Звуки')}${swRow('mus','🎵 Музыка')}</div><div class="mbtn"><button class="btn big mint" data-a="resume">▶ Продолжить</button><div class="mrow2"><button class="btn" data-a="restart">↻ Заново</button><button class="btn white" data-a="quit">🚪 Выйти</button></div></div>`)}
function resume(){if(MODE!=='pause')return;closeModal();MODE='play'}

/* ---------- экраны ---------- */
function show(id){SCREEN=id||'';$$('.scr').forEach(e=>e.classList.toggle('on',e.id===id));$('#mtop').style.display=id==='menu'?'':'none';if(id)$('#hud').classList.remove('on');
 if(id==='menu')renderMenu();if(id==='map')renderMap();if(id==='hangar')renderHangar();if(id==='ships')renderShips();if(id==='settings')renderSettings();$$('.hb').forEach(e=>e.textContent='💎 '+fmt(S.crystals))}
function toMenu(){closeModal();MODE='menu';G=null;$('#hud').classList.remove('on');setScene(Math.min(4,Math.floor(Math.min(S.sector,NSEC-1)/5)));show('menu')}
function renderMenu(){$('#mBank').textContent='💎 '+fmt(S.crystals);$('#mNick').textContent='🐰 '+NICK;const i=Math.min(S.sector,NSEC-1),sec=secInfo(i);
 $('#bPlay').innerHTML=S.won?'▶ Играть':S.sector===0?'▶ Начать полёт':'▶ Продолжить · '+sec.G.ic+' '+(sec.boss?'Босс':'сектор '+(i+1));
 $('#bEnd').innerHTML=S.sector>=5||IS_ADM?'♾ Бесконечный рейс'+(S.best?' · 🏆 '+fmt(S.best):''):'🔒 Бесконечный рейс';
 $('#mSub').textContent=S.won?'Котозайц дома! Перепроходи сектора на 3 звезды и ставь рекорды в бесконечном рейсе.':S.sector?'До родной планеты Котозаяции осталось секторов: '+(NSEC-S.sector)+'. Кристаллы — твоё топливо!':'Корабль котозайца сбился с курса. Собирай кристаллы-топливо и долети до родной планеты!';
 $('#bExit').style.display=EMB||A?'':'none'}
function renderMap(){$('#mapProg').textContent='⭐ '+starSum()+' / '+NSEC*3;
 $('#mapBox').innerHTML=GAL.map((g,gi)=>{const open=S.sector>=gi*5;return`<div class="panel gal"><div class="galh"><i style="background:${g.col}">${open?g.ic:'🔒'}</i><div><b>${esc(g.n)}</b><small>${open?'Босс: '+esc(g.boss):'Пройди предыдущую галактику'}</small></div></div><div class="nodes">${[0,1,2,3,4].map(k=>{const i=gi*5+k,lock=i>S.sector,st=S.stars[i]|0,cur=i===S.sector;return`<button class="node${k===4?' boss':''}${lock?' lock':''}${cur?' cur':''}" ${lock?'':`data-sec="${i}"`}>${lock?'🔒':k===4?'🐶':i+1}<small>${lock?'':'★'.repeat(st)+'☆'.repeat(3-st)}</small></button>`}).join('')}</div></div>`}).join('')+
 `<div class="panel home"><div style="font-size:46px">${S.won?'🏠':'🪐'}</div><div><b style="font-size:18px">Котозаяция</b><div class="mut">${S.won?'Ты долетел домой! 🎉':'Родная планета котозайцев. Осталось секторов: '+(NSEC-S.sector)}</div></div></div>`}
function renderHangar(){$('#upBox').innerHTML=UPS.map(u=>{const l=S.up[u.id],max=l>=5,c=max?0:UPCOST[l];return`<div class="panel up"><div class="ic">${u.ic}</div><div class="tx"><b>${u.n}</b><small>${esc(u.d(l))}${max?'':' → '+esc(u.d(l+1))}</small><div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<l?'on':''}"></i>`).join('')}</div></div>${max?'<span class="pill">МАКС</span>':`<button class="btn ${S.crystals>=c?'mint':'white'}" data-up="${u.id}">💎 ${c}</button>`}</div>`}).join('')+`<p class="mut" style="text-align:center;color:#e6e0ff">Кристаллы дают за пройденные сектора, звёзды и рейсы</p>`}
function renderShips(){$('#shipBox').innerHTML=SHIPS.map(s=>{const own=S.ships.includes(s.id),sel=S.ship===s.id;return`<div class="panel shc${sel?' sel':''}"><canvas data-prev="${s.id}" width="320" height="220"></canvas><b>${esc(s.n)}</b><small>${esc(s.d)}</small>${sel?'<span class="pill">✓ Выбран</span>':own?`<button class="btn sm mint" data-ship="${s.id}">Выбрать</button>`:s.price<0?'<span class="pill">🔒 Награда</span>':`<button class="btn sm ${S.crystals>=s.price?'':'white'}" data-buy="${s.id}">💎 ${s.price}</button>`}</div>`}).join('');
 $$('[data-prev]').forEach(cn=>{const c=cn.getContext('2d'),sh=SHIPS.find(x=>x.id===cn.dataset.prev);c.setTransform(2,0,0,2,0,0);drawShip(c,sh,80,62,-.15,1.6,.6,1,false)})}
function swRow(k,n,d){return`<div class="opt"><div class="tx">${n}${d?`<small>${d}</small>`:''}</div><div class="sw${S.set[k]?' on':''}" data-set="${k}"></div></div>`}
function renderSettings(){$('#setBox').innerHTML=swRow('snd','🔊 Звуки')+swRow('mus','🎵 Музыка','Тихая космическая мелодия')+swRow('hints','💡 Подсказки')+
 `<div class="opt"><div class="tx">🎯 Сложность<small>Расход топлива, сила врагов и боссов</small></div><div class="seg">${['Лёгкая','Обычная','Сложная'].map((n,i)=>`<button data-diff="${i}" class="${S.set.diff===i?'on':''}">${n}</button>`).join('')}</div></div>`+
 `<div class="opt"><div class="tx">🎮 Управление<small>ПК: WASD или стрелки, или зажми левую кнопку мыши. Пробел/Shift — форсаж. Esc — пауза.<br>Телефон: веди пальцем, кнопка 🚀 — форсаж. Лазер стреляет сам.</small></div></div>`+
 `<div class="opt"><div class="tx">👤 Аккаунт<small>${ACC?'@'+esc(ACC)+' · '+esc(NICK)+' — прогресс сохраняется для этого аккаунта':'Гость — войди в лаунчере, чтобы прогресс был в аккаунте'}</small></div></div>`+
 `<div class="opt"><div class="tx">🗑 Сбросить прогресс<small>Начать полёт заново</small></div><button class="btn sm red" data-a="reset">Сбросить</button></div>`;
 $('#admBox').innerHTML=IS_ADM?`<div class="panel opts" style="margin-top:14px"><div class="opt"><div class="tx"><b>🛠 ADM</b><small>Только для @${esc(ACC)}</small></div></div><div class="opt" style="flex-wrap:wrap;gap:8px"><button class="btn sm" data-adm="c">💎 +1000</button><button class="btn sm" data-adm="s">🗺 Открыть все сектора</button><button class="btn sm" data-adm="u">🔧 Всё на максимум</button><button class="btn sm" data-adm="sh">🚀 Все корабли</button></div></div>`:''}

/* ---------- окна ---------- */
function modal(h){$('#toast').classList.remove('on');$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
let toastTO=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTO);toastTO=setTimeout(()=>e.classList.remove('on'),2600)}
function exitToLauncher(){save();try{if(window.parent!==window){parent.postMessage({space:'exit'},'*');return}}catch(e){}
 if(A){try{location.href=A.fileUrl?A.fileUrl('launcher.html'):'launcher.html'}catch(e){location.href='launcher.html'}return}try{window.close()}catch(e){}}
window.kzBack=()=>{if(MODE==='play'){pause();return}if(MODE==='pause'){resume();return}if($('#modal').classList.contains('on')){if(MODE==='result'){toMenu();return}closeModal();return}if(SCREEN&&SCREEN!=='menu'){show('menu');return}exitToLauncher()};

function doAct(a,el){SFX.click();
 if(a==='play'){if(!S.intro){S.intro=true;save();modal(`<h3>🚀 Котозайцы в космосе</h3><p>Корабль котозайца сбился с курса и залетел на край галактики. Топлива почти нет!</p><div class="rw"><span>💎 кристаллы = топливо</span><span>🌀 врата = прыжок</span></div><p>Собирай кристаллы, открывай врата и прыгай от сектора к сектору. Остерегайся астероидов, космопсов и чёрных дыр. Впереди — 5 галактик и родная планета <b>Котозаяция</b>.</p><div class="mbtn"><button class="btn big mint" data-a="play">Полетели! 🚀</button></div>`);return}
  startSector(S.won?Math.min(S.sector,NSEC-1):S.sector);return}
 if(a==='map'||a==='hangar'||a==='ships'||a==='settings'){if(MODE==='result'){closeModal();MODE='menu';G=null}else closeModal();show(a);return}
 if(a==='back'){show('menu');return}
 if(a==='endless'){startEndless();return}
 if(a==='exit'){exitToLauncher();return}
 if(a==='pause'){pause();return}if(a==='resume'){resume();return}
 if(a==='restart'){const g=G;if(g.mode==='camp')startSector(g.sec.i);else startEndless();return}
 if(a==='quit'){toMenu();return}if(a==='tomenu'){toMenu();return}
 if(a==='retry'){startSector(G.sec.i);return}
 if(a==='next'){const n=G.sec.i+1;if(n<NSEC)startSector(n);else toMenu();return}
 if(a==='reset'){if(!confirm('Сбросить весь прогресс «Котозайцев в космосе»? Кристаллы, корабли и сектора пропадут.'))return;const set=S.set;S=defSave();S.set=set;save();toast('Прогресс сброшен');renderSettings();return}}
document.addEventListener('click',e=>{const t=e.target;ac();if(S.set.mus)musStart();
 const b=t.closest('[data-a]');if(b){doAct(b.dataset.a,b);return}
 const sc=t.closest('[data-sec]');if(sc){startSector(+sc.dataset.sec);return}
 const up=t.closest('[data-up]');if(up){const id=up.dataset.up,l=S.up[id],c=UPCOST[l];if(l>=5)return;if(S.crystals<c){toast('Не хватает 💎 — нужно '+c);SFX.low();return}S.crystals-=c;S.up[id]++;save();SFX.buy();toast('✨ '+UPS.find(u=>u.id===id).n+': уровень '+S.up[id]);show('hangar');return}
 const by=t.closest('[data-buy]');if(by){const sh=SHIPS.find(x=>x.id===by.dataset.buy);if(S.crystals<sh.price){toast('Не хватает 💎 — нужно '+sh.price);SFX.low();return}S.crystals-=sh.price;S.ships.push(sh.id);S.ship=sh.id;save();SFX.buy();toast('🚀 '+sh.n+' теперь твой!');show('ships');return}
 const se=t.closest('[data-ship]');if(se){S.ship=se.dataset.ship;save();show('ships');return}
 const sw=t.closest('[data-set]');if(sw){const k=sw.dataset.set;S.set[k]=S.set[k]?0:1;save();sw.classList.toggle('on',!!S.set[k]);if(k==='mus'&&S.set.mus)musStart();return}
 const df=t.closest('[data-diff]');if(df){S.set.diff=+df.dataset.diff;save();renderSettings();return}
 const ad=t.closest('[data-adm]');if(ad&&IS_ADM){const k=ad.dataset.adm;if(k==='c')S.crystals+=1000;if(k==='s')S.sector=NSEC-1;if(k==='u')for(const u of UPS)S.up[u.id]=5;if(k==='sh')S.ships=SHIPS.map(x=>x.id);save();toast('🛠 Готово');show('settings')}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&MODE==='menu')closeModal()});

/* ---------- цикл ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;const t=now/1000;
 if(MODE==='play'&&G){update(dt);hudUpdate()}else if(MODE==='result'&&G){for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)G.parts.splice(i,1)}}
 render(t);requestAnimationFrame(frame)}
if(location.hash==='#cover')document.body.classList.add('cover');
setScene(Math.min(4,Math.floor(Math.min(S.sector,NSEC-1)/5)));save();show('menu');requestAnimationFrame(frame);
window.__space={get S(){return S},get G(){return G},startSector,startEndless,finish:(w)=>G&&finish(w,'тест')};
</script>
</body>
</html>
