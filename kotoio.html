<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>koto.io</title>
<style>
:root{--tx:#fff;--mut:#cfc7ef;--mint:#4ff0c8;--yel:#ffd34d;--pink:#ff6fb5;--vio:#8b6cff;--red:#ff5e7a;--glass:rgba(14,10,34,.55);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#9ec7e8;font:700 15px/1.4 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:800 13px "Segoe UI",system-ui,sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9);will-change:transform}
.lb i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.lb.me{font-size:14px}
.pop{position:fixed;pointer-events:none;font:900 22px "Segoe UI",system-ui,sans-serif;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);animation:pop 1.3s ease-out forwards;z-index:5}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.hud{position:fixed;pointer-events:none;z-index:3;transition:opacity .3s}
.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#hTop{left:16px;top:14px;padding:10px 16px;display:flex;gap:18px;align-items:center}
#hTop .big{font:900 30px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:-.5px}
#hTop small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
#hBoard{right:16px;top:14px;padding:10px 14px;min-width:210px}
#hBoard b{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0}.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .c{width:10px;height:10px;border-radius:3px;flex:none}.row.me{color:var(--yel)}
#hMini{right:16px;bottom:16px;padding:6px;border-radius:16px}
#mini{display:block;width:168px;height:168px;border-radius:11px;image-rendering:auto}
#hFeed{left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#hFeed div{padding:6px 14px;border-radius:999px;font-size:13px;animation:fin .3s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(-8px)}}
#hHint{left:16px;bottom:16px;padding:8px 14px;font-size:12px;color:var(--mut)}
#hBtn{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;display:none}
.scr{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,6,30,.35),rgba(10,6,30,.7))}
.scr.on{display:flex}
.card{width:min(460px,92vw);padding:26px 28px;border-radius:28px;background:rgba(18,12,42,.78);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:cin .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes cin{from{transform:translateY(24px) scale(.94);opacity:0}}
.logo{font:900 64px/.9 "Segoe UI",system-ui,sans-serif;letter-spacing:-2px;text-align:center;background:linear-gradient(135deg,#ffd34d,#ff6fb5 45%,#8b6cff 75%,#4ff0c8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(255,111,181,.35))}
.logo span{font-size:.55em;letter-spacing:0}
.sub{text-align:center;color:var(--mut);margin:8px 0 16px;font-weight:700}
label.f{display:block;margin:12px 0 6px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
input.inp,select{width:100%;font:800 16px "Segoe UI",system-ui,sans-serif;background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
select option{color:#1d1640}input.inp:focus,select:focus{border-color:var(--mint)}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw i{width:30px;height:30px;border-radius:10px;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2);transition:transform .15s}.sw i:hover{transform:scale(1.12)}.sw i.on{box-shadow:0 0 0 3px #fff,0 0 14px rgba(255,255,255,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:900 18px "Segoe UI",system-ui,sans-serif;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;background:linear-gradient(135deg,var(--mint),#5ab8ff);color:#06261f;box-shadow:0 8px 24px rgba(79,240,200,.35);transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.09);color:#fff;border:1px solid var(--line);box-shadow:none;font-size:15px;padding:11px 18px}
.btn.wide{width:100%;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stats div{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center}.stats small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.stats b{font-size:20px}
.btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
h2{margin:0;text-align:center;font-size:30px;letter-spacing:-.5px}
.why{text-align:center;color:var(--mut);margin:6px 0 4px}
.me{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.me b{display:block;font-size:18px}.me small{color:var(--mut)}.me .chip{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two .btn{width:100%}
.card.big{width:min(680px,94vw)}.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.sk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);cursor:pointer;transition:transform .15s,background .15s;font-size:12px;text-align:center}
.sk:hover{transform:translateY(-3px);background:rgba(255,255,255,.12)}.sk.on{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint),0 0 18px rgba(79,240,200,.35);background:rgba(79,240,200,.12)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#140e30;z-index:20;font-size:18px}
@media(max-width:700px){#hBoard{display:none}#mini{width:120px;height:120px}.logo{font-size:52px}#hHint{display:none}}
</style></head><body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div class="hud panel" id="hTop" style="opacity:0"><div><small>Территория</small><div class="big" id="hPct">0%</div></div><div><small>Поймано</small><div class="big" id="hKills">0</div></div><div><small>Место</small><div class="big" id="hRank">—</div></div></div>
<div class="hud panel" id="hBoard" style="opacity:0"><b>🏆 Лидеры</b><div id="board"></div></div>
<div class="hud panel" id="hMini" style="opacity:0"><canvas id="mini" width="240" height="240"></canvas></div>
<div class="hud" id="hFeed"></div>
<div class="hud panel" id="hHint" style="opacity:0">🖱 Веди мышкой · WASD / стрелки · Esc — пауза</div>
<div class="scr on" id="sMenu"><div class="card">
 <div class="logo">koto<span>.io</span></div>
 <div class="sub">Захватывай поле — не дай наступить на свой хвост!</div>
 <div class="me" id="mWho"></div>
 <button class="btn wide" id="bPlay">▶ Играть</button>
 <div class="two"><button class="btn ghost" id="bSkins">🎨 Скины</button><button class="btn ghost" id="bSet">⚙ Настройки</button></div>
 <div class="stats" id="mStats"></div>
 <div class="btns" id="mBack"></div>
</div></div>
<div class="scr" id="sSet"><div class="card">
 <h2>⚙ Настройки</h2>
 <label class="f">Никнейм</label><input class="inp" id="iNick" maxlength="16" placeholder="Котозаяц">
 <label class="f">Цвет территории</label><div class="sw" id="iCol"></div>
 <label class="f">Графика</label><select id="iQ"><option value="2">Ультра (тени, сглаживание)</option><option value="1">Высокая</option><option value="0">Быстрая (для слабых ПК)</option></select>
 <label class="f">Камера</label><select id="iCam"><option value="0.8">Ближе</option><option value="1">Обычно</option><option value="1.3">Дальше</option></select>
 <label class="f">Звуки</label><select id="iSnd"><option value="1">🔊 Включены</option><option value="0">🔇 Выключены</option></select>
 <label class="f">Имена над игроками</label><select id="iNames"><option value="1">Показывать</option><option value="0">Скрыть</option></select>
 <button class="btn wide" id="bSetOk">✓ Готово</button>
</div></div>
<div class="scr" id="sSkin"><div class="card big">
 <h2>🎨 Скины</h2><div class="sub">Выбери своего котозайца</div>
 <div class="skins" id="skGrid"></div>
 <button class="btn wide" id="bSkinOk">✓ Готово</button>
</div></div>
<div class="scr" id="sOver"><div class="card">
 <h2 id="oT">Игра окончена</h2><div class="why" id="oWhy"></div>
 <div class="stats" id="oStats"></div>
 <div class="btns"><button class="btn" id="bAgain">↻ Ещё раз</button><button class="btn ghost" id="bMenu">≡ В меню</button></div>
</div></div>
<div class="scr" id="sPause"><div class="card" style="text-align:center">
 <h2>Пауза</h2><div class="why">Боты тоже ждут 😺</div>
 <div class="btns"><button class="btn" id="bRes">▶ Продолжить</button><button class="btn ghost" id="bQuit">Выйти в меню</button></div>
</div></div>
<div id="err"></div>
<script>
'use strict';
/* ===================== настройки и данные ===================== */
const CFG=Object.assign({nick:'',skin:null,embedded:false},window.KOTO||{});
const G=120,GG=G*G;               // поле G×G клеток
const WIN_PCT=50;                 // победа при 50% поля
const COLS=['#4ff0c8','#ff5e7a','#5ab8ff','#ffd34d','#8b6cff','#ff9f43','#2ecc71','#ff6fb5','#00cec9','#e17055','#a3e635','#c084fc'];
const FURS=[['#a4a9b4','#ece8e2','#f3b7c8'],['#727786','#cdc9d4','#e9a3b8'],['#efe4d1','#fffaf0','#f6b9c6'],['#f0a35a','#ffe2bf','#ffb3a1'],['#8a5a3c','#dcb48e','#f0a3a3'],['#3e3858','#7a73a0','#b48cff'],['#d9c08f','#f6ecd6','#f3b0a0'],['#6b4a36','#c9a786','#e89c9c'],['#e6e3ff','#ffffff','#d6c9ff'],['#ffc2a1','#fff0e6','#ff9e9e']];
const SKS={"grey": ["Серый", "#a4a9b4", "#ece8e2", "#f3b7c8"], "smoke": ["Дымчатый", "#727786", "#cdc9d4", "#e9a3b8"], "milk": ["Молочный", "#efe4d1", "#fffaf0", "#f6b9c6"], "ginger": ["Рыжий", "#f0a35a", "#ffe2bf", "#ffb3a1"], "choco": ["Шоколадный", "#8a5a3c", "#dcb48e", "#f0a3a3"], "sky": ["Облачный", "#9fc8ff", "#eef5ff", "#ffb6d0"], "mint": ["Мятный", "#7fdcc0", "#e3fff5", "#ffb3c8"], "pinky": ["Розовый", "#ff9cc8", "#ffe6f1", "#ff6fa8"], "night": ["Ночной", "#3e3858", "#7a73a0", "#b48cff"], "ice": ["Ледяной", "#bfefff", "#ffffff", "#9fd8ff"], "cosmic": ["Космический", "#6a55d8", "#b9a9ff", "#ff9be0"], "ghost": ["Призрачный", "#e6e3ff", "#ffffff", "#d6c9ff"], "lavender": ["Лавандовый", "#c7a8ff", "#f3ecff", "#ff9cc8"], "lemon": ["Лимонный", "#ffe680", "#fffbe0", "#ffb36b"], "cherry": ["Вишнёвый", "#e8556e", "#ffd6dc", "#ffb3c0"], "neon": ["Неоновый", "#39e89f", "#d8fff0", "#ff7eb6"], "golden": ["Звёздный", "#f2c94c", "#fff1b8", "#ffb36b"], "pumpkin": ["Тыквенный", "#ff8a3d", "#ffd29c", "#ffcf6b"], "peach": ["Персиковый", "#ffc2a1", "#fff0e6", "#ff9e9e"], "sand": ["Песочный", "#d9c08f", "#f6ecd6", "#f3b0a0"], "coffee": ["Кофейный", "#6b4a36", "#c9a786", "#e89c9c"], "forest": ["Лесной", "#5f9a5a", "#d8f0c8", "#ffb3a1"], "sea": ["Морской", "#3fa7c4", "#dff6ff", "#ffb6d0"], "blueberry": ["Черничный", "#4a4fae", "#c8ccff", "#ff9cc8"], "coral": ["Коралловый", "#ff7a6b", "#ffe0da", "#ffd06b"], "lava": ["Лавовый", "#3a1a1a", "#ff8a3d", "#ffcf33"], "emerald": ["Изумрудный", "#1fb37a", "#c8ffe6", "#ffe066"], "diamond": ["Алмазный", "#d6f4ff", "#ffffff", "#a8e4ff"]};
const NAMES=['Пушок','Морковкин','Ушастик','Барсик','Снежок','Тыковка','Кексик','Мурзик','Плюша','Шустрик','Лапка','Хрум','Пончик','Зефирка','Бублик','Котлетка','Хвостик','Персик','Мармелад','Ватрушка','Тапок','Фунтик','Сухарик','Кнопка'];
const ST_KEY='kz_kotoio';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let SAVE=(()=>{try{return Object.assign({best:0,games:0,kills:0,wins:0,time:0,col:0,q:1,nick:'',skin:'',cam:1,snd:1,names:1},JSON.parse(ls.get(ST_KEY))||{})}catch(e){return{best:0,games:0,kills:0,wins:0,time:0,col:0,q:1,nick:''}}})();
function saveStats(){ls.set(ST_KEY,JSON.stringify(SAVE))}
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hex=(h)=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];
const lin=(h)=>hex(h).map(v=>Math.pow(v,2.2));
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}

/* ===================== WebGL ===================== */
const cv=$('#gl');
const gl=cv.getContext('webgl2',{antialias:true,powerPreference:'high-performance',alpha:false});
function fatal(t){const e=$('#err');e.style.display='flex';e.innerHTML=t}
if(!gl){fatal('😿 Твоя видеокарта или браузер не поддерживают WebGL 2.<br><small style="opacity:.7">Обнови драйверы видеокарты или браузер Edge/Chrome.</small>');throw new Error('no webgl2')}

const TONE=`vec3 tone(vec3 x){x*=1.05;x=clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);return pow(x,vec3(1./2.2));}`;
const SHADOW=`uniform highp sampler2DShadow uSh;uniform float uShT,uShOn;
float shadowF(vec4 l){if(uShOn<.5)return 1.;vec3 p=l.xyz/l.w*.5+.5;if(p.x<0.||p.x>1.||p.y<0.||p.y>1.||p.z>1.)return 1.;float s=0.;
for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)s+=texture(uSh,vec3(p.xy+vec2(x,y)*uShT,p.z-.0009));return s/9.;}`;
const LIGHT=`uniform vec3 uSun,uSunC,uSkyC,uGndC,uFog,uCam;uniform float uFogD;`;
const VS_LIT=`#version 300 es
layout(location=0)in vec3 aP;layout(location=1)in vec3 aN;layout(location=2)in vec3 aC;
uniform mat4 uM,uVP,uL;uniform mat3 uNM;out vec3 vN,vW,vC;out vec4 vL;
void main(){vec4 w=uM*vec4(aP,1.);vW=w.xyz;vN=uNM*aN;vC=aC;vL=uL*w;gl_Position=uVP*w;}`;
const FS_LIT=`#version 300 es
precision highp float;in vec3 vN,vW,vC;in vec4 vL;${LIGHT}${SHADOW}
uniform vec3 uC;uniform float uSpec,uEm,uA;out vec4 o;${TONE}
void main(){vec3 n=normalize(vN);vec3 base=uC*vC;float d=max(dot(n,uSun),0.);float sh=shadowF(vL);
vec3 v=normalize(uCam-vW),h=normalize(uSun+v);float sp=pow(max(dot(n,h),0.),48.)*uSpec*sh;
vec3 amb=mix(uGndC,uSkyC,n.y*.5+.5);float rim=pow(1.-max(dot(n,v),0.),3.);
vec3 c=base*(amb+uSunC*d*sh)+sp*uSunC+base*uEm+rim*uSkyC*.18;
float f=1.-exp(-pow(length(uCam-vW)*uFogD,2.));c=mix(c,uFog,f);o=vec4(tone(c),uA);}`;
const VS_GROUND=`#version 300 es
layout(location=0)in vec3 aP;uniform mat4 uVP,uL;out vec3 vW;out vec4 vL;
void main(){vW=aP;vL=uL*vec4(aP,1.);gl_Position=uVP*vec4(aP,1.);}`;
const FS_GROUND=`#version 300 es
precision highp float;in vec3 vW;in vec4 vL;${LIGHT}${SHADOW}uniform sampler2D uT;uniform float uG;out vec4 o;${TONE}
float h2(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+1.),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
void main(){vec2 w=vW.xz;vec2 uv=w/uG;float dist=length(uCam-vW);
float g1=fbm(w*.11),g2=fbm(w*.9),g3=vn(w*7.),g4=vn(w*23.);float lod=clamp(dist/90.,0.,1.);
g3=mix(g3,.5,lod);g4=mix(g4,.5,lod*1.5);
vec3 grass=mix(vec3(.022,.07,.012),vec3(.08,.165,.03),g1);grass=mix(grass,vec3(.2,.22,.06),smoothstep(.55,.78,fbm(w*.045+3.))*.55);
grass*=.72+.5*g2;grass*=.8+.35*g3;grass*=.88+.24*g4;
vec3 nn=normalize(vec3((g4-.5)*.5+(g3-.5)*.3,1.,(vn(w*23.+11.)-.5)*.5));
bool inA=uv.x>0.&&uv.x<1.&&uv.y>0.&&uv.y<1.;vec3 col=grass;float spec=.04;
if(inA){vec4 t=texture(uT,uv);float a=smoothstep(.4,.6,t.a);
 if(t.a>.003){vec3 tc=pow(t.rgb/max(t.a,.001),vec3(2.2));
  float stripe=.9+.1*sign(sin((w.x+w.y*.0)*1.5708));
  vec3 lawn=mix(grass*1.6,tc*.5,.78)*(.7+.45*g2)*(.8+.35*g3)*(.72+.5*g4)*stripe;col=mix(col,lawn,a*.92);
  float edge=a*(1.-a)*4.;col=mix(col,tc*.35,edge*.55);spec=mix(spec,.1,a);}
 float bd=min(min(w.x,uG-w.x),min(w.y,uG-w.y));col*=mix(.82,1.,smoothstep(0.,1.6,bd));}
else{float bd=max(max(-w.x,w.x-uG),max(-w.y,w.y-uG));col=mix(col,vec3(.23,.19,.11)*(.7+.5*g3),(1.-smoothstep(0.,1.8,bd))*.85);}
float d=max(dot(nn,uSun),0.);float sh=shadowF(vL);vec3 v=normalize(uCam-vW),hh=normalize(uSun+v);
vec3 c=col*(mix(uGndC,uSkyC,.85)+uSunC*d*sh)+uSunC*pow(max(dot(nn,hh),0.),20.)*spec*sh;
float f=1.-exp(-pow(dist*uFogD,2.));c=mix(c,uFog,f);o=vec4(tone(c),1.);}`;
const VS_SKY=`#version 300 es
out vec2 vU;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vU=p*2.-1.;gl_Position=vec4(vU,.99999,1.);}`;
const FS_SKY=`#version 300 es
precision highp float;in vec2 vU;uniform mat4 uIVP;uniform vec3 uSun,uZen,uHor;out vec4 o;${TONE}
void main(){vec4 a=uIVP*vec4(vU,-1.,1.),b=uIVP*vec4(vU,1.,1.);vec3 d=normalize(b.xyz/b.w-a.xyz/a.w);float y=max(d.y,0.);

function bfsHome(p){// кратчайший путь до своей земли в обход своего хвоста

function render(){const W=cv.width,H=cv.height,asp=W/H;
 // камера
 const tgtX=cam.tx,tgtZ=cam.tz;cam.x+=(tgtX-cam.x)*.12;cam.z+=(tgtZ-cam.z)*.12;
 let ex,ey,ez;if(mode==='menu'){const a=T*.05;ex=G/2+Math.sin(a)*70;ez=G/2+Math.cos(a)*70;ey=52;cam.x=G/2;cam.z=G/2}
 else{const d=cam.dist*cam.zoom*(+SAVE.cam||1);ex=cam.x;ey=d*.92;ez=cam.z+d*.62}
 const sh=cam.shake>0?(Math.random()-.5)*cam.shake:0;
 cam.pos=[ex+sh,ey,ez+sh];persp(PR,(asp<1?62:46)*Math.PI/180,asp,.5,600);look(V,cam.pos,[cam.x+sh,0,cam.z+sh],[0,1,0]);mul(VP,PR,V);inv(IVP,VP);
 // солнце: орто-камера вокруг точки взгляда (с привязкой к текселю)
 const shOn=QUAL>0;const ext=mode==='menu'?80:34*cam.zoom;
 const lc=[cam.x,0,cam.z];look(LV,[lc[0]+SUN[0]*120,SUN[1]*120,lc[2]+SUN[2]*120],lc,[0,1,0]);ortho(LP,-ext,ext,-ext,ext,50,200);mul(LVP,LP,LV);
 LVP[12]=Math.round(LVP[12]/ (2/SH_SIZE))*(2/SH_SIZE);LVP[13]=Math.round(LVP[13]/(2/SH_SIZE))*(2/SH_SIZE);
 // хвосты
 let n=0;const put=(x,y,z,nx,ny,nz,c)=>{if(n>=DYN_MAX)return;dP[n*3]=x;dP[n*3+1]=y;dP[n*3+2]=z;dN[n*3]=nx;dN[n*3+1]=ny;dN[n*3+2]=nz;dC[n*3]=c[0];dC[n*3+1]=c[1];dC[n*3+2]=c[2];n++};
 for(const p of players){if(!p.alive||!p.rib.length)continue;const pts=p.rib.concat([[p.x,p.z]]);const c=p.rgb.map(v=>Math.pow(v,2.2)*.72+.01);const cd=c.map(v=>v*.55);const w=.3,h=.1;
  for(let i=0;i<pts.length-1;i++){const[ax,az]=pts[i],[bx,bz]=pts[i+1];let dx=bx-ax,dz=bz-az,l=Math.hypot(dx,dz)||1;const px=-dz/l*w,pz=dx/l*w;
   // верх
   put(ax+px,h,az+pz,0,1,0,c);put(bx+px,h,bz+pz,0,1,0,c);put(bx-px,h,bz-pz,0,1,0,c);put(ax+px,h,az+pz,0,1,0,c);put(bx-px,h,bz-pz,0,1,0,c);put(ax-px,h,az-pz,0,1,0,c);
   // бока
   for(const sgn of[1,-1]){const sx=px*sgn,sz=pz*sgn,nx=sx/w,nz=sz/w;put(ax+sx,0,az+sz,nx,0,nz,cd);put(bx+sx,0,bz+sz,nx,0,nz,cd);put(bx+sx,h,bz+sz,nx,0,nz,c);put(ax+sx,0,az+sz,nx,0,nz,cd);put(bx+sx,h,bz+sz,nx,0,nz,c);put(ax+sx,h,az+sz,nx,0,nz,c)}}}
 updMesh(TRAILS,dP,dN,dC,n);
 // частицы
 n=0;for(const q of parts){const cube=q.k===3?G_PEB:G_BOX;const k=1-q.t/q.life,s=q.s*(q.k===3?1:Math.min(1,k*2));xform(TM,TN,q.x,q.y,q.z,q.r,q.r*.7,0,s,s,s);const c=q.k===3?q.c.map(v=>v*(.6+.4*k)):q.c;
  for(const i of cube.i){const x=cube.p[i*3],y=cube.p[i*3+1],z=cube.p[i*3+2];const a=cube.n[i*3],b=cube.n[i*3+1],cc=cube.n[i*3+2];put(TM[0]*x+TM[4]*y+TM[8]*z+TM[12],TM[1]*x+TM[5]*y+TM[9]*z+TM[13],TM[2]*x+TM[6]*y+TM[10]*z+TM[14],TN[0]*a+TN[4]*b+TN[8]*cc,TN[1]*a+TN[5]*b+TN[9]*cc,TN[2]*a+TN[6]*b+TN[10]*cc,c)}}
 updMesh(PARTS,dP,dN,dC,n);
 if(terrDirty){gl.bindTexture(gl.TEXTURE_2D,terrTex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,G,G,gl.RGBA,gl.UNSIGNED_BYTE,terrData);terrDirty=false;miniDirty=true}
 gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
 // --- проход теней
 if(shOn){gl.bindFramebuffer(gl.FRAMEBUFFER,shFB);gl.viewport(0,0,SH_SIZE,SH_SIZE);gl.clear(gl.DEPTH_BUFFER_BIT);gl.useProgram(P_DEP.p);gl.uniformMatrix4fv(P_DEP.u.uL,false,LVP);
  gl.uniformMatrix4fv(P_DEP.u.uM,false,ID);drawMesh(STATIC);for(const p of players)if(p.alive)drawChar(p,P_DEP.u,true);gl.bindFramebuffer(gl.FRAMEBUFFER,null)}
 gl.viewport(0,0,W,H);gl.clearColor(FOG[0],FOG[1],FOG[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 // --- небо
 gl.disable(gl.DEPTH_TEST);gl.useProgram(P_SKY.p);gl.uniformMatrix4fv(P_SKY.u.uIVP,false,IVP);gl.uniform3fv(P_SKY.u.uSun,SUN);gl.uniform3fv(P_SKY.u.uZen,ZEN);gl.uniform3fv(P_SKY.u.uHor,HOR);gl.bindVertexArray(skyVAO);gl.drawArrays(gl.TRIANGLES,0,3);gl.enable(gl.DEPTH_TEST);
 // --- земля
 const ug=P_GND.u;gl.useProgram(P_GND.p);setLight(ug,shOn);gl.uniformMatrix4fv(ug.uVP,false,VP);gl.uniform1f(ug.uG,G);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,terrTex);gl.uniform1i(ug.uT,0);drawMesh(GROUND);
 // --- объекты
 const u=P_LIT.u;gl.useProgram(P_LIT.p);setLight(u,shOn);gl.uniformMatrix4fv(u.uVP,false,VP);gl.uniform1f(u.uA,1);
 gl.uniformMatrix4fv(u.uM,false,ID);gl.uniformMatrix3fv(u.uNM,false,nm3(NM3,ID));gl.uniform3fv(u.uC,[1,1,1]);gl.uniform1f(u.uSpec,.05);gl.uniform1f(u.uEm,0);drawMesh(STATIC);
 gl.uniform1f(u.uSpec,.35);gl.uniform1f(u.uEm,.12);drawMesh(TRAILS);gl.uniform1f(u.uSpec,.2);gl.uniform1f(u.uEm,.08);drawMesh(PARTS);
 for(const p of players)if(p.alive)drawChar(p,u,false);
 gl.bindVertexArray(null)}

/* ===================== HUD ===================== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mini=$('#mini'),mctx=mini.getContext('2d'),mimg=document.createElement('canvas');mimg.width=mimg.height=G;const mictx=mimg.getContext('2d'),mid=mictx.createImageData(G,G);let miniDirty=true;
function drawMini(){const W=mini.width;if(miniDirty){mid.data.set(terrData);for(let k=3;k<mid.data.length;k+=4)if(mid.data[k])mid.data[k]=235;mictx.putImageData(mid,0,0);miniDirty=false}
 mctx.clearRect(0,0,W,W);mctx.fillStyle='rgba(40,80,30,.85)';mctx.fillRect(0,0,W,W);mctx.imageSmoothingEnabled=true;mctx.drawImage(mimg,0,0,W,W);const k=W/G;
 for(const p of players){if(!p.alive)continue;if(p.rib.length>1){mctx.strokeStyle=COLS[p.colI];mctx.globalAlpha=.8;mctx.lineWidth=1.5;mctx.beginPath();mctx.moveTo(p.rib[0][0]*k,p.rib[0][1]*k);for(const[x,z]of p.rib)mctx.lineTo(x*k,z*k);mctx.lineTo(p.x*k,p.z*k);mctx.stroke();mctx.globalAlpha=1}
  mctx.fillStyle=p.human?'#fff':COLS[p.colI];mctx.strokeStyle='rgba(0,0,0,.6)';mctx.lineWidth=1;mctx.beginPath();mctx.arc(p.x*k,p.z*k,p.human?4.5:3,0,7);mctx.fill();mctx.stroke()}}
function labels(){const box=$('#labels');for(const p of players){if(!p.lb){p.lb=document.createElement('div');p.lb.className='lb'+(p.human?' me':'');p.lb.innerHTML=`<i style="background:${COLS[p.colI]}"></i>${esc(p.name)}`;box.appendChild(p.lb)}
 const s=p.alive&&proj(p.x,2.05,p.z);if(!s){p.lb.style.display='none';continue}p.lb.style.display='';p.lb.style.transform=`translate(${s[0]-p.lb.offsetWidth/2|0}px,${s[1]-22|0}px)`}}
let hudT=0;
function hud(){if(!me)return;const pct=cnt[me.id]/GG*100;if(me.alive)me.maxPct=Math.max(me.maxPct||0,pct);
 $('#hPct').textContent=(pct<10?pct.toFixed(2):pct.toFixed(1))+'%';$('#hKills').textContent=me.kills;
 const al=players.filter(p=>p.alive).sort((a,b)=>cnt[b.id]-cnt[a.id]);const rk=al.indexOf(me)+1;$('#hRank').textContent=me.alive?rk+'/'+al.length:'—';
 let h='';al.slice(0,6).forEach((p,i)=>{h+=`<div class="row${p===me?' me':''}"><span style="width:16px;color:var(--mut)">${i+1}</span><span class="c" style="background:${COLS[p.colI]}"></span><span class="n">${esc(p.name)}</span><span>${(cnt[p.id]/GG*100).toFixed(1)}%</span></div>`});
 if(rk>6)h+=`<div class="row me"><span style="width:16px">${rk}</span><span class="c" style="background:${COLS[me.colI]}"></span><span class="n">${esc(me.name)}</span><span>${pct.toFixed(1)}%</span></div>`;$('#board').innerHTML=h}
function feed(html){const f=$('#hFeed'),d=document.createElement('div');d.className='panel';d.innerHTML=html;f.prepend(d);while(f.children.length>3)f.lastChild.remove();setTimeout(()=>{d.style.transition='opacity .5s';d.style.opacity=0;setTimeout(()=>d.remove(),500)},3500)}
function popText(t,p){const s=proj(p.x,2.2,p.z);if(!s)return;const d=document.createElement('div');d.className='pop';d.style.left=s[0]+'px';d.style.top=s[1]+'px';d.style.color=COLS[p.colI];d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function showHud(on){for(const id of['hTop','hBoard','hMini','hHint'])$('#'+id).style.opacity=on?1:0;$('#labels').style.display=(on||mode==='menu')&&+SAVE.names?'':'none'}

/* ===================== экраны ===================== */
let selCol=clamp(+SAVE.col||0,0,COLS.length-1);
function skSvg(c,sz){const st='stroke="#0d0a1f" stroke-width="2"';return `<svg viewBox="0 0 64 64" width="${sz||56}" height="${sz||56}"><g ${st}><ellipse cx="32" cy="50" rx="16" ry="11" fill="${c[1]}"/><ellipse cx="13" cy="34" rx="6" ry="14" fill="${c[1]}" transform="rotate(16 13 34)"/><ellipse cx="51" cy="34" rx="6" ry="14" fill="${c[1]}" transform="rotate(-16 51 34)"/><circle cx="32" cy="29" r="16" fill="${c[1]}"/></g><ellipse cx="32" cy="52" rx="9" ry="6" fill="${c[2]}"/><ellipse cx="32" cy="35" rx="8" ry="5.5" fill="${c[2]}"/><ellipse cx="25" cy="27" rx="2.6" ry="3.2" fill="#0d0a1f"/><ellipse cx="39" cy="27" rx="2.6" ry="3.2" fill="#0d0a1f"/><circle cx="24" cy="26" r=".9" fill="#fff"/><circle cx="38" cy="26" r=".9" fill="#fff"/><ellipse cx="32" cy="33" rx="2.4" ry="1.7" fill="${c[3]}"/><ellipse cx="20" cy="34" rx="3" ry="1.8" fill="${c[3]}" opacity=".55"/><ellipse cx="44" cy="34" rx="3" ry="1.8" fill="${c[3]}" opacity=".55"/></svg>`}
function curSkin(){if((SAVE.skin==='acc'||!SAVE.skin)&&CFG.skin&&CFG.skin.length>=4)return['Как в аккаунте',...CFG.skin.slice(1,4)];return SKS[SAVE.skin]||SKS.grey}
function nickNow(){return SAVE.nick||CFG.nick||'Котозаяц'}
function menuStats(el){el.innerHTML=`<div><small>Рекорд</small><b>${(+SAVE.best||0).toFixed(1)}%</b></div><div><small>Поймано</small><b>${SAVE.kills||0}</b></div><div><small>Побед</small><b>${SAVE.wins||0}</b></div>`}
function buildMenu(){const k=curSkin();$('#mWho').innerHTML=skSvg(k,52)+`<div><b>${esc(nickNow())}</b><small><span class="chip" style="background:${COLS[selCol]}"></span>${esc(k[0])}</small></div>`;menuStats($('#mStats'));
 $('#mBack').innerHTML=CFG.embedded?'<button class="btn ghost" id="bBack">← В лаунчер</button>':''}
function buildSet(){$('#iNick').value=SAVE.nick||CFG.nick||'';$('#iQ').value=String(QUAL);$('#iCam').value=String(+SAVE.cam||1);$('#iSnd').value=String(+SAVE.snd?1:0);$('#iNames').value=String(+SAVE.names?1:0);
 $('#iCol').innerHTML=COLS.map((c,i)=>`<i data-c="${i}" style="background:${c}" class="${i===selCol?'on':''}"></i>`).join('')}
function buildSkins(){const cur=CFG.skin&&(SAVE.skin==='acc'||!SAVE.skin)?'acc':(SKS[SAVE.skin]?SAVE.skin:'grey');let h='';
 if(CFG.skin&&CFG.skin.length>=4)h+=`<div class="sk${cur==='acc'?' on':''}" data-sk="acc">${skSvg(CFG.skin)}<span>Как в аккаунте</span></div>`;
 for(const k in SKS)h+=`<div class="sk${cur===k?' on':''}" data-sk="${k}">${skSvg(SKS[k])}<span>${esc(SKS[k][0])}</span></div>`;$('#skGrid').innerHTML=h}
function screen(id){for(const x of['#sMenu','#sSet','#sSkin'])$(x).classList.toggle('on',x===id)}
$('#iCol').addEventListener('click',e=>{const i=e.target.dataset.c;if(i==null)return;selCol=+i;SAVE.col=selCol;saveStats();buildSet();sfx('click')});
$('#skGrid').addEventListener('click',e=>{const d=e.target.closest('[data-sk]');if(!d)return;SAVE.skin=d.dataset.sk;saveStats();buildSkins();sfx('click')});
$('#iQ').addEventListener('change',e=>{QUAL=+e.target.value;SAVE.q=QUAL;saveStats();resize();initShadow(QUAL===2?2048:1024)});
$('#iCam').addEventListener('change',e=>{SAVE.cam=+e.target.value;saveStats()});
$('#iSnd').addEventListener('change',e=>{SAVE.snd=+e.target.value;saveStats();sfx('click')});
$('#iNames').addEventListener('change',e=>{SAVE.names=+e.target.value;saveStats();showHud(mode==='play')});
$('#iNick').addEventListener('input',e=>{SAVE.nick=e.target.value.trim().slice(0,16);saveStats()});
$('#iNick').addEventListener('keydown',e=>{if(e.key==='Enter'){buildMenu();screen('#sMenu')}e.stopPropagation()});
document.addEventListener('click',e=>{const id=e.target.id;if(id==='bPlay'||id==='bAgain')start();if(id==='bMenu'||id==='bQuit')toMenu();if(id==='bRes')pause(false);if(id==='bBack')exitToLauncher();
 if(id==='bSet'){sfx('click');buildSet();screen('#sSet')}if(id==='bSkins'){sfx('click');buildSkins();screen('#sSkin')}if(id==='bSetOk'||id==='bSkinOk'){sfx('click');buildMenu();screen('#sMenu')}});
addEventListener('keydown',e=>{if(e.code==='Escape'&&($('#sSet').classList.contains('on')||$('#sSkin').classList.contains('on'))){buildMenu();screen('#sMenu')}});
function exitToLauncher(){try{parent.postMessage({koto:'exit'},'*')}catch(e){}}
function fur(){const k=curSkin();return[k[1],k[2],k[3]]}
function start(){ac();sfx('click');const nick=nickNow();
 T=0;resetWorld(9,{nick,col:selCol,fur:fur()});mode='play';playT=0;cam.x=me.x;cam.z=me.z;cam.zoom=1;mouse.use=false;touch=null;
 for(const s of['#sMenu','#sSet','#sSkin','#sOver','#sPause'])$(s).classList.remove('on');showHud(true);$('#hFeed').innerHTML=''}
function toMenu(){mode='menu';for(const s of['#sOver','#sPause'])$(s).classList.remove('on');$('#sMenu').classList.add('on');showHud(false);resetWorld(10,null);buildMenu()}
function pause(on){if(on&&mode==='play'){mode='pause';$('#sPause').classList.add('on')}else if(!on&&mode==='pause'){mode='play';$('#sPause').classList.remove('on')}}
const WHY={self:'Ты наступил на свой хвост 😿',land:'Твою землю захватили полностью',head:'Лобовое столкновение',trail:'Кто-то перебежал твой хвост'};
function gameOver(why,by,won){if(mode!=='play')return;mode='over';const pct=won?cnt[me.id]/GG*100:(me.maxPct||0);
 SAVE.games=(SAVE.games||0)+1;SAVE.time=(SAVE.time||0)+playT;if(won)SAVE.wins=(SAVE.wins||0)+1;const rec=pct>(+SAVE.best||0)&&SAVE.games>1;if(rec)SAVE.best=+pct.toFixed(2);saveStats();
 setTimeout(()=>{$('#oT').textContent=won?'🏆 Победа!':rec?'🎉 Новый рекорд!':'Игра окончена';
  $('#oWhy').innerHTML=won?`Ты захватил ${WIN_PCT}% поля!`:by&&by!==me?`Тебя поймал <b style="color:${COLS[by.colI]}">${esc(by.name)}</b>`:WHY[why]||'';
  const m=Math.floor(playT/60),s=Math.floor(playT%60);$('#oStats').innerHTML=`<div><small>Макс. территория</small><b>${pct.toFixed(1)}%</b></div><div><small>Поймано</small><b>${me.kills}</b></div><div><small>Время</small><b>${m}:${String(s).padStart(2,'0')}</b></div>`;
  $('#sOver').classList.add('on');showHud(false)},won?600:1300)}

/* ===================== цикл ===================== */
function step(dt){T+=dt;if(mode==='play')playT+=dt;
 for(const p of players){if(!p.alive){if(!p.human&&p.resp&&T>p.resp){p.resp=0;p.name=botName();p.colI=botColor();p.rgb=colRGB[p.colI];p.fur=FURS[Math.floor(Math.random()*FURS.length)].map(lin);p.aggr=rnd(.6,1.35);if(p.lb){p.lb.remove();p.lb=null}spawn(p)}continue}
  if(p.human)humanInput();else botThink(p,dt);moveP(p,dt);
  if(p.alive){p.dust-=dt;if(p.dust<=0){p.dust=.07;const own=owner[p.cell]===p.id;spark(p.x-Math.cos(p.ang)*.55+rnd(-.2,.2),p.z-Math.sin(p.ang)*.55+rnd(-.2,.2),own?p.rgb.map(v=>Math.pow(v,2.2)*.35):[.17,.13,.07],3)}}}
 stepParts(dt);if(cam.shake>0)cam.shake=Math.max(0,cam.shake-dt);
 if(me&&me.alive){cam.tx=me.x;cam.tz=me.z;const pct=cnt[me.id]/GG*100;me.maxPct=Math.max(me.maxPct||0,pct);cam.zoom+=((1+Math.min(.55,Math.sqrt(pct)*.11))-cam.zoom)*dt;if(mode==='play'&&pct>=WIN_PCT){sfx('win');for(let k=0;k<120;k++)spark(me.x+rnd(-4,4),me.z+rnd(-4,4),COLS.map(hex)[k%COLS.length],2);gameOver('win',null,true)}}}
let acc=0,hudAcc=0;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;if(document.hidden)return;
 if(mode!=='pause'){acc+=dt;while(acc>1/120){step(1/120);acc-=1/120}}
 try{render()}catch(e){console.error(e)}labels();hudAcc+=dt;if(hudAcc>.2){hudAcc=0;hud();drawMini()}}
toMenu();requestAnimationFrame(frame);
window.KOTO_DEBUG={cam,get players(){return players},get mode(){return mode},cnt,owner,trailOw,start,step,kill,G};
</script></body></html>
