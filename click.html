 --b:3px;--sh:0 5px 0 var(--ink);--sh2:0 3px 0 var(--ink);--r:22px;--gold:#ffcf3a;--f:"KZ","Nunito","Segoe UI",Roboto,system-ui,sans-serif}
html.light{--bg:#ffe6c7;--bg2:#fff0dc;--paper:#fffaf1;--paper2:#ffefd9;--ink:#2a1f4d;--tx:#2a1f4d;--mut:#7d6b92;
 --acd:color-mix(in srgb,var(--ac) 70%,#2a1f4d);--acs:color-mix(in srgb,var(--ac) 30%,#fffaf1);--wall:color-mix(in srgb,var(--ac) 28%,#fff3e0);--wall2:color-mix(in srgb,var(--ac) 18%,#fff3e0);--floor:#dca06a;--floor2:#c98a55;--sky1:#7cc8ff;--sky2:#d6f0ff}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--tx);font:700 15px/1.3 var(--f);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{background:var(--bg);background-image:radial-gradient(circle at 12px 12px,color-mix(in srgb,var(--ink) 14%,transparent) 2px,transparent 2.5px);background-size:28px 28px}
html.light body{background-image:radial-gradient(circle at 12px 12px,color-mix(in srgb,var(--ac) 30%,transparent) 2px,transparent 2.5px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:var(--tx)}
.scr{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr.on{display:flex;animation:scrIn .35s cubic-bezier(.2,1.2,.3,1)}
@keyframes scrIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.mut{color:var(--mut)}
/* sticker parts */
.pap{background:var(--paper);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;background:var(--ac);color:var(--on);font-weight:900;font-size:16px;border:var(--b) solid var(--ink);box-shadow:var(--sh);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;position:relative}
.btn::before{content:"";position:absolute;left:8px;right:8px;top:4px;height:30%;border-radius:10px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--paper2);color:var(--tx)}
.btn.dis,.btn:disabled{background:var(--paper2);color:var(--mut);filter:none;cursor:default}
.btn.dis::before{display:none}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:13px;box-shadow:var(--sh2)}
.btn.red{background:#ff8a8a;color:#3a0a0a}
.btn.hw{background:linear-gradient(#ffb056,#ff7a1a);color:#2a0e00}
.btn.green{background:#7fe08a}
.rbtn{width:52px;height:52px;flex:none;border-radius:50%;background:var(--paper);border:var(--b) solid var(--ink);box-shadow:var(--sh);display:grid;place-items:center;font-size:22px;transition:transform .08s,box-shadow .08s}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tag{display:inline-block;font-size:10.5px;font-weight:1000;letter-spacing:.05em;padding:2px 8px;border-radius:99px;border:2px solid var(--ink);background:#ffb3c4;color:#3a0a18;text-transform:uppercase}
.tag.hw{background:#ff9a3c;color:#2a0e00}.tag.ex{background:#ffd75e;color:#3a2000}
.outl{color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,120px) rotate(-2deg);background:var(--gold);color:#2a1a00;padding:10px 18px;border-radius:16px;border:var(--b) solid var(--ink);box-shadow:var(--sh);font-weight:900;z-index:90;transition:.35s cubic-bezier(.2,1.4,.3,1);pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0) rotate(-2deg)}
/* modal */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 60%,transparent);padding:16px}
#modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#mbox{width:100%;max-width:440px;max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border:var(--b) solid var(--ink);border-radius:28px;padding:24px 20px 20px;box-shadow:0 8px 0 var(--ink);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-3deg);opacity:0}}
#mbox h2{margin:0 0 8px;font-size:28px;font-weight:1000}
#mbox h4{margin:18px 0 10px;color:var(--ac);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:1000}
html.light #mbox h4{color:var(--acd)}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:12px;background:var(--paper2);border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.opt .oi{width:44px;height:44px;border-radius:14px;background:var(--acs);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:20px;flex:none}
.opt .ot{flex:1;min-width:0}.opt .ot b{display:block;font-size:16px}.opt .ot small{color:var(--mut);font-size:13px;font-weight:700}
.tg{width:58px;height:34px;border-radius:99px;background:var(--bg2);border:2.5px solid var(--ink);position:relative;transition:.2s;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:23px;height:23px;border-radius:50%;background:var(--mut);border:2px solid var(--ink);transition:.25s cubic-bezier(.3,1.5,.5,1)}
.tg.on{background:var(--ac)}.tg.on::after{left:25px;background:#fff}
.seg{display:flex;gap:6px;background:var(--bg2);border:2.5px solid var(--ink);border-radius:18px;padding:5px}
.seg button{flex:1;min-height:40px;border-radius:12px;font-weight:900;color:var(--mut);transition:.15s;white-space:nowrap;padding:0 6px;font-size:14.5px}
.seg button.on{background:var(--ac);color:var(--on);box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 var(--ink)}
.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.colors button{aspect-ratio:1;border-radius:12px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .12s}
.colors button.on{transform:translateY(-4px) rotate(-8deg);box-shadow:0 6px 0 var(--ink),0 0 0 3px var(--paper),0 0 0 6px var(--tx)}
@media (max-width:400px){.colors{grid-template-columns:repeat(4,1fr)}}
.form label{display:block;font-size:13px;font-weight:900;color:var(--mut);margin:12px 4px 6px}
.form input{width:100%;height:50px;border-radius:15px;border:2.5px solid var(--ink);background:var(--bg2);padding:0 16px;outline:none;font-weight:800;box-shadow:inset 0 3px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.form input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 40%,transparent)}
.err{color:#ff7a7a;font-weight:900;min-height:20px;margin:10px 4px 0;font-size:14px}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.deco i{position:absolute;font-style:normal;opacity:.18;animation:floaty linear infinite}
@keyframes floaty{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
/* ---------- avatar ---------- */
.ava{--s:280px;position:relative;width:var(--s);height:var(--s);flex:none}
.ava .ring{position:absolute;inset:0;border-radius:50%;background:var(--ac);box-shadow:0 0 0 calc(var(--s)*.012 + 2px) var(--ink),0 calc(var(--s)*.025) 0 calc(var(--s)*.012 + 2px) var(--ink)}
.ava .disc{position:absolute;inset:calc(var(--s)*.035);border-radius:50%;overflow:hidden;background:#1f1a2e;box-shadow:inset 0 0 0 calc(var(--s)*.008 + 1px) var(--ink)}
.ava .bgl{position:absolute;inset:0}
.ava .sk{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.ava .hat{position:absolute;pointer-events:none;filter:drop-shadow(0 calc(var(--s)*.012) 0 rgba(0,0,0,.35));transform-origin:50% 92%}
.ava .hat svg{width:100%;height:100%;display:block;overflow:visible}
.ava .orb{position:absolute;inset:calc(var(--s)*-.07);animation:orb 9s linear infinite;pointer-events:none}
.ava .orb span{position:absolute;left:50%;top:0;font-size:calc(var(--s)*.13);animation:orbr 9s linear infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
@keyframes orb{to{transform:rotate(360deg)}}@keyframes orbr{from{transform:translate(-50%,-30%) rotate(0)}to{transform:translate(-50%,-30%) rotate(-360deg)}}
.ava.cut .sk{transform:translateY(2%)}
.ava.ghost .sk{filter:drop-shadow(0 0 calc(var(--s)*.05) #bfe8ff)}
.ava.pumpkin .sk{filter:drop-shadow(0 0 calc(var(--s)*.04) #ff8a1f)}
.ava.night .sk{filter:drop-shadow(0 0 calc(var(--s)*.04) #b48cff)}
.f-gold .ring{background:conic-gradient(from 20deg,#fff6b0,#e0a400,#fff1a0,#c88a00,#ffe27a,#fff6b0)}
.f-neon .ring{background:var(--ac);animation:neon 1.4s ease-in-out infinite alternate}
@keyframes neon{from{filter:drop-shadow(0 0 6px var(--ac))}to{filter:drop-shadow(0 0 22px var(--ac))}}
.f-ice .ring{background:linear-gradient(135deg,#f2feff,#7fd3ff,#d6f6ff,#5ab0ff,#e8fbff)}
.f-rainbow .ring{background:conic-gradient(#ff5e7a,#ffb03a,#ffe14a,#5fe08a,#4ad6ff,#7a8cff,#d07aff,#ff5e7a);animation:spin 3.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.f-pumpkin .ring{background:repeating-conic-gradient(#ff8a1f 0 9deg,#e2620a 9deg 18deg)}
.f-web .ring{background:conic-gradient(#f2f0ff,#9b97b5,#ecebf5,#7d7898,#f2f0ff)}
.f-candy .ring{background:repeating-conic-gradient(#fff 0 10deg,#ff3f6e 10deg 20deg)}
.f-candle .ring{background:linear-gradient(#ffcf6a,#ff7a1a 40%,#6a1fa0);animation:flick 1.8s infinite}
@keyframes flick{0%,100%{filter:drop-shadow(0 0 10px #ff9a3c)}40%{filter:drop-shadow(0 0 20px #ffcf6a)}70%{filter:drop-shadow(0 0 6px #ff7a1a)}}
.f-stars .ring{background:radial-gradient(circle at 20% 20%,#fff 0 2%,transparent 3%),radial-gradient(circle at 80% 30%,#fff 0 2%,transparent 3%),radial-gradient(circle at 60% 85%,#fff 0 2%,transparent 3%),linear-gradient(135deg,#3a2a8a,#7a5cff,#2b1f6e)}
.webdeco{position:absolute;left:-6%;top:-6%;width:46%;opacity:.85;pointer-events:none}
.b-accent .bgl{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--ac) 45%,#2a2340),#1d1829 78%)}
html.light .b-accent .bgl{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--ac) 40%,#fff),color-mix(in srgb,var(--ac) 30%,#ffe6c7) 78%)}
.b-sky .bgl{background:radial-gradient(ellipse 30% 14% at 25% 30%,#fff 60%,transparent 62%),radial-gradient(ellipse 26% 12% at 75% 22%,#fffffff0 60%,transparent 62%),linear-gradient(#6cc4ff,#d8f1ff)}
.b-meadow .bgl{background:radial-gradient(circle at 80% 18%,#fff7b0 0 7%,transparent 8%),radial-gradient(ellipse 90% 40% at 30% 100%,#5fbf4a 60%,transparent 61%),radial-gradient(ellipse 80% 40% at 90% 100%,#7ccf5a 60%,transparent 61%),linear-gradient(#9fe0ff,#e2f7ff 70%)}
.b-sunset .bgl{background:radial-gradient(circle at 50% 70%,#ffe08a 0 12%,transparent 13%),linear-gradient(#5a2a8a,#ff5e9c 55%,#ffb35a)}
.b-space .bgl{background:radial-gradient(circle at 15% 20%,#fff 0 .6%,transparent 1%),radial-gradient(circle at 70% 15%,#fff 0 .5%,transparent 1%),radial-gradient(circle at 85% 60%,#fff 0 .7%,transparent 1.1%),radial-gradient(circle at 30% 75%,#fff 0 .5%,transparent 1%),radial-gradient(circle at 75% 85%,#ff9be0 0 10%,transparent 30%),radial-gradient(circle at 20% 40%,#5a3aff55 0 10%,transparent 45%),#0b0820}
.b-hwnight .bgl{background:radial-gradient(circle at 78% 22%,#fff3c4 0 11%,#ffe08a33 13%,transparent 26%),linear-gradient(#1a0f2e,#3d1a52 70%,#ff7a1a55)}
.b-moon .bgl{background:radial-gradient(circle at 50% 42%,#fff8d8 0 30%,#ffe08a 31%,#ffb35a22 40%,transparent 55%),linear-gradient(#0e1030,#251a4a)}
.b-field .bgl{background:repeating-linear-gradient(90deg,transparent 0 18%,#ff8a1f22 18% 19%),linear-gradient(#ffe7c2,#ffb35a)}
/* logo */
.logo{display:inline-flex;flex-direction:column;align-items:center;transform:rotate(-3deg);line-height:.9}
.logo b{font-size:clamp(40px,11vw,62px);font-weight:1000;letter-spacing:-1px;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo b span{color:var(--ac)}
.logo i{font-style:normal;margin-top:4px;background:var(--gold);color:#2a1a00;border:var(--b) solid var(--ink);box-shadow:var(--sh2);border-radius:12px;padding:3px 14px;font-size:clamp(15px,3.6vw,20px);font-weight:1000;letter-spacing:.32em;transform:rotate(4deg)}
/* ---------- AUTH ---------- */
#auth .in{max-width:420px;margin:0 auto;padding:24px 16px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;z-index:1}
#auth .pap{width:100%;padding:18px}
.known{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* ---------- MENU ---------- */
#menu .top{display:flex;align-items:center;gap:10px;padding:14px 16px 0;position:relative;z-index:2;max-width:1000px;margin:0 auto;width:100%}
.acc{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;min-width:0;max-width:280px;text-align:left}
.acc .ava{--s:40px}.acc .ava .orb,.acc .ava .hat{display:none}
.acc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:1000}.acc small{color:var(--mut);display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .mid{flex:1;overflow-y:auto;position:relative;z-index:1;width:100%;max-width:1000px;margin:0 auto;padding:6px 16px 20px;display:grid;gap:14px;align-content:safe center;justify-items:center}
.hero{position:relative;display:flex;flex-direction:column;align-items:center}
.podium{position:relative;display:grid;place-items:center;padding-bottom:18px}
.podium::after{content:"";position:absolute;bottom:0;width:80%;height:34px;border-radius:50%;background:var(--acd);border:var(--b) solid var(--ink);box-shadow:var(--sh);z-index:-1}
.podium .ava{--s:min(46vw,26vh,230px);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.ribbon{margin-top:-6px;position:relative;z-index:2;background:var(--gold);color:#2a1a00;border:var(--b) solid var(--ink);box-shadow:var(--sh);border-radius:16px;padding:6px 18px;text-align:center;transform:rotate(-2deg)}
.ribbon b{font-size:26px;font-weight:1000;display:block;line-height:1}.ribbon small{font-size:12.5px;font-weight:900;opacity:.75}
.gift{position:absolute;right:-14px;top:42%;width:62px;height:62px;border-radius:20px;font-size:32px;display:grid;place-items:center;animation:wig 2.4s ease-in-out infinite;z-index:3}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.gift .dot{position:absolute;top:-8px;right:-8px;background:#ff4f6e;color:#fff;font-size:11px;font-weight:1000;border:2.5px solid var(--ink);border-radius:99px;padding:1px 6px}
.mlist{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px}
.mi{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:22px;background:var(--paper);border:var(--b) solid var(--ink);box-shadow:var(--sh);text-align:left;transition:transform .08s,box-shadow .08s;position:relative}
.mi:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mi .ic{width:54px;height:54px;border-radius:16px;border:var(--b) solid var(--ink);display:grid;place-items:center;font-size:28px;flex:none;background:var(--acs)}
.mi .tx{flex:1;min-width:0}.mi b{display:block;font-size:19px;font-weight:1000}.mi small{display:block;color:var(--mut);font-size:13px;font-weight:800}
.mi .ar{font-size:24px;font-weight:1000;opacity:.6}
.mi.play{background:var(--ac);color:var(--on);padding:16px;justify-content:center;font-size:30px;font-weight:1000;letter-spacing:.04em;min-height:80px}
.mi.play::before{content:"";position:absolute;left:12px;right:12px;top:6px;height:30%;border-radius:14px;background:rgba(255,255,255,.3)}
.mi.play .pl{width:46px;height:46px;border-radius:50%;background:var(--on);color:var(--ac);display:grid;place-items:center;font-size:20px;border:var(--b) solid var(--ink)}
.mi.hw{background:linear-gradient(120deg,#41175a,#22102e 70%,#5a2408);color:#fff}
.mi.hw small{color:#ffb37a}.mi.hw .ic{background:#ff8a1f}
.mi .badge{position:absolute;right:-6px;top:-10px;background:#ff4f6e;color:#fff;font-size:11px;font-weight:1000;padding:3px 9px;border-radius:99px;border:2.5px solid var(--ink);transform:rotate(6deg)}
.mfoot{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
@media (min-width:860px){#menu .mid{grid-template-columns:1fr 1fr;align-items:center;column-gap:40px}.hero{grid-row:1/3}.mlist{grid-column:2}.mfoot{grid-column:1/-1}.podium .ava{--s:min(28vw,40vh,280px)}}
/* ---------- GAME ---------- */
#game{flex-direction:column}
.gl{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.hud{display:flex;align-items:center;gap:10px;padding:12px 14px 0;position:relative;z-index:5}
.cnt{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 8px;border-radius:20px;background:var(--paper)}
.cnt .ci{width:46px;height:46px;border-radius:14px;background:#ff9a3c;border:var(--b) solid var(--ink);display:grid;place-items:center;font-size:26px;flex:none;transform:rotate(-6deg)}
.cnt .cv{min-width:0}.cnt .num{font-size:clamp(28px,8vw,40px);font-weight:1000;line-height:1;white-space:nowrap;letter-spacing:-.5px}
.cnt small{display:block;color:var(--mut);font-weight:900;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none;position:relative;z-index:5}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:12px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-weight:900;font-size:13.5px;flex:none}
.chip.ac{background:var(--ac);color:var(--on)}
.chip.sl{background:#9fb0ff;color:#121040}
/* room */
.roomw{flex:1;min-height:0;padding:8px 14px 14px;position:relative;z-index:3}
#room{position:relative;width:100%;height:100%;border-radius:28px;border:var(--b) solid var(--ink);box-shadow:var(--sh);overflow:hidden;background:var(--wall);background-image:radial-gradient(circle at 10px 10px,var(--wall2) 3px,transparent 3.5px),linear-gradient(90deg,transparent 49%,color-mix(in srgb,var(--wall2) 60%,transparent) 49% 51%,transparent 51%);background-size:34px 34px,68px 100%;touch-action:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:var(--fl);background:repeating-linear-gradient(90deg,var(--floor) 0 58px,var(--floor2) 58px 61px);border-top:var(--b) solid var(--ink)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:rgba(0,0,0,.18)}
.win{position:absolute;left:7%;top:10%;width:min(24%,150px);aspect-ratio:1/1.1;border:var(--b) solid var(--ink);border-radius:18px 18px 8px 8px;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:var(--b);background:var(--ink)}
.win::after{content:"";position:absolute;top:50%;left:0;right:0;height:var(--b);background:var(--ink)}
.win .sun{position:absolute;right:14%;top:12%;width:30%;aspect-ratio:1;border-radius:50%;background:#fff2b0;box-shadow:0 0 18px #fff2b0}
html.light .win .sun{background:#ffd23a;box-shadow:0 0 20px #ffd23a}
.win .cl{position:absolute;left:8%;bottom:20%;width:44%;height:14%;border-radius:20px;background:#fff;opacity:.9}

function fmt(n){if(!isFinite(n))return'∞';n=Math.max(0,n);if(n<1000)return n<10&&n%1?n.toFixed(1).replace(/\.0$/,''):String(Math.floor(n));
 if(SET&&SET.num==='sci')return n.toExponential(2).replace('e+','e');
 const e=Math.min(SUF.length-1,Math.floor(Math.log10(n)/3)),v=n/Math.pow(1000,e);
 return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v).toString()).replace(/\.?0+$/,'')+SUF[e]}
const fmtInt=n=>Math.floor(n).toLocaleString('ru-RU');
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c}

function djb(u,p){const str='kz::'+u+'::'+p;let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return'd'+(h>>>0).toString(16)}
async function hashPw(u,p){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kz::'+u+'::'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return djb(u,p)}

  const ps=perSec();if(ps){S.c+=ps*dt;S.tot+=ps*dt}

function u8b64(u){u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function b64u8(x){return Uint8Array.from(atob(x),c=>c.charCodeAt(0))}
function mqStr(x){const b=mqEnc.encode(x);const o=[b.length>>8,b.length&255];for(const y of b)o.push(y);return o}
function mqPkt(h,body){const len=[];let n=body.length;do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d)}while(n>0);const out=new Uint8Array(1+len.length+body.length);out[0]=h;out.set(len,1);out.set(body,1+len.length);return out}
class MQ{
 constructor(url){this.url=url;this.ok=false;this.subs=new Set();this.buf=new Uint8Array(0);this.pid=1;this.tries=0;this.open()}
 open(){let ws;try{ws=new WebSocket(this.url,['mqtt'])}catch(e){this.retry();return}this.ws=ws;ws.binaryType='arraybuffer';this.buf=new Uint8Array(0);
  ws.onopen=()=>{this.raw(mqPkt(0x10,[...mqStr('MQTT'),4,2,0,60,...mqStr('ks'+Math.random().toString(36).slice(2,12))]))};
  ws.onmessage=e=>{if(e.data instanceof ArrayBuffer)this.feed(new Uint8Array(e.data))};
  ws.onclose=()=>{this.ok=false;clearInterval(this.ka);this.retry()};ws.onerror=()=>{try{ws.close()}catch(e){}}}
 retry(){this.tries++;clearTimeout(this.rt);this.rt=setTimeout(()=>this.open(),Math.min(30000,1500*this.tries))}
 feed(chunk){const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
  while(this.buf.length>=2){let mul=1,len=0,i=1,byte;do{if(i>=this.buf.length)return;byte=this.buf[i++];len+=(byte&127)*mul;mul*=128}while(byte&128);
   if(this.buf.length<i+len)return;const h=this.buf[0],body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);this.handle(h,body)}}
 handle(h,body){const t=h>>4;
  if(t===2){if(body[1]===0){this.ok=true;this.tries=0;for(const x of this.subs)this.sendSub(x);clearInterval(this.ka);this.ka=setInterval(()=>this.raw(new Uint8Array([0xC0,0])),25000);setTimeout(netPresence,300);admSoon()}else{try{this.ws.close()}catch(e){}}}
  else if(t===3){const qos=(h>>1)&3,tl=(body[0]<<8)|body[1];const topic=mqDec.decode(body.subarray(2,2+tl));let o=2+tl;if(qos)o+=2;netRecv(topic,body.subarray(o))}}
 raw(pk){try{if(this.ws&&this.ws.readyState===1)this.ws.send(pk)}catch(e){}}
 sendSub(topic){this.pid=(this.pid%65535)+1;this.raw(mqPkt(0x82,[this.pid>>8,this.pid&255,...mqStr(topic),0]))}
 sub(topic){if(this.subs.has(topic))return;this.subs.add(topic);if(this.ok)this.sendSub(topic)}
 pub(topic,obj,retain){if(!this.ok)return false;const pl=mqEnc.encode(JSON.stringify(obj)),tp=mqStr(topic),body=new Uint8Array(tp.length+pl.length);body.set(tp);body.set(pl,tp.length);this.raw(mqPkt(retain?0x31:0x30,body));return true}
}

 if(t.local&&!t.online||t.local&&t.dev==='here'){const sv=readSave(t.u)||fresh();const T=Object.assign(fresh(),sv);T.own=Object.assign(fresh().own,sv.own||{});T.hw=Object.assign(fresh().hw,sv.hw||{});items.forEach(it=>giftApply(T,it));LS.set('kz_click_u_'+t.u,JSON.stringify(T));toast('✅ '+label+' → @'+t.u);admLog('✅ @'+t.u+': '+label);SFX.buy();renderAdm();return}
 if(!SIGK){toast('🔑 Для выдачи на другие устройства нужен ключ ADM');ADT='key';renderAdm();return}

 await sendOut(t.gid,items);toast('📡 '+label+' → @'+t.u);admLog('📡 @'+t.u+': '+label);SFX.buy();renderAdm()}

 ADMS=[...new Set(list.filter(u=>u&&u!=='deta'))];ADMS_TS=Date.now();LS.set('kz_click_adms',JSON.stringify({l:ADMS,ts:ADMS_TS}));await signPub(LTP+'adms',{list:ADMS,ts:ADMS_TS});return true}

 WORLD=Object.assign({},WORLD,o,{ts:Date.now()});await signPub(LTP+'w',WORLD);admLog('🌍 '+label);toast('📡 '+label);SFX.gold();_lastChips='';renderAdm()}

 <div class="arow"><input class="ain" id="aK" placeholder="Конфеты 🍬" inputmode="numeric"><button class="btn sm hw" data-adg="candy">+ Дать</button><input class="ain" id="aP" placeholder="Уровень пасса 0–30" inputmode="numeric" style="max-width:150px"><button class="btn sm hw" data-adg="pass">🎟</button></div>

 $('#admKeyPill').textContent=SIGK?'🔓 ключ':(IS_DETA?'🔒 без ключа':'🛠 ADM');$('#admTabs').innerHTML=admTabsHtml();let h='';

  <div class="arow wrap"><span class="chip">🥕 ${fmt(S.c)}</span><span class="chip">+${fmt(clickBase())} за клик</span><span class="chip">🍬 ${S.hw.candy}</span><span class="chip">🎟 ${passLvl()}/30</span></div></div>`;

  <div class="arow wrap"><button class="btn sm" data-adx="gold">🥕 Золотая морковка</button><button class="btn sm hw" data-adx="pk">🎃 Тыква</button><button class="btn sm ghost" data-adx="sleep">😴 Уложить спать</button><button class="btn sm ghost" data-adx="wake">⏰ Разбудить</button><button class="btn sm ghost" data-adx="daily">🎁 Сбросить подарок дня</button><button class="btn sm red" data-adx="reset">🗑 Обнулить себя</button></div></div>`}
 else if(ADT==='pl'){const L=admTargets();if(admSel===ACC&&ADT==='pl'&&!admSel)admSel=null;
  h+=`<div class="adp pap"><h3>👥 Игроки · ${L.length}</h3><p class="mut">${NET.ok()?'🟢 онлайн-сервер на связи':'🟡 подключаюсь к онлайн-серверу…'} · игроки на других устройствах появляются, когда заходят в Kotozaic Clicker${SIGK?'':' · 🔑 без ключа можно выдавать только аккаунтам на этом устройстве'}</p>

  ${L.map(t=>{const ad=t.u==='deta'||ADMS.includes(t.u);return `<div class="prow${admSel===t.u?' on':''}" data-adsel="${esc(t.u)}"><b>${ad?'🛠 ':''}${esc(t.nick)} <span class="mut">@${esc(t.u)}</span>${t.u===ACC?' · это ты':''}</b><small>🥕 ${fmt(t.c||0)} · ${t.dev==='here'?'💻 это устройство':(t.dev==='phone'?'📱 ':'💻 ')+ago(t.last)}</small></div>`}).join('')}</div></div>`;
  if(admSel){const t=L.find(x=>x.u===admSel);h+=giveBox(admSel==='*'?'всем игрокам':esc(t?t.nick+' @'+t.u:admSel));
   if(IS_DETA&&admSel!=='*'&&admSel!=='deta'){const on=ADMS.includes(admSel);h+=`<div class="adp pap"><h3>🛠 Админка для @${esc(admSel)}</h3><p class="mut">${on?'У игрока есть ADM: он может выдавать вещи себе.':'Игрок получит свою ADM-панель (выдача себе и читы).'} Выдавать и забирать ADM можно только с ключом.</p><button class="btn ${on?'red':''}" data-adadm="${on?'off':'on'}">${on?'❌ Забрать ADM':'🛠 Выдать ADM'}</button></div>`}}}
 else if(ADT==='world'){const act=worldMult()>1;
  h+=`<div class="adp pap"><h3>🌍 События для всех</h3><p class="mut">Работают на всех устройствах. Нужен ключ.</p>${act?`<p><b>🔥 Сейчас: морковка ×${WORLD.xm}, ещё ${Math.ceil((WORLD.until-Date.now())/60000)} мин</b></p>`:''}
  <div class="arow"><select class="ain" id="awX"><option value="2">×2</option><option value="3">×3</option><option value="5">×5</option><option value="10">×10</option></select><input class="ain" id="awM" value="30" inputmode="numeric" style="max-width:110px"><span class="mut">мин</span><button class="btn sm" data-adw="x">🔥 Запустить</button>${act?'<button class="btn sm red" data-adw="stop">⏹ Стоп</button>':''}</div>
  <div class="arow"><input class="ain" id="awA" placeholder="Объявление всем игрокам" maxlength="300"><button class="btn sm" data-adw="ann">📢 Объявить</button></div></div>`;
  if(IS_DETA)h+=`<div class="adp pap"><h3>🛠 Админы</h3>${ADMS.length?ADMS.map(u=>`<div class="arow"><span style="flex:1">🛠 @${esc(u)}</span><button class="btn sm red" data-adrm="${esc(u)}">Забрать</button></div>`).join(''):'<p class="mut">Кроме тебя админов нет. Выдать — во вкладке «Игроки».</p>'}
  <div class="arow"><input class="ain" id="awU" placeholder="юзернейм" autocapitalize="none"><button class="btn sm" data-adw="addadm">🛠 Выдать ADM</button></div></div>`}
 else{let L=[];try{L=JSON.parse(LS.get('kz_click_admlog'))||[]}catch(e){}
  h+=`<div class="adp pap"><h3>${SIGK?'🔓 Ключ введён':'🔑 Ключ ADM'}</h3><p class="mut">Ключ — это пароль ADM, такой же, как в Kotazaic and Stars. Он нужен, чтобы выдавать вещи на другие устройства, запускать события и выдавать/забирать админку. Ключ не сохраняется — после перезапуска игры введи его снова.</p>
  ${SIGK?'<button class="btn ghost" data-adk="lock">🔒 Забыть ключ</button>':IS_DETA?'<div class="arow"><input class="ain" id="akIn" type="password" placeholder="Пароль ADM" autocomplete="off"><button class="btn" data-adk="go">🔓 Открыть</button></div>':'<p><b>Ключ есть только у главного админа (deta).</b></p>'}</div>
  <div class="adp pap"><h3>📜 Журнал</h3>${L.length?L.slice(0,40).map(x=>`<div class="mut" style="font-size:13px;padding:3px 0">${esc(x)}</div>`).join(''):'<p class="mut">Пусто</p>'}</div>`}
 $('#admBody').innerHTML=h;fillItems()}
$('#admTabs').addEventListener('click',e=>{const b=e.target.closest('[data-adt]');if(!b)return;ADT=b.dataset.adt;if(ADT==='pl'&&admSel===ACC)admSel=null;SFX.click();renderAdm()});
$('#admBody').addEventListener('change',e=>{if(e.target.id==='aiCat')fillItems()});
$('#admBody').addEventListener('click',async e=>{const q=s=>e.target.closest(s);let b;
 if(b=q('[data-adsel]')){const u=b.dataset.adsel;admSel=admSel===u?null:u;renderAdm();return}
 if(b=q('[data-adc]')){const k=b.dataset.adc;S.adm=S.adm||{};S.adm[k]=!S.adm[k];save();b.querySelector('.tg').classList.toggle('on',S.adm[k]);SFX.click();admLog((S.adm[k]?'✅ ':'⬜ ')+'чит '+k);return}
 if(b=q('[data-adx]')){const x=b.dataset.adx;
  if(x==='gold'||x==='pk'){show('game');setTimeout(()=>spawnFloater(x),400)}
  else if(x==='sleep'){S.en=0;show('game');setTimeout(goSleep,500)}else if(x==='wake'){S.en=Math.max(S.en,wakeEn());if(SL.st==='sleep')wake();toast('⏰ Разбудил')}
  else if(x==='daily'){S.daily.last='';save();toast('🎁 Подарок дня снова доступен')}
  else if(x==='reset'){if(confirm('Обнулить свой прогресс в Kotozaic Clicker?')){const g=S.gid;S=fresh();S.gid=g;if(IS_DETA)for(const s of SKINS)if(s.ex)S.own.skin.push(s.id);save();toast('Обнулено');renderAdm()}}return}
 if(b=q('[data-adg]')){const g=b.dataset.adg;let items=[],label='';
  if(g==='c'||g==='cset'){const v=parseNum($('#aC').value);if(!isFinite(v)){toast('Не понял число. Примеры: 5000, 5M, 10Qa, 1e20');return}items=[{op:g,a:{n:v}}];label=(g==='c'?'+':'= ')+fmt(Math.abs(v))+' 🥕'}
  else if(g==='candy'){const v=Math.round(+$('#aK').value);if(!v){toast('Сколько конфет?');return}items=[{op:'candy',a:{n:v}}];label=v+' 🍬'}

  else if(g==='item'){const t=$('#aiCat').value,id=$('#aiItem').value;if(!id)return;items=[{op:'item',a:{t,id}}];label=rewardName([t,id])}

 if(b=q('[data-adadm]')){const on=b.dataset.adadm==='on',u=admSel;const ok=await setAdmins(on?ADMS.concat(u):ADMS.filter(x=>x!==u));if(ok){admLog((on?'🛠 выдан ADM @':'❌ снят ADM @')+u);toast(on?'🛠 @'+u+' теперь админ':'ADM у @'+u+' забран');SFX.gold();renderAdm()}return}
 if(b=q('[data-adrm]')){const u=b.dataset.adrm;if(await setAdmins(ADMS.filter(x=>x!==u))){admLog('❌ снят ADM @'+u);renderAdm()}return}

 if(b=q('[data-adk]')){if(b.dataset.adk==='lock'){SIGK=null;toast('🔒 Ключ забыт');renderAdm();return}
  const pw=$('#akIn').value;if(!pw)return;b.disabled=true;b.textContent='⏳ Проверяю…';try{await admUnlock(pw);toast('🔓 Ключ принят!');SFX.gold();admLog('🔓 ключ введён')}catch(err){toast('❌ Неверный ключ');SFX.no()}renderAdm()}});

 if(a==='play'){SFX.click();show('game')}
 else if(a==='skins'){SEL=null;show('skins')}
 else if(a==='hw')show('hw');

 else if(a==='help')helpModal();

 else if(a==='adm'){ADT=ADT||'me';show('adm')}

 else if(a==='reset')modal(`<h2>🗑️ Сбросить прогресс?</h2><p class="mut">Пропадёт вся морковка, улучшения, помощники, скины и аксессуары${ACC?' аккаунта @'+esc(ACC):''} в Kotozaic Clicker. Аккаунт и другие игры не пострадают.</p><div class="mrow"><button class="btn ghost" data-a="mclose">Отмена</button><button class="btn red" data-a="reset2">Да, сбросить</button></div>`);
 else if(a==='reset2'){S=fresh();if(IS_DETA)for(const s of SKINS)if(s.ex)S.own.skin.push(s.id);save();closeModal();toast('Прогресс сброшен');show('menu')}
 else if(a==='wear'){const t=b.dataset.t,id=b.dataset.id;if(t==='skin')S.skin=id;else S.eq[t]=id;save();closeModal();toast('✓ Надето');if(SCREEN==='menu')renderMenu();if(SCREEN==='skins')renderSkins()}
 return}
 const f=e.target.closest('[data-fill]');if(f){$('#fU').value=f.dataset.fill;$('#fP').focus()}});
$('#accBtn').addEventListener('click',()=>accModal());
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&SCREEN==='auth'&&!$('#modal').classList.contains('on')){doAuth(AREG)}

/* ---------- старт ---------- */

try{if(LS.get('kz_session')){switchAcc();show('menu')}else{show('auth')}}
catch(e){console.error(e);if(!S)S=loadSave();try{show('menu')}catch(e2){console.error(e2);try{show('game')}catch(e3){$('#auth').classList.add('on');renderAuth()}}}
